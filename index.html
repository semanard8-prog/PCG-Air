 kit:['SOAP-ME','Video laryngoscope (C-MAC) as the first-line device','i-Gel sized for the child','Towel roll — under the shoulders for an infant, under the occiput for an older child','Sugammadex drawn and ready'],
 svgs:[SVG_RSI, SVG_AIRWAY],
 steps:[
  {sc:'rsi', ph:'prep', t:'Prepare and position', b:[
    'Primary assessment, 4-lead ECG, NIBP, SpO₂.',
    'Align the pharyngeal and tracheal axes: move the chin anteriorly relative to the shoulders so the external auditory canal sits anterior to the shoulder and in line with the sternal notch.',
    '<b>In an older child, a towel roll goes under the occiput. In an infant the prominent occiput already does that job — the towel goes under the shoulders instead.</b>'],
   warn:'Getting this backwards in an infant closes the airway you are about to instrument.'},

  {sc:'rsi', ph:'opt', t:'Pre-oxygenate', b:['100% FiO₂ for 3–5 minutes before the first attempt, unless contraindicated.']},

  {sc:'rsi', ph:'push', t:'Standard sequence', b:[
    'Atropine is frequently used as pretreatment in infants under one year because of their predilection for vagally induced bradycardia.'],
   rx:[
    {n:'Fentanyl',d:'1 mcg/kg',r:'IV / IO',calc:{per:'kg',lo:1,u:'mcg',max:100,maxlbl:'max single dose 100 mcg'},note:'Analgesia.'},
    {n:'Etomidate',d:'0.3 mg/kg',r:'IV',calc:{per:'kg',lo:0.3,u:'mg'},note:'Induction — first option.'},
    {n:'Midazolam',d:'0.1 mg/kg',r:'IV / IO',calc:{per:'kg',lo:0.1,u:'mg',max:5,maxlbl:'max single dose 5 mg'},note:'Induction — alternative.'},
    {n:'Rocuronium',d:'1 mg/kg',r:'IV / IO',calc:{per:'kg',lo:1,u:'mg'},note:'Paralytic.'},
    {n:'Vecuronium',d:'0.1 mg/kg',r:'IV / IO',calc:{per:'kg',lo:0.1,u:'mg'},note:'Paralytic — alternative.'}]},

  {sc:'rsi', ph:'push', t:'Shock, reactive airway or cardiac dysfunction', b:[
    'A different sequence: atropine first, then ketamine, then rocuronium.'],
   rx:[
    {n:'Atropine',d:'0.02 mg/kg',r:'IV / IO',calc:{per:'kg',lo:0.02,u:'mg',max:0.5,maxlbl:'max single dose 0.5 mg'},note:'Pretreatment.'},
    {n:'Ketamine',d:'1 mg/kg',r:'IV / IO',calc:{per:'kg',lo:1,u:'mg'},note:'Induction in shock, reactive airway disease or cardiac dysfunction.'},
    {n:'Rocuronium',d:'1 mg/kg',r:'IV / IO',calc:{per:'kg',lo:1,u:'mg'},note:'Paralytic.'}]},

  {sc:'airway', t:'C-MAC and tube depth', b:[
    'Power on. Optimal blade on the handle. Tip into the right corner of the mouth, sweep the tongue left, advance to midline, tip into the vallecula, visualize the epiglottis, lift to visualize the cords.',
    'Tube in from the right side of the mouth, through the cords, <b>to a depth of 3 × the ETT size</b>. Use a bougie if the tube size allows.'],
   warn:'ETT size = (age + 16) ÷ 4. Enter an age in the bar above and the size, cuffed size and depth are computed for you.'},

  {sc:'airway', t:'Confirm placement', b:[
    'Hold the tube. Auscultate all lung fields and the epigastrium. Observe bilateral chest wall movement.',
    'EtCO₂ on — confirm after 6 breaths. Inflate the cuff, secure per policy. Chest X-ray if practical.',
    'Reconfirm with every transport movement and with the receiving physician or RT.']},

  {sc:'rsi', ph:'conf', t:'Cannot oxygenate or ventilate after a paralytic', b:[
    'Reverse it. Sugammadex reverses rocuronium and vecuronium.',
    'Infants and children under 2: dilute in normal saline to a final concentration of 25 mg/mL.'],
   rx:[{n:'Sugammadex',d:'2 mg/kg',r:'Slow IV push',calc:{per:'kg',lo:2,u:'mg'},note:'Slow push — rapid administration causes serious adverse effects. Dilute to 25 mg/mL for children under 2.'}],
   warn:'This is the reason the drug is drawn up before you push the paralytic, not after you need it.'}
 ]},

{id:'needle-decomp', t:'Chest Decompression', sub:'Needle thoracostomy',
 cat:'thorax', cls:'trauma', icon:'↧',
 src:'Adult PCG Rev 2024.04 — Chest Decompression; Pediatric PCG Rev 24.04 — Needle Thoracostomy',
 ind:['Traumatic arrest with chest or abdominal trauma where resuscitation is indicated — these patients may need bilateral decompression with none of the signs below','Peri-arrest with SBP < 90, clinical shock, and at least one of: JVD, tracheal deviation away from the injury (a late sign), absent or decreased breath sounds on the affected side, hyper-resonance to percussion, increased resistance to ventilation'],
 contra:['None'],
 kit:['12 or 14 gauge catheter, at least 3 inches for an adult — 16 or 18 gauge sized to the child','Chlorhexidine or povidone-iodine','3-way stopcock and syringe, or a Heimlich / flutter valve','Tape, gauze'],
 svgs:[SVG_CHEST, svgWall(
   '<g class="needle anim-adv-a"><path class="steel" d="M420 -10 L215 128"/><path class="hubline" d="M436 -20 L414 -5"/></g>'
  +'<g class="airjet"><path d="M215 128 L250 96"/><path d="M215 128 L236 86"/><path d="M215 128 L196 84"/></g>')],
 steps:[
  {sc:'chest', t:'PPE and oxygen', b:['Gloves and eye protection. High-flow oxygen.']},
  {sc:'chest', t:'Identify the site', b:[
    'Primary: 2nd intercostal space, mid-clavicular line, on the same side as the pneumothorax.',
    'Alternate: 4th–5th intercostal space, anterior axillary line — lateral placement. In the pediatric guideline this is the 5th ICS anterior to the mid-axillary line.',
    'Prep with povidone-iodine or chlorhexidine.'],
   warn:'Avoid implanted devices. Mid-clavicular means mid-clavicular — too medial puts you on the internal mammary artery.'},
  {sc:'wall', t:'Insert over the top of the rib', b:[
    'Enter the skin over the third rib and direct the catheter <b>just over the superior border</b> of that rib into the interspace.',
    'The neurovascular bundle runs along the <b>inferior</b> margin of each rib. Walking the needle over the top of the rib below is what keeps you off it.'],
   warn:'Over the top of the lower rib. Every time. This is the whole reason the step exists.'},
  {sc:'wall', t:'Advance through the pleura', b:[
    'Advance until you feel the pop through the parietal pleura and air or blood exits under pressure.',
    'Then advance the catheter only to the chest wall — no further.']},
  {sc:'wall', t:'Remove the needle, leave the catheter', b:[
    'Withdraw the needle. The plastic catheter stays.',
    'Pediatric technique: attach a 3-way stopcock with syringe and aspirate air as needed to relieve symptoms.']},
  {sc:'chest', t:'Secure and valve', b:[
    'Secure the hub to the chest wall with dressings and tape.',
    'Flutter valve: a finger cut from an exam glove over the hub with a small hole in the end, secured with tape or a rubber band. A commercial Heimlich valve does the same job.',
    'If only a stopcock is used, close it to the patient so air cannot enter.']},
  {sc:'chest', t:'Reassess', b:[
    'Respiratory status, breath sounds, tracheal position, jugular veins, pulse, blood pressure.',
    'A needle that has done its job and then stops working has kinked, clotted or come out. Re-decompress or escalate.'],
   xref:'If it recurs or the patient is intubated: go to finger thoracostomy or chest tube.'}
 ]},

{id:'finger-thoracostomy', t:'Finger Thoracostomy', sub:'> 36 kg',
 cat:'thorax', cls:'trauma', icon:'⊘',
 src:'Adult PCG Rev 2024.04 — Finger Thoracostomy',
 ind:['Clinical tension pneumothorax','Traumatic pneumothorax in an intubated patient','Penetrating thoracic injury with respiratory compromise','Clinical hemothorax','Traumatic cardiac arrest — perform bilateral decompression','After needle thoracostomy has been performed','Greater than 36 kg and large enough for the available tube sizes'],
 contra:['Under 36 kg or too small for the available tube sizes'],
 kit:['Scalpel','Large curved clamp (Kelly)','1% lidocaine','Occlusive dressing','Chest tube and drainage set, standing by'],
 svgs:[SVG_CHEST, svgWall(
   '<g class="clamp anim-adv-b"><path class="steel" d="M120 -6 L206 126"/><path class="steel" d="M156 -12 L214 124"/></g>'
  +'<g class="airjet"><path d="M210 126 L244 96"/><path d="M210 126 L230 84"/></g>')],
 steps:[
  {sc:'chest', t:'Oxygen and position', b:[
    'Oxygen to requirement. Supine, affected side slightly elevated, arm on that side secured out of the way.']},
  {sc:'chest', t:'Site', b:[
    '4th intercostal space, anterior axillary line, just behind the lateral edge of pectoralis major.',
    '<b>In pregnancy the site moves up to the 3rd ICS</b> because the diaphragm is elevated.'],
   warn:'Pregnancy changes the landmark. Check before you cut.'},
  {sc:'chest', t:'Anesthetize — conditionally', b:[
    'Lidocaine 1% from subcutaneous tissue through muscle, periosteum, anterior rib margin, to the pleura.'],
   rx:[{n:'Lidocaine 1%',d:'0.5 mL/kg (4 mg/kg)',r:'Local infiltration',calc:{per:'kg',lo:0.5,u:'mL',max:20,maxlbl:'10 mL is usually sufficient in an adult'},note:'Volume of 1% solution. 10 mL is usually enough for an adult.'}],
   warn:'<b>Do not anesthetize the skin on an unstable patient or in traumatic arrest.</b> The time costs more than the comfort buys.'},
  {sc:'chest', t:'Incise', b:['2–3 cm vertical incision over and along the 5th rib, anterior to the mid-axillary line.']},
  {sc:'wall', t:'Blunt dissect into the interspace', b:[
    'Curved clamp in, bluntly dissect a tunnel into the 4th ICS. Open the clamp to separate the tissue.']},
  {sc:'wall', t:'Puncture the pleura', b:[
    'Gentle but forcible, with the tip of the <b>closed</b> clamp, held close to the upper rib margin as it passes through. Then open the clamp to enlarge the hole.',
    '<b>Anchor the clamp with your hand</b> as it goes through so it cannot plunge into the pleural cavity.'],
   warn:'Close to the upper rib margin — same neurovascular rule as the needle.'},
  {sc:'wall', t:'Finger sweep', b:[
    'Finger into the pleural cavity, 360-degree sweep of the interior wall. This confirms you are actually in the chest and clears adhesions and debris.']},
  {sc:'chest', t:'Dress and reassess', b:[
    'Occlusive dressing over the wound. Reassess the patient and hemodynamics.',
    'If time and condition allow, place a chest tube through the opening you just made. If no improvement after a simple finger thoracostomy, use an appropriate chest seal.'],
   xref:'Consider converting to a chest tube.'}
 ]},

{id:'chest-tube', t:'Chest Tube Placement', sub:'Tube thoracostomy · > 36 kg',
 cat:'thorax', cls:'trauma', icon:'⌷',
 src:'Adult PCG Rev 2024.04 — Chest Tube Placement',
 ind:['Tension pneumothorax','Pneumothorax with respiratory compromise','Open pneumothorax','Penetrating thoracic injury with respiratory compromise','Hemothorax','After needle thoracostomy','Greater than 36 kg and large enough for the available tube sizes'],
 contra:['Too small for the available tube sizes'],
 kit:['28–32 French tube for an adult hemothorax or pneumothorax','Pediatric size ≈ 3 × the correct ETT size','Scalpel, large curved clamp, large hemostat','1% lidocaine','Heimlich valve or closed drainage system','Suture, Vaseline gauze, bulky dressing and tape'],
 svgs:[SVG_CHEST, svgWall(
   '<g class="tube anim-adv-b"><path class="tubeln" d="M96 -20 L212 128"/></g>'
  +'<g class="airjet"><path d="M212 128 L242 100"/></g>')],
 steps:[
  {sc:'chest', t:'Size and prepare everything first', b:[
    '28–32 Fr for an adult with hemothorax or pneumothorax. Pediatric: estimate as <b>3 × the correct ETT size</b>.',
    'Gather and prepare all equipment before you begin. There is no good point to stop halfway.'],
   warn:'If transporting from another facility, this may be done before departure — but weigh the delay case by case, and consult Medical Control where appropriate.'},
  {sc:'chest', t:'Site', b:[
    '4th ICS on the anterior mid-axillary line, just behind the lateral edge of pectoralis major.',
    '<b>Pregnancy: 3rd ICS</b> — elevated diaphragm.']},
  {sc:'chest', t:'Anesthetize', b:['Same layered infiltration as finger thoracostomy.'],
   rx:[{n:'Lidocaine 1%',d:'0.5 mL/kg (4 mg/kg)',r:'Local infiltration',calc:{per:'kg',lo:0.5,u:'mL',max:20,maxlbl:'10 mL is usually sufficient in an adult'},note:'10 mL of 1% is usually sufficient for an adult.'}],
   warn:'Not on the unstable patient or in traumatic arrest.'},
  {sc:'chest', t:'Measure the tube', b:[
    'Measure from the insertion site to the apex of the lung, and clamp distally with a large hemostat at that length. You now know your stop point before the tube is anywhere near the chest.']},
  {sc:'wall', t:'Incise and dissect', b:[
    '2–3 cm vertical incision along the 5th rib, anterior to the mid-axillary line.',
    'Curved clamp in, blunt tunnel into the 4th ICS, open to separate tissue.']},
  {sc:'wall', t:'Puncture and sweep', b:[
    'Closed clamp tip through the parietal pleura, held close to the upper rib margin, anchored by your hand. Open to enlarge.',
    'Finger alongside the clamp, 360-degree sweep, keep the tract patent until the tube goes in.'],
   warn:'In traumatic cardiac arrest a simple finger thoracostomy is acceptable and faster. Chest seal after, if no improvement.'},
  {sc:'wall', t:'Insert the tube', b:[
    'Advance until all fenestrations are inside the lateral chest wall, and/or the number 10 marking is at the skin.']},
  {sc:'chest', t:'Connect, suture, secure', b:[
    'Heimlich valve or closed drainage system.',
    'Suture in place. Vaseline gauze around the insertion site. Bulky dressing, and tape <b>both</b> the chest tube and the drainage tubing — the tubing is what gets caught on the way into the aircraft.',
    'Reassess the patient and hemodynamics.']}
 ]},

{id:'io', t:'Intraosseous Access', sub:'EZ-IO and manual',
 cat:'vascular', cls:'proc', icon:'◎',
 src:'Adult PCG Rev 2024.04 — Venous Access: Intraosseous; Pediatric PCG Rev 24.04 — Intraosseous Placement and Infusion',
 ind:['Initial means of circulatory access in cardiac arrest','Rapid IV access unavailable with multisystem trauma and severe hypovolemia','Severe dehydration with vascular collapse or loss of consciousness','Respiratory failure or arrest','Any age — any time vascular access is difficult in an emergent or urgent situation'],
 contra:['Fracture of the target bone, or proximal to the site','Previous IO attempt in that bone or proximal bones within 48 hours','Prior orthopedic procedure or joint replacement at the site','Current or prior infection at the site','Osteogenesis imperfecta','Relative: cellulitis, burns or soft-tissue injury at the site; osteoporosis or other bone disease','Excessive tissue or no identifiable landmarks'],
 kit:['EZ-IO driver and needle sets — sized by weight, anatomy and judgement','Chlorhexidine or povidone-iodine','EZ-Stabilizer dressing','Primed extension set','Two syringes of normal saline','Lidocaine 2% for the conscious patient','Pressure bag'],
 svgs:[SVG_BONE],
 steps:[
  {sc:'bone', t:'PPE and site strategy', b:[
    'Gloves and eye protection.',
    '<b>In cardiac arrest, seek the most cephalic site available</b> — drug delivery to the central circulation is faster the closer you are to the heart.']},
  {sc:'bone', t:'Humeral head — preferred adult site', b:[
    'Patient\'s palm on the umbilicus, elbow down on the stretcher. Thumb on the humeral shaft, slide up toward the head with firm pressure; the tubercle is the prominent bulge.',
    'Opposite hand pinches inferior and anterior humerus to confirm you are midline.',
    'Pediatric technique (age 7+): hand over the abdomen, elbow adducted, humerus internally rotated. Palm on the shoulder — the "ball" under your palm is the target. Ulnar edge of one hand in the axilla, the other along the lateral midline of the upper arm, thumbs together. Golf ball on a tee: where the ball meets the tee is the surgical neck. <b>Insert 1–2 cm above the surgical neck, on the most prominent part of the greater tubercle.</b>'],
   warn:'Humeral insertion angle is 45° to the anterior plane, aimed posteromedially — not 90° like the leg sites.'},
  {sc:'bone', t:'Leg sites', b:[
    '<b>Proximal tibia (all ages):</b> anteromedial proximal tibia, the bony prominence below the knee cap; insert 1–2 cm (two finger widths) below it. Pediatric description: ~1 cm medial to the tibial tuberosity, on the flat aspect.',
    '<b>Distal tibia (> 12 years in the adult guideline, all ages in the pediatric):</b> 1–2 cm proximal to the medial malleolus, on the flat centre of the bone — palpate anterior and posterior borders to be sure.',
    '<b>Distal femur (all ages):</b> leg outstretched and secured so the knee cannot bend. 1–2 cm proximal to the superior border of the patella, ~1 cm medial to midline.']},
  {sc:'bone', t:'Prep and check needle length', b:[
    'Prep with povidone-iodine or chlorhexidine.',
    'The EZ-IO catheter has a black line 5 mm from the hub. Push the needle set through the soft tissue until the tip rests on bone — <b>the 5 mm line must still be visible above the skin.</b> If it is not, the needle is too short for this patient.'],
   warn:'This check takes two seconds and is the difference between a working IO and a subcutaneous infusion.'},
  {sc:'bone', t:'Drill', b:[
    'Femur and tibia: 90° to the bone. Humerus: 45°, aimed away from the joint and the epiphyseal plate.',
    'Power the driver until you feel the pop or give of loss of resistance — <b>then release immediately. Do not advance further.</b>',
    'Avoid recoil: do not pull back on the driver as you release the trigger.',
    'Manual pediatric devices: 60–90°, twist with a rotating grinding motion and controlled downward force until the pop.'],
   warn:'Advancing past loss of resistance is how you go out the far cortex.'},
  {sc:'bone', t:'Seat and confirm', b:[
    'Hold the hub, pull the driver straight off. Still holding the hub, twist the stylet off counterclockwise. The catheter should feel firmly seated — that is your first confirmation.',
    'EZ-Stabilizer dressing over the hub. Primed extension set on, twist clockwise to secure, pull the dressing tabs and stick it down.',
    'Aspirate for blood or marrow — second confirmation. <b>Failure to aspirate does not mean it failed.</b>'],
   warn:'Dispose of the stylet in a sharps container immediately. It is a loaded needle in a moving aircraft.'},
  {sc:'bone', t:'Flush — and treat the pain', b:[
    'Flush with 5–10 mL normal saline. <b>This first flush must be forceful</b> — it opens a pocket in the medullary space so fluid will flow. It hurts.',
    'In a conscious patient, give the lidocaine before the flush, not after.'],
   rx:[
    {n:'Lidocaine 2% — adult',d:'40 mg (2 mL of 2%)',r:'Slow IO over 120 s',note:'Let it sit 60 seconds. An additional 20 mg may be given if pain continues. Do not flush the device for at least 60 seconds.'},
    {n:'Lidocaine 2% — pediatric',d:'0.5 mg/kg',r:'Slow IO over 120 s',calc:{per:'kg',lo:0.5,u:'mg',max:40,maxlbl:'max 40 mg'},note:'Let sit 60 seconds. Repeat PRN, do not exceed the maximum.'}]},
  {sc:'bone', t:'Run it', b:[
    'Attach fluids or medication. Pressurize up to 300 mmHg for maximum flow — a pressure bag matters more in flight than on the ground.',
    'Flush with 10 mL after any medication.',
    'Verify patency before every infusion. Caution with hypertonic solutions, chemotherapeutics and vesicants.',
    'Monitor the site and the whole limb for extravasation — compartment syndrome is the complication that costs the leg.']},
  {sc:'bone', t:'Removal', b:[
    'Remove the extension set and dressing. Stabilize the hub, attach a Luer-lock syringe.',
    'Maintain axial alignment, twist clockwise and pull straight out. <b>Do not rock the syringe.</b>',
    'Dispose with the syringe attached into a sharps container. Pressure and a dressing as needed.']}
 ]},

{id:'needle-cric', t:'Needle Cricothyroidotomy', sub:'Children under 10',
 cat:'airway', cls:'ped', icon:'⊗',
 src:'Adult PCG Rev 2024.04 — Airway: Surgical (Needle Cricothyroidotomy)',
 ind:['Inability to oxygenate','Inability to ventilate','Pediatric patients less than 10 years of age','Follow the failed airway algorithm'],
 contra:['Unfamiliarity with the technique','Pre-existing laryngeal pathology','Coagulopathy','Inability to identify the landmarks'],
 kit:['14 gauge catheter','10 mL syringe with 1 mL saline in it','3.0 ETT adapter','BVM'],
 svgs:[SVG_AIRWAY],
 steps:[
  {sc:'airway', t:'PPE and landmark', b:[
    'Palpate the prominence of the thyroid cartilage, then move your finger inferiorly into the depression between thyroid and cricoid. That depression is the membrane.']},
  {sc:'airway', t:'Cleanse and fix the trachea', b:[
    'Cleanse the site.',
    'Non-dominant hand: thumb and middle finger either side of the trachea holding it still and putting the skin on tension, index finger on the membrane. That hand does not move again until the catheter is in.']},
  {sc:'airway', t:'Enter — low and angled caudally', b:[
    '10 mL syringe on a 14 gauge catheter, with 1 mL of saline in it.',
    'Midline, at the <b>inferior margin</b> of the cricothyroid membrane — the cricothyroid vessels sit superiorly and laterally.',
    'Direct the needle toward the feet at 45°.'],
   warn:'Low and caudal. Going high or off midline finds the vessels.'},
  {sc:'airway', t:'Aspirate as you advance', b:[
    'Continuous negative pressure on the syringe as you puncture skin and subcutaneous tissue. When you enter the trachea, plunger resistance drops and you see bubbles in the saline.',
    'That bubble is your confirmation. Nothing else is.']},
  {sc:'airway', t:'Advance and connect', b:[
    'Advance the catheter off the needle, taking care not to puncture the posterior tracheal wall.',
    'Use an adapter from a 3.0 ETT and connect directly to the BVM.']}
 ]},

{id:'surgical-cric', t:'Surgical Cricothyroidotomy', sub:'Adult failed airway',
 cat:'airway', cls:'adult', icon:'⊗',
 src:'Adult PCG Rev 2024.04 — Airway: Surgical (Surgical Cricothyroidotomy)',
 ind:['Inability to oxygenate','Inability to ventilate','Follow the failed airway algorithm'],
 contra:['Unfamiliarity with the technique','Pre-existing laryngeal pathology','Coagulopathy','Inability to identify the landmarks','Children under 10 — use needle cricothyroidotomy','Tracheal transection','Known or expanding hematoma or tumour'],
 kit:['Scalpel','Bougie','6.0 cuffed ETT (or the tube your kit carries)','Antiseptic','Capnography','Commercial tube holder or tie'],
 svgs:[SVG_AIRWAY],
 steps:[
  {sc:'airway', t:'PPE and landmark', b:[
    'Thyroid cartilage prominence, finger inferiorly into the depression between thyroid and cricoid.']},
  {sc:'airway', t:'Fix the trachea, prep the site', b:[
    'Thumb and middle finger either side of the trachea, index finger on the membrane, skin on tension.',
    'Cleanse quickly with antiseptic, starting at the membrane and widening outward.']},
  {sc:'airway', t:'Vertical skin incision', b:[
    '1.5–2.5 cm <b>vertical</b> incision in the skin over the cricothyroid membrane.',
    'Vertical, because it lets you extend up or down when the anatomy is not where you expected and it stays off the lateral vessels.']},
  {sc:'airway', t:'Blunt dissect to the membrane', b:['Expose the cricothyroid membrane by blunt dissection.']},
  {sc:'airway', t:'Horizontal membrane incision', b:[
    'Once the membrane is exposed, a <b>horizontal</b> incision through it.',
    'Skin vertical, membrane horizontal. Getting these the wrong way round is the classic error.'],
   warn:'Keep a finger or the scalpel handle in the hole. The one thing you cannot afford is to lose the tract.'},
  {sc:'airway', t:'Tube in', b:[
    'Consider passing a bougie through the opening first and railroading the tube over it.',
    'Insert the ETT until the cuff is in the trachea, inferior to the incision. Inflate the cuff.']},
  {sc:'airway', t:'Confirm, note, secure', b:[
    'Continuous capnography and pulse oximetry are strongly recommended for the rest of the transport.',
    'Note the depth at insertion. Secure with a commercial tube holder or a prepackaged tie.']}
 ]}
];

/* ============================================================
   MECHANICAL CIRCULATORY SUPPORT — transport troubleshooting
   Impella / Automated Impella Controller (Abiomed)
   Cardiosave Hybrid & Rescue IABP (Getinge / Maquet / Datascope)
   ECMO — VA and VV

   Sources are named on every card. Device-specific alarm text and
   menu paths differ between software revisions: the console in
   front of you and the manufacturer IFU win over this page, and
   the receiving centre's perfusionist or MCS team is one phone
   call away. Nothing here replaces device-specific training.
   ============================================================ */

var MCS = [

{id:'impella', t:'Impella', sub:'Abiomed · Automated Impella Controller', icon:'⊙', cls:'card',
 src:'Abiomed Impella instructions for use and Transporting a Patient on Impella Heart Pump Support (heartrecovery.com); FDA device notices 2023–2025.',
 pre:[
  'Confirm which catheter: 2.5, CP, 5.0/5.5, LD, or RP. Flow capacity and the console screens differ.',
  'Confirm the controller generation. An older MPC console needs an AIC, a white connector cable, a purge cassette and purge fluid before it can travel on your kit.',
  'Purge fluid: dextrose — commonly D5W, or D20W with heparin per the sending unit. Take a full spare bag. Hang it <b>upright</b> in the aircraft.',
  'Batteries must have been charged 5 hours to deliver their rated runtime; after unplugging, plan on about <b>1 hour</b>. Plug the AIC into ship power as soon as the patient is secured.',
  'Take spare connector cable, spare purge cassette, and the sending facility\u2019s contact for their MCS team.',
  '<b>Femoral access: do not raise the head of bed above 30°.</b> A knee immobiliser prevents hip flexion and is worth applying before you move the patient.',
  'Stay on the <b>placement screen</b> for the whole transport. Placement signal and motor current are how you know the pump is where you left it.'
 ],
 crit:'Impella is MR Unsafe. Abiomed also advises against transporting an Impella patient aboard commercial aircraft — the controller is specified to an RF immunity of under 20 V/m and support can be lost. Keep the AIC physically separated from radios and power cables in the cabin.',
 alarms:[
  {a:'Impella Position in Aorta', sev:'red', s:'The inlet has migrated out of the ventricle; the pump is now moving blood within the aorta and is not unloading the LV. Placement signal flattens and motor current changes character.',
   d:['<b>In transport, reduce the P-level to P-2</b> and hold there until imaging is available at the receiving facility.',
      'Do not attempt repositioning in the aircraft without imaging. You cannot confirm where you have put it.',
      'Recheck the insertion depth marker against what the sending facility documented and note any change.',
      'Call the receiving MCS team so echo or fluoroscopy is waiting.']},
  {a:'Suction', sev:'yellow', s:'The inlet is against ventricular wall or the ventricle is underfilled. Flow drops and motor current becomes erratic. Common causes: hypovolaemia, RV failure, tamponade, or inlet malposition.',
   d:['<b>Position cannot be changed in flight, so treat the volume.</b> Give fluid and reassess.',
      'Reduce the P-level to lower the draw on an underfilled ventricle.',
      'Consider RV failure or tamponade as the reason the LV is empty — the left-sided pump cannot fix either.',
      'Check that the leg has not flexed and displaced the catheter.']},
  {a:'Purge Pressure Low', sev:'red', s:'Purge flow is not generating expected resistance — a leak, a loose connection, or a disconnected purge limb. Loss of the purge barrier risks blood entering the motor.',
   d:['Trace the purge system end to end and <b>tighten every connection</b>, starting at the cassette and working to the catheter.',
      'Inspect the sidearm and the Y connector for a disconnect.',
      'Confirm the purge cassette is seated with the Abiomed logo upright and facing you.',
      'If the alarm persists after reseating, change to a backup controller.']},
  {a:'Purge Pressure High', sev:'yellow', s:'Resistance in the purge path — usually mechanical.',
   d:['<b>Check the tubing for kinks</b> along its whole run, including under the patient and at the litter rail.',
      'Ensure the purge sidearm is straight, not looped or compressed.',
      'Check the catheter is not kinked at the insertion site or at the introducer.']},
  {a:'Air in Purge System', sev:'red', s:'Air has been drawn into the purge line, usually because the dextrose bag ran dry or was carried on its side.',
   d:['<b>Hang the dextrose bag upright.</b> This is the single most common cause in a moving aircraft.',
      'Check the bag volume — swap it before it runs dry, not after.',
      'Follow the de-airing procedure in section 5 of the IFU; do not improvise one.']},
  {a:'Purge System Open / Purge Cassette not recognised', sev:'red', s:'The controller cannot confirm the purge disc is seated. FDA and Abiomed have flagged failures of the purge flag component inside the pressure sensor assembly.',
   d:['<b>Reinsert the purge disc</b> as the first action, per the IFU.',
      'If the alarm does not clear, <b>switch to a backup Automated Impella Controller.</b> There is no field repair for this.',
      'Document the controller serial number — it will need service.']},
  {a:'Impella Stopped', sev:'red', s:'The motor is not running. Support is zero.',
   d:['Check the connector cable at both ends and the catheter plug seating.',
      'Restart per the controller prompt.',
      '<b>Support the circulation as though the device is not there</b> — pressors, volume, and get to the receiving facility.',
      'Escalate to the receiving MCS team immediately.']},
  {a:'Controller Failure / no power', sev:'red', s:'Console fault or battery exhaustion.',
   d:['Confirm ship power is connected and delivering. The AIC should be on ship power, not battery, whenever the aircraft can supply it.',
      'Move to the backup controller. This is why it travels with you.']}
 ],
 watch:['Placement signal waveform and motor current, continuously, on the placement screen.',
   'P-level and displayed flow against what the sending unit ran.',

{id:'iabp', t:'Intra-Aortic Balloon Pump', sub:'Getinge Cardiosave Hybrid & Rescue', icon:'◇', cls:'press',
 src:'Getinge Cardiosave IABP operation and troubleshooting quick reference guides; FDA Class I recall notices for Cardiosave Hybrid and Rescue (autofill, gas loss/gain, power path); JSCAI 2024 focused review of IABP physiology and transport logistics.',
 pre:[
  '<b>Confirm the console is in Rescue (transport) configuration</b>, not Hybrid sitting in a hospital cart. Rescue runs off its internal helium reservoir.',
  'Verify the internal helium reservoir is full before you leave. If the on-screen indicator is not showing full, refill from the hospital cart or a helium refilling station.',
  'Confirm balloon volume against the patient — sizing is by height, and the sending facility should have documented it.',
  'Bring any catheter extension tubing with the patient. Consoles differ and the extension is what lets the receiving unit connect.',
  '<b>Carry a 60 mL syringe with a three-way stopcock.</b> If the console fails completely, manual inflation and deflation of 40–50 mL of air through the helium extender every few minutes is a thrombosis-prevention measure, not haemodynamic support.',
  'Confirm a reliable ECG trigger and a good arterial waveform before the wheels move, and know which trigger mode you are in.',
  'Strongly consider knowing where a second charged console is. FDA has documented repeated unexpected shutdowns on this platform.'
 ],
 crit:'The balloon must not sit still. If counterpulsation stops for any reason and cannot be restarted, thrombus forms on the balloon within minutes — begin manual cycling and treat this as a time-critical problem, not a monitoring one.',
 alarms:[
  {a:'Altitude change — high baseline / high fill pressure', sev:'yellow', s:'Ascent drops ambient pressure and the balloon over-fills relative to it. In autofill, the Cardiosave purges and refills automatically when atmospheric pressure falls about 25 mmHg — roughly every 1,000 ft of climb.',
   d:['<b>Brief the pilot: request a gradual climb and gradual descent.</b> Rapid altitude change is what defeats the autofill.',
      'If the device does not adjust itself, press <b>pump status on</b> to force an altitude adjustment.',
      'Expect the alarm on ascent; expect helium loss or gas loss alarms on descent instead.',
      'Watch the augmented waveform after every altitude change, not just the alarm panel.']},
  {a:'Gas loss / Helium loss', sev:'red', s:'Helium volume is falling. Causes: patient movement including coughing and swallowing, loose connections, kinks or abrasion to the tubing, blood in the circuit, rapid descent, and fever or tachycardia which increase the normal loss rate. FDA has classified this as a Class I recall issue on Cardiosave.',
   d:['<b>Inspect the circuit for blood first.</b> Blood in the tubing means balloon perforation — stop pumping, clamp, and this console cannot be reused on another patient without service.',
      'If no blood: check every connection, straighten kinks, limit patient movement.',
      'Press START to refill and resume pumping.',
      'If the alarm keeps recurring, change to the backup console. Persistent gas loss is not something you manage through a 40-minute flight.']},
  {a:'Autofill failure — no helium', sev:'red', s:'The autofill sequence could not complete. In Rescue mode the internal reservoir is the only supply you have.',
   d:['Verify the console has helium. In Rescue mode you cannot top up in the aircraft — the reservoir is filled from the hospital cart or a refilling station.',
      'Initiate autofill with <b>START</b>, or hold <b>IAB FILL for 2 seconds</b>.',
      'If it cannot fill, therapy has stopped. Begin manual cycling with the 60 mL syringe and escalate.',
      'This is why the reservoir is verified full on the ground, every time.']},
  {a:'Trigger loss — ECG', sev:'red', s:'The console cannot find an R wave. Leads displaced during the move, electrocautery-grade interference, or a change in rhythm.',
   d:['<b>Change the lead selection</b> to one with a tall, clean R wave.',
      'Reseat the electrodes — the transfer from bed to stretcher is when they come loose.',
      'If ECG is unusable, switch to <b>arterial pressure trigger</b>.',
      'In a paced patient, use the pacer trigger mode appropriate to the rhythm.',
      'In arrest or a chaotic rhythm, internal or asynchronous mode at a fixed rate keeps the balloon moving.']},
  {a:'Trigger loss — arterial pressure', sev:'red', s:'The arterial waveform is damped or lost. Line kinked, transducer displaced, or the catheter has migrated.',
   d:['Check the transducer level and zero it against the phlebostatic axis after every patient move.',
      'Check the line for kinks and the pressure bag for volume and pressure.',
      'Revert to ECG trigger while you sort the line out.',
      'A newly damped waveform plus a position concern is a reason to call the receiving team, not to keep flying quietly.']},
  {a:'Poor augmentation', sev:'yellow', s:'The augmented diastolic peak is low. Timing error, low balloon volume, tachycardia, hypovolaemia, low SVR, balloon too small, or balloon position too low in the aorta.',
   d:['Check timing first: <b>inflate at the dicrotic notch, deflate just before the upstroke.</b>',
      '<b>Early inflation</b> — inflation before the notch — raises afterload against a still-ejecting ventricle. Move it later.',
      '<b>Late inflation</b> loses augmentation. <b>Early deflation</b> shows a sharp drop then a rebound. <b>Late deflation</b> widens the systolic upstroke and raises afterload — the most harmful of the four.',
      'Confirm the balloon volume setting matches the catheter.',
      'Correct hypovolaemia; tachycardia shortens diastole and there is less to augment.']},
  {a:'Console shutdown / power fault', sev:'red', s:'FDA has documented unexpected shutdowns from power management and charging-path failures, from the console not being correctly seated in the cart, and from internal temperature exceeding 80 °C.',
   d:['Confirm the console is properly seated and actually charging, not silently running on battery.',
      'Keep it away from heat sources and do not obstruct its ventilation under blankets or a litter pad.',
      'Move to the backup console.',
      'If no console is available, manual cycling with the 60 mL syringe, and support the circulation with vasoactives.']}
 ],
 watch:['Augmented diastolic pressure against the patient\u2019s unassisted systolic, every set of vitals.',
   'Assist ratio and whether it has been changed by anyone.',

{id:'ecmo', t:'ECMO', sub:'VA and VV extracorporeal support', icon:'∞', cls:'proc',
 src:'ELSO guidance; Alfred ECMO guideline (ecmo.icu) emergency alarms; LITFL ECMO troubleshooting; Patel et al., bedside troubleshooting during VV ECMO, J Thorac Dis 2019; Open Critical Care / ICU One Pager ECMO troubleshooting.',
 pre:[
  '<b>ECMO transport is a team sport with a perfusionist or ECMO specialist aboard.</b> This page is orientation and shared vocabulary, not authority to run the circuit.',
  'Confirm VA or VV, cannula sites and sizes, and the documented insertion depths. Mark them.',
  '<b>Two clamps on the circuit at all times, within arm\u2019s reach.</b> Not in a bag.',
  'Hand crank present, and everyone aboard has seen where it is and how it attaches.',
  'Backup oxygen supply and a plan for the sweep gas independent of ship oxygen.',
  'Power: circuit on ship power with charged battery reserve; know the runtime.',
  'Secure every cannula to the patient and the litter so that no aircraft movement can transmit tension to the insertion site. This is the single highest-value thing you do before the doors close.',
  'Baseline set before departure: flow, RPM, sweep gas and FiO₂, pre- and post-oxygenator pressures, ACT or anticoagulation plan, and the patient\u2019s own ventilator settings.'
 ],
 crit:'Air in the circuit is an immediate clamp-and-stop emergency. Decannulation is an immediate direct-pressure emergency. Everything else has more time than it feels like it has.',
 alarms:[
  {a:'Line chatter / circuit kicking', sev:'yellow', s:'The access line judders. The pump is asking for more volume than the patient can deliver — hypovolaemia, venous suck-down against the vessel wall, cannula malposition, tamponade, pneumothorax, or simply too high an RPM for the cannula.',
   d:['<b>Reduce the pump speed first.</b> Flow that improves when you slow down is access insufficiency, and that is diagnostic.',
      'Give volume if hypovolaemia is plausible — crystalloid typically resolves it.',
      'Check the cannula for kinking, and check the patient\u2019s position — a flexed hip or a shifted litter strap is a common cause in transport.',
      'Look for the reversible chest causes: tension pneumothorax, tamponade.',
      'Sustained chatter causes haemolysis. Do not simply mute it and continue.']},
  {a:'Low flow alarm', sev:'red', s:'Differentiate by what happens when you drop the speed. Access insufficiency improves; nothing else does.',
   d:['<b>Kinked or twisted tubing corrects instantly when straightened</b> — look there first, it is free.',
      'Access insufficiency: improves on reducing speed. Treat volume and position.',
      'Oxygenator occlusion: falling flow with <b>rising trans-oxygenator pressure gradient</b>. Does not improve with lower speed.',
      'On VA, a sharp rise in afterload — waking, coughing, straining, or a vasopressor bolus — drops flow. Sedate and treat the cause.',
      'Air embolism: visible air in circuit or pump head. <b>Clamp immediately.</b>']},
  {a:'Air in the circuit', sev:'red', s:'Visible air in tubing or the pump head. Entrainment through an access-side connection, a cracked connector, or from a central line.',
   d:['<b>Clamp the circuit immediately</b> and stop the pump.',
      'Place the patient head down.',
      'Support ventilation and circulation off-circuit — full ventilator settings, vasoactives, chest compressions if VA and pulseless.',
      'De-air only with the ECMO specialist, per your programme\u2019s procedure.',
      'Identify the entrainment point before restarting.']},
  {a:'Oxygenator failure', sev:'red', s:'Falling post-membrane PaO₂, rising trans-membrane pressure gradient, visible clot or fibrin in the fibre bundle, plasma leak from the gas outlet.',
   d:['Increase sweep gas and FiO₂ to the oxygenator as a temporising measure.',
      'Increase the patient\u2019s own ventilator support — the native lung has to carry more.',
      '<b>Circuit exchange is not a transport procedure.</b> Get to the receiving centre and have them ready.',
      'Trend the gradient rather than reading it once; the rate of change is what matters.']},
  {a:'Pump head failure / power loss', sev:'red', s:'The pump stops. Flow is zero and the circuit is now a stagnant blood-filled loop.',
   d:['<b>Clamp the circuit, then go to the hand crank.</b> In that order.',
      'Crank at the rate your specialist directs and do not stop.',
      'Restore power or switch to the backup drive.',
      'Support the patient conventionally throughout — ventilator up, vasoactives, and on VA treat as arrest if pulseless.']},
  {a:'Decannulation or bleeding at the site', sev:'red', s:'A cannula has moved or come out. On VA this is exsanguination and loss of support simultaneously.',
   d:['<b>Direct pressure immediately</b>, and clamp the circuit.',
      'Fluid and blood products through separate access. Activate massive transfusion thinking.',
      'Reverse anticoagulation only on the receiving physician\u2019s direction.',
      'Divert to the nearest capable facility — this is not a problem you finish the flight with.']},
  {a:'Differential hypoxia (north–south syndrome)', sev:'yellow', s:'Peripheral VA only. The recovering heart ejects poorly oxygenated blood from failing native lungs to the upper body while the circuit perfuses the lower body well. Right radial saturation is low while the lower limb reads high.',
   d:['<b>Monitor saturation on the right hand</b> — the pre-ductal equivalent. A left-arm or lower-limb probe will reassure you falsely.',
      'Increase the patient\u2019s own ventilator support: FiO₂, PEEP, recruitment.',
      'Discuss conversion to VAV or a different configuration with the receiving centre — not a transport manoeuvre.']},
  {a:'Haemolysis', sev:'yellow', s:'Dark or cola-coloured urine, rising free haemoglobin. Causes: cannula too small, malposition, high RPM — above roughly 4,000 with small cannulae — clot in the centrifugal cone or oxygenator, or sustained access insufficiency.',
   d:['Reduce RPM where flow allows it.',
      'Correct access insufficiency and cannula position.',
      'Inspect the pump head and oxygenator for clot — a noisy pump head suggests pump head thrombosis.',
      'Report it to the receiving team on handover; it changes their plan.']}

 watch:['Flow and RPM together — either alone tells you nothing.',
   'Pre- and post-oxygenator pressures and the gradient across the membrane.',
   'Sweep gas rate and FiO₂ to the oxygenator, separately from the patient\u2019s ventilator.',
   'Right-hand SpO₂ on peripheral VA.',
   'Circuit visually, with a light, every 15 minutes: clot, fibrin, air, colour difference across the membrane.',

];

/* ============================================================
   CALCULATORS
   Every one of these resolves against the patient bar where it
   can. Rule of Nines scales its segments with age rather than
   carrying a fixed adult chart, which is also what fixes the
   101% pediatric row in the 2020 manual.
   ============================================================ */

var CS = {
  burn:{},                                   /* selected body regions        */
  conc:{drug:'', amt:'', amtU:'mg', c:'', cU:'mg/mL', vol:''},
  inf:{drug:'', rate:'', rateU:'mcg/kg/min', amt:'', amtU:'mg', vol:'250'},
  drip:{vol:'', min:'', set:'10'},
  vitals:{sbp:'', dbp:'', hr:''}
};

/* ---------- Rule of Nines, age-scaled ---------- */
/* Adult 9s; the head loses 1% per year of life after the first,
   and the two legs split what the head gives up, to a floor of 9%
   head / 18% per leg at about age ten. Total always sums to 100. */
function ninesSplit(){
  var a = ageY();
  var head = (a == null) ? 9 : Math.max(9, Math.min(18, 18 - Math.max(0, a - 1)));
  var give = 18 - head;
  var leg  = 13.5 + give / 2;
  return {head:head, arm:9, trunk:36, leg:leg, gen:1, age:a};
}

function ninesRegions(){
  var s = ninesSplit();
  return {
    'head-f':{p:s.head/2, l:'Head, front'},   'head-b':{p:s.head/2, l:'Head, back'},
    'armR-f':{p:s.arm/2,  l:'R arm, front'},  'armR-b':{p:s.arm/2,  l:'R arm, back'},
    'armL-f':{p:s.arm/2,  l:'L arm, front'},  'armL-b':{p:s.arm/2,  l:'L arm, back'},
    'trunkU-f':{p:9, l:'Chest'},              'trunkL-f':{p:9, l:'Abdomen'},
    'trunkU-b':{p:9, l:'Upper back'},         'trunkL-b':{p:9, l:'Lower back'},
    'legR-f':{p:s.leg/2, l:'R leg, front'},   'legR-b':{p:s.leg/2, l:'R leg, back'},
    'legL-f':{p:s.leg/2, l:'L leg, front'},   'legL-b':{p:s.leg/2, l:'L leg, back'},
    'gen':{p:s.gen, l:'Perineum'}
  };
}
function ninesTotal(){
  var R = ninesRegions(), t = 0;
  Object.keys(CS.burn).forEach(function(k){ if(CS.burn[k] && R[k]) t += R[k].p; });
  return Math.round(t * 10) / 10;
}

function bodySVG(){
  var R = ninesRegions();
  function reg(id, shape){
    var on = CS.burn[id] ? ' on' : '';
    return '<g class="bz' + on + '" data-bz="' + id + '" role="button" tabindex="0" aria-label="' +
      esc(R[id].l) + ' ' + R[id].p + ' percent' + (CS.burn[id] ? ', selected' : '') + '">' + shape + '</g>';
  }
  function fig(x, sfx, label){
    var o = ['<g transform="translate(' + x + ',0)">'];
    o.push('<text class="figlab" x="115" y="14">' + label + '</text>');
    o.push(reg('head-' + sfx, '<circle cx="115" cy="48" r="25"/><rect x="106" y="70" width="18" height="10" rx="3"/>'));
    o.push(reg('trunkU-' + sfx, '<rect x="84" y="79" width="62" height="60" rx="7"/>'));
    o.push(reg('trunkL-' + sfx, '<rect x="84" y="141" width="62" height="56" rx="7"/>'));
    o.push(reg('armR-' + sfx, '<rect x="56" y="82" width="25" height="98" rx="11"/>'));
    o.push(reg('armL-' + sfx, '<rect x="149" y="82" width="25" height="98" rx="11"/>'));
    if(sfx === 'f') o.push(reg('gen', '<rect x="104" y="199" width="22" height="13" rx="4"/>'));
    o.push(reg('legR-' + sfx, '<rect x="85" y="' + (sfx === 'f' ? 214 : 199) + '" width="28" height="' + (sfx === 'f' ? 132 : 147) + '" rx="11"/>'));
    o.push(reg('legL-' + sfx, '<rect x="117" y="' + (sfx === 'f' ? 214 : 199) + '" width="28" height="' + (sfx === 'f' ? 132 : 147) + '" rx="11"/>'));
    /* percentage labels */
    var lp = [['head-'+sfx,115,52],['trunkU-'+sfx,115,113],['trunkL-'+sfx,115,173],
              ['armR-'+sfx,68,135],['armL-'+sfx,161,135],
              ['legR-'+sfx,99,290],['legL-'+sfx,131,290]];
    lp.forEach(function(p){
      o.push('<text class="bzp" x="' + p[1] + '" y="' + p[2] + '">' + R[p[0]].p + '</text>');
    });
    if(sfx === 'f') o.push('<text class="bzp sm" x="115" y="210">' + R['gen'].p + '</text>');
    o.push('</g>');
    return o.join('');
  }
  return '<svg viewBox="0 0 470 362" xmlns="http://www.w3.org/2000/svg" class="bodysvg" role="group" aria-label="Rule of Nines body map">' +
    fig(0, 'f', 'ANTERIOR') + fig(240, 'b', 'POSTERIOR') + '</svg>';
}

function viewNines(){
  var s = ninesSplit(), t = ninesTotal(), w = kg(), a = ageY();
  var band = a == null ? 'no age entered — showing adult 9s'
           : (a < 1 ? 'infant proportions' : (a >= 10 ? 'adult proportions' : 'age-adjusted, ' + fmt(a,'') + ' yr'));
  var h = [];
  h.push('<div class="dosehd k-trauma"><h2>Rule of Nines</h2><p>Tap the burned segments. Segment values scale with age — ' +
    esc(band) + '. Head <b>' + fmt(s.head,'') + '%</b> · each arm <b>9%</b> · trunk <b>36%</b> · each leg <b>' +
    fmt(s.leg,'') + '%</b> · perineum <b>1%</b>.</p></div>');

  h.push('<div class="tbsabar"><div class="tbsav">' + fmt(t,'') + '<small>% TBSA</small></div>');
  h.push('<div class="tbsaside">');
  if(t > 0){
    if(w != null){
      var tot = 2 * w * t;
      h.push('<div class="tbsarow"><span>Parkland, 24 h</span><b>' + fmt(tot,'mL') + ' mL</b></div>');
      h.push('<div class="tbsarow"><span>First 8 h, from the burn</span><b>' + fmt(tot/2,'mL') + ' mL</b></div>');
      h.push('<div class="tbsarow hi"><span>Run at</span><b>' + fmt(tot/16,'mL/hr') + ' mL/hr</b></div>');
      h.push('<div class="tbsarow"><span>Then 16 h</span><b>' + fmt(tot/32,'mL/hr') + ' mL/hr</b></div>');
    } else {
      h.push('<div class="tbsarow"><span>Add a weight and Parkland fills in</span>' +
        '<button class="xref" type="button" data-focus="iWt" style="border:none;padding:0">enter weight →</button></div>');
    }
  } else {
    h.push('<div class="tbsarow"><span>Nothing selected yet</span></div>');
  }
  h.push('</div></div>');

  h.push('<div class="scene">' + bodySVG() + '</div>');
  h.push('<div class="calcrow"><button class="cbtn" type="button" data-bzclear="1">Clear selection</button>' +
    (t > 0 ? '<button class="cbtn go" type="button" data-bzsend="1">Use ' + fmt(t,'') + '% in dose calculations</button>' : '') + '</div>');

  h.push('<div class="crit"><b>Parkland is a starting point, not a prescription.</b> Titrate to urine output — ' +
    '0.5 mL/kg/hr in adults, 1 mL/kg/hr in children — and remember the clock starts at the time of the burn, ' +
    'not at your arrival. Superficial (erythema only) burns are not counted in %TBSA.</div>');
  h.push('<div class="note k-trauma">The 2020 manual\u2019s printed pediatric Rule of Nines row sums to 101%, and its burn formula ' +
    'line duplicates the weight multiplier. This calculator uses the age-scaled segments above and the standard ' +
    '2 mL × kg × %TBSA, so both errors are avoided. See ' + xrShort('{{5.2}}') + ' for the guideline text.</div>');
  return h.join('');
}

/* ---------- concentration → volume ---------- */
/* Common concentrations carried on the aircraft or supplied by the
   referring facility. "Unknown" is the default: type what the vial says. */
var CONC = [
  {n:'Epinephrine 1:10,000',      v:0.1,   u:'mg/mL', note:'10 mL prefilled syringe = 1 mg'},
  {n:'Epinephrine 1:1,000',       v:1,     u:'mg/mL', note:'1 mL ampoule = 1 mg'},
  {n:'Fentanyl',                  v:50,    u:'mcg/mL'},
  {n:'Ketamine 100 mg/mL',        v:100,   u:'mg/mL'},
  {n:'Ketamine 50 mg/mL',         v:50,    u:'mg/mL'},
  {n:'Etomidate',                 v:2,     u:'mg/mL'},
  {n:'Rocuronium',                v:10,    u:'mg/mL'},
  {n:'Vecuronium (10 mg / 10 mL)',v:1,     u:'mg/mL', note:'after reconstitution'},
  {n:'Midazolam 5 mg/mL',         v:5,     u:'mg/mL'},
  {n:'Midazolam 1 mg/mL',         v:1,     u:'mg/mL'},
  {n:'Lorazepam',                 v:2,     u:'mg/mL'},
  {n:'Morphine',                  v:4,     u:'mg/mL'},
  {n:'Naloxone',                  v:0.4,   u:'mg/mL'},
  {n:'Amiodarone',                v:50,    u:'mg/mL'},
  {n:'Adenosine',                 v:3,     u:'mg/mL'},
  {n:'Atropine',                  v:0.1,   u:'mg/mL', note:'10 mL prefilled = 1 mg'},
  {n:'Calcium chloride 10%',      v:100,   u:'mg/mL', note:'10 mL = 1 g'},
  {n:'Calcium gluconate 10%',     v:100,   u:'mg/mL', note:'10 mL = 1 g'},
  {n:'Sodium bicarbonate 8.4%',   v:1,     u:'mEq/mL',note:'50 mL = 50 mEq'},
  {n:'Magnesium sulfate 50%',     v:500,   u:'mg/mL', note:'2 mL = 1 g'},
  {n:'Dextrose 50%',              v:500,   u:'mg/mL', note:'50 mL = 25 g'},
  {n:'Dextrose 10%',              v:100,   u:'mg/mL'},
  {n:'Lidocaine 2%',              v:20,    u:'mg/mL'},
  {n:'Lidocaine 1%',              v:10,    u:'mg/mL'},
  {n:'Labetalol',                 v:5,     u:'mg/mL'},
  {n:'Hydralazine',               v:20,    u:'mg/mL'},
  {n:'Diltiazem',                 v:5,     u:'mg/mL'},
  {n:'Metoprolol',                v:1,     u:'mg/mL'},
  {n:'Ondansetron',               v:2,     u:'mg/mL'},
  {n:'Ketorolac',                 v:30,    u:'mg/mL'},
  {n:'Methylprednisolone',        v:62.5,  u:'mg/mL', note:'Act-O-Vial 125 mg / 2 mL'},
  {n:'Phenylephrine (diluted)',   v:100,   u:'mcg/mL',note:'10 mg in 100 mL'},
  {n:'Norepinephrine (standard)', v:16,    u:'mcg/mL',note:'4 mg in 250 mL'},
  {n:'Vasopressin',               v:20,    u:'units/mL'},
  {n:'Heparin',                   v:1000,  u:'units/mL'},
  {n:'Insulin (regular, mixed)',  v:1,     u:'units/mL',note:'100 units in 100 mL'},
  {n:'Tranexamic acid',           v:100,   u:'mg/mL', note:'1 g in 10 mL'}
];

function toBase(v, u){            /* normalise to mg, mcg, mEq or units */
  if(u === 'mcg') return {v:v/1000, u:'mg'};
  if(u === 'g')   return {v:v*1000, u:'mg'};
  return {v:v, u:u};
}
function concBase(u){ return u.split('/')[0]; }

function viewConc(){
  var C = CS.conc, w = kg(), h = [];
  h.push('<div class="dosehd k-dose"><h2>Concentration → volume</h2><p>What the vial holds, what you were told to give, ' +
    'and how many millilitres that actually is. Leave the drug on <b>Unknown</b> and type the concentration off the label.</p></div>');

  h.push('<div class="cgrid">');
  h.push('<label class="cf"><span>Drug</span><select data-cs="conc.drug"><option value="">Unknown / type it in</option>' +
    CONC.map(function(d, i){ return '<option value="' + i + '"' + (C.drug === String(i) ? ' selected' : '') + '>' + esc(d.n) + '</option>'; }).join('') +
    '</select></label>');
  h.push('<label class="cf"><span>Concentration</span><span class="cin"><input type="number" inputmode="decimal" step="any" ' +
    'data-cs="conc.c" value="' + esc(C.c) + '" placeholder="e.g. 50">' +
    '<select data-cs="conc.cU">' + ['mg/mL','mcg/mL','g/mL','mEq/mL','units/mL'].map(function(u){
      return '<option' + (C.cU === u ? ' selected' : '') + '>' + u + '</option>'; }).join('') + '</select></span></label>');
  h.push('<label class="cf"><span>Dose ordered</span><span class="cin"><input type="number" inputmode="decimal" step="any" ' +
    'data-cs="conc.amt" value="' + esc(C.amt) + '" placeholder="e.g. 100">' +
    '<select data-cs="conc.amtU">' + ['mg','mcg','g','mEq','units','mg/kg','mcg/kg','units/kg'].map(function(u){
      return '<option' + (C.amtU === u ? ' selected' : '') + '>' + u + '</option>'; }).join('') + '</select></span></label>');
  h.push('</div>');

  var cv = parseFloat(C.c), av = parseFloat(C.amt);
  var perKg = /\/kg$/.test(C.amtU);
  var note = [];
  if(perKg && w == null){
    h.push('<div class="nowt"><b>That dose is per kilogram.</b> Enter a weight and it resolves.' +
      '<button type="button" data-focus="iWt">Enter weight</button></div>');
  } else if(isFinite(cv) && cv > 0 && isFinite(av) && av > 0){
    var amtU = C.amtU.replace('/kg',''), amt = perKg ? av * w : av;
    if(perKg) note.push(fmt(av,'') + ' ' + C.amtU + ' × ' + fmt(w,'') + ' kg = ' + fmt(amt,'') + ' ' + amtU);
    var A = toBase(amt, amtU), Cc = toBase(cv, concBase(C.cU));
    if(A.u !== Cc.u){
      h.push('<div class="crit"><b>Units do not match.</b> The dose is in ' + esc(amtU) +
        ' and the concentration is in ' + esc(C.cU) + '. Fix one of them before trusting any number.</div>');
    } else {
      var mL = A.v / Cc.v;
      h.push('<div class="bigout k-dose"><div class="bov">' + fmt(mL, mL < 10 ? '' : 'mL') + '<small>mL</small></div>' +
        '<div class="bon">' + fmt(amt,'') + ' ' + esc(amtU) + ' at ' + fmt(cv,'') + ' ' + esc(C.cU) +
        (note.length ? ' · ' + note.join(' · ') : '') + '</div></div>');
      if(mL < 0.1) h.push('<div class="crit"><b>' + fmt(mL,'') + ' mL is below a reliably measurable volume.</b> Dilute it, or use a 1 mL syringe and a second check.</div>');
      if(mL > 50)  h.push('<div class="note k-warn">' + fmt(mL,'') + ' mL is a large push volume. Confirm the concentration on the label before you draw it up.</div>');
      var d = CONC[C.drug];
      if(d && d.note) h.push('<div class="rxnote">' + esc(d.n) + ' — ' + esc(d.note) + '</div>');
    }
  } else {
    h.push('<div class="bigout k-gen"><div class="bov">—<small>mL</small></div><div class="bon">Enter a concentration and a dose.</div></div>');
  }

  h.push('<div class="note k-dose">mL = dose ÷ concentration. The calculator converts mcg↔mg and g↔mg for you but will ' +
    'not silently reconcile mEq with mg or units with mg — those are different quantities and a mismatch is a real error, ' +
    'not a formatting problem.</div>');
  return h.join('');
}

/* ---------- infusion rate ---------- */
function viewInf(){
  var I = CS.inf, w = kg(), h = [];
  h.push('<div class="dosehd k-press"><h2>Infusion rate</h2><p>Ordered rate in, pump rate out. Works from the bag — ' +
    'how much drug in how much fluid — so it covers whatever the referring facility mixed.</p></div>');

  h.push('<div class="cgrid">');
  h.push('<label class="cf"><span>Drug in the bag</span><span class="cin">' +
    '<input type="number" inputmode="decimal" step="any" data-cs="inf.amt" value="' + esc(I.amt) + '" placeholder="e.g. 4">' +
    '<select data-cs="inf.amtU">' + ['mg','mcg','g','units'].map(function(u){
      return '<option' + (I.amtU === u ? ' selected' : '') + '>' + u + '</option>'; }).join('') + '</select></span></label>');
  h.push('<label class="cf"><span>In how much fluid (mL)</span><input type="number" inputmode="decimal" step="any" ' +
    'data-cs="inf.vol" value="' + esc(I.vol) + '" placeholder="250"></label>');
  h.push('<label class="cf"><span>Ordered rate</span><span class="cin">' +
    '<input type="number" inputmode="decimal" step="any" data-cs="inf.rate" value="' + esc(I.rate) + '" placeholder="e.g. 0.1">' +
    '<select data-cs="inf.rateU">' + ['mcg/kg/min','mcg/min','mg/kg/hr','mg/hr','units/kg/hr','units/hr','mcg/kg/hr'].map(function(u){
      return '<option' + (I.rateU === u ? ' selected' : '') + '>' + u + '</option>'; }).join('') + '</select></span></label>');
  h.push('</div>');

  var amt = parseFloat(I.amt), vol = parseFloat(I.vol), rate = parseFloat(I.rate);
  var perKg = /\/kg\//.test(I.rateU);
  if(perKg && w == null){
    h.push('<div class="nowt"><b>That rate is per kilogram.</b> Enter a weight and it resolves.' +
      '<button type="button" data-focus="iWt">Enter weight</button></div>');
    return h.join('');
  }
  if(!(isFinite(amt) && amt > 0 && isFinite(vol) && vol > 0 && isFinite(rate) && rate > 0)){
    h.push('<div class="bigout k-gen"><div class="bov">—<small>mL/hr</small></div><div class="bon">Fill in the bag and the ordered rate.</div></div>');
    return h.join('');
  }

  /* bag concentration, normalised per mL */
  var bag = toBase(amt, I.amtU);                   /* mg or units */
  var perML = bag.v / vol;                          /* mg/mL or units/mL */
  /* ordered rate normalised to <base> per hour */
  var parts = I.rateU.split('/');                   /* [unit, (kg), time] */
  var rUnit = parts[0], time = parts[parts.length - 1];
  var rBase = toBase(rate, rUnit);
  var perHr = rBase.v * (time === 'min' ? 60 : 1) * (perKg ? w : 1);

  if(rBase.u !== bag.u){
    h.push('<div class="crit"><b>Units do not match.</b> The bag is in ' + esc(I.amtU) + ' and the order is in ' +
      esc(I.rateU) + '. Fix one before you set the pump.</div>');
    return h.join('');
  }
  var mlhr = perHr / perML;
  h.push('<div class="bigout k-press"><div class="bov">' + fmt(mlhr,'') + '<small>mL/hr</small></div>' +
    '<div class="bon">bag is ' + fmt(perML,'') + ' ' + bag.u + '/mL · delivering ' + fmt(perHr,'') + ' ' + bag.u + '/hr' +
    (perKg ? ' for ' + fmt(w,'') + ' kg' : '') + '</div></div>');
  if(mlhr > 999) h.push('<div class="crit"><b>' + fmt(mlhr,'') + ' mL/hr exceeds most transport pumps.</b> The bag is too dilute for this order — ask the referring pharmacy for a concentrated mix.</div>');
  if(mlhr < 1)   h.push('<div class="note k-warn">Under 1 mL/hr. Many pumps will not deliver this reliably; consider a more dilute bag.</div>');

  /* a small titration table around the ordered rate */
  var steps = [0.25,0.5,0.75,1,1.5,2,3];
  h.push('<div class="tw"><table><thead><tr><th>Ordered rate</th><th>Pump</th></tr></thead><tbody>');
  steps.forEach(function(m){
    var r = rate * m, ph = toBase(r, rUnit).v * (time === 'min' ? 60 : 1) * (perKg ? w : 1);
    h.push('<tr' + (m === 1 ? ' class="hi"' : '') + '><td>' + fmt(r,'') + ' ' + esc(I.rateU) + '</td><td>' + fmt(ph / perML,'') + ' mL/hr</td></tr>');
  });
  h.push('</tbody></table></div>');
  return h.join('');
}

    var bsa = Math.sqrt(c * w / 3600);
    rows.push(['Body surface area', fmt(bsa,'') + ' m²', 'Mosteller — √(cm × kg / 3600)']);
  }

    if(e) rows.push(['ETT', fmt(e.unc,'') + ' uncuffed · ' + fmt(e.unc-0.5,'') + ' cuffed', 'depth ' + fmt(e.unc*3,'') + ' cm at the lip · (age + 16) ÷ 4']);

  }

    rows.push(['Defibrillation', fmt(w*2,'J') + ' J then ' + fmt(w*4,'J') + ' J', 'ceiling 10 J/kg = ' + fmt(w*10,'J') + ' J']);
    rows.push(['Cardioversion', fmt(w*0.5,'J') + ' J then ' + fmt(w,'J') + ' J', 'up to 2 J/kg = ' + fmt(w*2,'J') + ' J']);
  }
  if(rows.length){
    h.push('<div class="tw"><table><thead><tr><th>Value</th><th>Result</th><th>Basis</th></tr></thead><tbody>');
    rows.forEach(function(r){ h.push('<tr><td>' + r[0] + '</td><td><b style="color:var(--dose)">' + r[1] + '</b></td><td>' + r[2] + '</td></tr>'); });
    h.push('</tbody></table></div>');
  } else {
    h.push('<div class="nowt"><b>Nothing to derive yet.</b> Add an age, a weight or a height.<button type="button" data-focus="iWt">Enter weight</button></div>');
  }

  h.push('<div class="cgrid" style="margin-top:16px">');
  h.push('<label class="cf"><span>Systolic</span><input type="number" inputmode="decimal" data-cs="vitals.sbp" value="' + esc(V.sbp) + '" placeholder="mmHg"></label>');
  h.push('<label class="cf"><span>Diastolic</span><input type="number" inputmode="decimal" data-cs="vitals.dbp" value="' + esc(V.dbp) + '" placeholder="mmHg"></label>');
  h.push('<label class="cf"><span>Heart rate</span><input type="number" inputmode="decimal" data-cs="vitals.hr" value="' + esc(V.hr) + '" placeholder="bpm"></label>');
  h.push('</div>');
  var sb = parseFloat(V.sbp), db = parseFloat(V.dbp), hr = parseFloat(V.hr), out = [];
  if(isFinite(sb) && isFinite(db)){
    var map = (sb + 2*db)/3;
    out.push(['MAP', fmt(map,'') + ' mmHg', map < 65 ? 'below the usual 65 mmHg perfusion target' : 'pulse pressure ' + fmt(sb-db,'') + ' mmHg']);
  }
  if(isFinite(sb) && isFinite(hr) && sb > 0){
    var si = hr / sb;
    out.push(['Shock index', fmt(si,''), si >= 0.9 ? 'elevated — 0.9 or above suggests occult hypoperfusion' : 'normal range 0.5–0.7']);
  }
  if(isFinite(sb) && a != null && isPed()){
    var floor = sbpMin();
    out.push(['Against age floor', sb + ' vs ' + floor, sb < floor ? 'HYPOTENSIVE for age' : fmt(sb - floor,'') + ' mmHg above the floor']);
  }
  if(out.length){
    h.push('<div class="tw"><table><tbody>');
    out.forEach(function(r){ h.push('<tr><td>' + r[0] + '</td><td><b style="color:var(--dose)">' + r[1] + '</b></td><td>' + r[2] + '</td></tr>'); });
    h.push('</tbody></table></div>');
  }
  return h.join('');
}

/* flatten a guideline into plain text for the model */
function protoText(p){
  var out = ['PCG ' + p.id + ' — ' + p.t + (p.rev ? ' (Rev ' + p.rev + ')' : '') + ' [' + SEC[p.s].t + ', source p.' + p.pg + ']'];
  function line(x){ return String(x).replace(/<[^>]+>/g,'').replace(/\{\{([0-9.]+)\}\}/g,'PCG $1'); }
  p.b.forEach(function(b){
    if(b[0] === 'h' || b[0] === 'sub') out.push('## ' + line(b[1]));
    else if(b[0] === 'note' || b[0] === 'crit') out.push((b[0] === 'crit' ? '!! ' : '') + line(b[1]));
    else if(b[0] === 'ul') (function walk(a, d){
        a.forEach(function(i){
          if(Array.isArray(i)){ out.push(d + '- ' + line(i[0])); walk(i[1] || [], d + '  '); }
          else out.push(d + '- ' + line(i));
        });
      })(b[1], '');
    else if(b[0] === 'alt') out.push('-- OR --');
    else if(b[0] === 'rx'){
      var r = b[1];
      out.push('RX ' + line(r.n) + ' | ' + line(r.d || '') + ' | ' + (r.r || '') + (r.note ? ' | ' + line(r.note) : ''));
    }
    else if(b[0] === 'tbl'){
      out.push('TABLE ' + b[1].h.join(' | '));
      b[1].r.forEach(function(row){ out.push('  ' + row.map(line).join(' | ')); });
    }
  });
  return out.join('\n');
}

function formText(f){
  function g(l, lab){ return (l || []).map(function(r){ return '  ' + lab + ': ' + r.d + ' ' + (r.r || '') + (r.note ? ' — ' + String(r.note).replace(/<[^>]+>/g,'') : ''); }).join('\n'); }
  return 'FORMULARY (Rev 2024.04) ' + f.n + (f.alt ? ' (' + f.alt + ')' : '') + '\n' +
    [g(f.a,'Adult'), g(f.p,'Pediatric'), g(f.ob,'Obstetric')].filter(Boolean).join('\n') +
    (f.ind ? '\n  Indications: ' + f.ind.join('; ') : '') +
    (f.contra ? '\n  Contraindications: ' + f.contra.join('; ') : '');
}

function skillText(s){
  return 'SKILL ' + s.t + ' (' + s.sub + ')\n  Indications: ' + s.ind.join('; ') +
    '\n  Contraindications: ' + s.contra.join('; ') + '\n' +
    s.steps.map(function(x, i){
      return '  ' + (i+1) + '. ' + x.t + ' — ' + (x.b || []).join(' ').replace(/<[^>]+>/g,'') +
        (x.rx ? '\n     doses: ' + x.rx.map(function(r){ return r.n + ' ' + r.d + ' ' + (r.r||''); }).join('; ') : '') +
        (x.warn ? '\n     WARNING: ' + String(x.warn).replace(/<[^>]+>/g,'') : '');
    }).join('\n');
}

function mcsText(d){
  return 'DEVICE ' + d.t + ' (' + d.sub + ')\n  Before transport: ' + d.pre.map(function(x){return String(x).replace(/<[^>]+>/g,'');}).join('; ') +
    '\n  CRITICAL: ' + String(d.crit).replace(/<[^>]+>/g,'') + '\n' +
    d.alarms.map(function(a){
      return '  ALARM [' + a.sev + '] ' + a.a + ' — ' + String(a.s).replace(/<[^>]+>/g,'') +
        '\n    do: ' + a.d.map(function(x){return String(x).replace(/<[^>]+>/g,'');}).join(' | ');
    }).join('\n');
}

/* retrieve the slice of the corpus this question needs */
function aiContext(q){
  var parts = [], seen = {};
  var lex = (function(){ var save = PT.dx; PT.dx = q; var r = lexHits(); PT.dx = save; return r; })();
  var ids = Object.keys(lex).sort(function(a,b){ return lex[b] - lex[a]; }).slice(0,4);
  search(q).slice(0,5).forEach(function(r){ if(ids.indexOf(r.p.id) < 0) ids.push(r.p.id); });
  ids.slice(0,7).forEach(function(id){
    if(BY[id] && !seen[id]){ seen[id] = 1; parts.push(protoText(BY[id])); }
  });

  var ql = q.toLowerCase();
  FORM.forEach(function(f){
    if(parts.length > 22) return;
    var hay = (f.n + ' ' + (f.alt || '')).toLowerCase();
    if(hay.split(/[\s()]+/).some(function(w){ return w.length > 3 && ql.indexOf(w) > -1; })) parts.push(formText(f));
  });
  SKILLS.forEach(function(s){
    var hay = (s.t + ' ' + s.sub + ' ' + s.id).toLowerCase();
    if(hay.split(/[\s—/]+/).some(function(w){ return w.length > 3 && ql.indexOf(w) > -1; })) parts.push(skillText(s));
  });
  MCS.forEach(function(d){
    var hay = (d.t + ' ' + d.sub + ' ' + d.id).toLowerCase();
    if(hay.split(/[\s/]+/).some(function(w){ return w.length > 2 && ql.indexOf(w) > -1; })) parts.push(mcsText(d));
  });
  V24.forEach(function(v){
    if(/2024|revision|changed|new|updated|supersede/i.test(q)) parts.push('REVISION 2024.04 — ' + v.t + '\n  2020: ' +
      String(v.was).replace(/<[^>]+>/g,'') + '\n  Now: ' + String(v.now).replace(/<[^>]+>/g,''));
  });
  return parts.join('\n\n---\n\n').slice(0, 90000);
}

function aiCall(userText){
  var ctx = aiContext(userText);
  var body = {
    model: 'claude-sonnet-4-6',
    max_tokens: 1400,
    system: AI_SYSTEM,
    messages: AI.msgs.slice(-6).map(function(m){ return {role:m.role, content:m.content}; }).concat([{
      role: 'user',
      content: 'PATIENT IN THE APP: ' + aiPatient() + '\n\nGUIDELINE EXCERPTS:\n\n' + (ctx || '(nothing matched)') +
               '\n\n---\n\nQUESTION: ' + userText
    }])
  };
  var headers = {'Content-Type':'application/json'};
  var url = 'https://api.anthropic.com/v1/messages';
  if(AI.key){
    headers['x-api-key'] = AI.key;
    headers['anthropic-version'] = '2023-06-01';
    headers['anthropic-dangerous-direct-browser-access'] = 'true';
  }
  return fetch(url, {method:'POST', headers:headers, body:JSON.stringify(body)})
    .then(function(r){

      return r.json();
    })
    .then(function(d){
      return (d.content || []).filter(function(b){ return b.type === 'text'; }).map(function(b){ return b.text; }).join('\n').trim();
    });

function aiAsk(q){

    AI.msgs.push({role:'assistant', content: txt || '(empty response)'});
  }).catch(function(e){

  }).then(function(){

function mdLite(s){
  var out = esc(s)
    .replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>')
    .replace(/`([^`]+)`/g,'<code>$1</code>')
    .replace(/\bPCG\s+(\d+\.\d+|O\.\d+)\b/g, function(m, id){
      return BY[id] ? '<a class="xref" href="#p/' + id + '">PCG ' + id + '</a>' : m;
    });
  return out.split('\n').map(function(l){
    var t = l.trim();
    if(/^[-•*]\s+/.test(t)) return '<li>' + t.replace(/^[-•*]\s+/,'') + '</li>';
    if(/^\d+[.)]\s+/.test(t)) return '<li>' + t.replace(/^\d+[.)]\s+/,'') + '</li>';
    return t ? '<p>' + t + '</p>' : '';
  }).join('').replace(/(<li>.*?<\/li>)(?!<li>)/g, function(m){ return m; })
    .replace(/(?:<li>[\s\S]*?<\/li>)+/g, function(m){ return '<ul class="bl">' + m + '</ul>'; });
}

/* ---------- formatting ---------- */
function fmt(n, u){
  if(n == null || !isFinite(n)) return '—';
  var a = Math.abs(n), d;
  if(u === 'J' || u === 'mL/hr' || u === 'units/hr') d = 0;
  else if((u === 'mL' || u === 'units' || u === 'mcg' || u === 'mcg/min' || u === 'mcg/hr') && a >= 10) d = 0;
  else if(a >= 100) d = 0;
  else if(a >= 10) d = 1;
  else if(a >= 1) d = 2;
  else if(a >= 0.1) d = 2;
  else d = 3;
  var s = n.toFixed(d);
  if(s.indexOf('.') > -1) s = s.replace(/0+$/,'').replace(/\.$/,'');
  var neg = s.charAt(0) === '-'; if(neg) s = s.slice(1);
  var pr = s.split('.'), whole = pr[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  return (neg?'-':'') + whole + (pr[1] ? '.' + pr[1] : '');
}

/* ---------- dose engine ---------- */
function dose(c){
  if(!c) return null;
  var w = kg();

  if(c.per === 'burn'){
    if(w == null) return {need:'weight'};
    if(!PT.tbsa) return {need:'tbsa'};
    var tot = c.lo * w * PT.tbsa;
    return {v: fmt(tot,'mL'), u:'mL',
      n:'total over 24 h at ' + c.lo + ' mL/kg/%TBSA · first half (' + fmt(tot/2,'mL') +
        ' mL) over 8 h from the time of the burn = <b>' + fmt(tot/16,'mL/hr') + ' mL/hr</b> · ' +
        fmt(w,'') + ' kg × ' + PT.tbsa + '% TBSA'};
  }
  if(c.per === '421'){
    if(w == null) return {need:'weight'};
    var r = w <= 10 ? w * 4 : (w <= 20 ? 40 + (w - 10) * 2 : 60 + (w - 20));
    return {v: fmt(r,'mL/hr'), u:'mL/hr', n:'4-2-1 maintenance for ' + fmt(w,'') + ' kg'};
  }
  if(w == null) return {need:'weight'};

  var lo = c.lo * w, hi = (c.hi != null ? c.hi * w : null), cap = false, raised = false;
  if(c.max != null){
    if(hi != null && hi > c.max){ hi = c.max; cap = true; }
    if(lo > c.max){ lo = c.max; cap = true; if(hi != null && hi <= lo) hi = null; }
  }
  if(c.min != null && lo < c.min){ lo = c.min; raised = true; if(hi != null && hi < lo) hi = lo; }

  var val = (hi != null && hi !== lo) ? (fmt(lo,c.u) + '–' + fmt(hi,c.u)) : fmt(lo,c.u);
  var parts = [];
  if(c.lbl) parts.push(c.lbl);
  parts.push('for ' + fmt(w,'') + ' kg');
  if(c.per === 'kg/hr') parts.push('per hour');
  if(c.per === 'kg/min') parts.push('per minute');
  if(raised) parts.push('raised to protocol minimum ' + fmt(c.min,c.u) + ' ' + c.u);
  if(cap) parts.push('<b>ceiling applied</b> — ' + (c.maxlbl || ('max ' + fmt(c.max,c.u) + ' ' + c.u)) +
      ' (weight-based would be ' + fmt(c.lo * w, c.u) + ' ' + c.u + ')');
  if(c.pedonly && !isPed()) parts.push('pediatric dosing');
  if(c.note) parts.push(c.note);
  return {v: val, u: c.u, n: parts.join(' · '), cap: cap};
}

function ettSize(){

  if(a == null) return null;
  if(a < 1) return {unc: a < 0.25 ? 3.0 : 3.5};

  return {unc: s > 8 ? 8 : s};
}
function sbpMin(){
  var a = ageY();
  if(a == null) return null;
  if(a < 1/12) return 60;

}

}

var ETT_AGES = [0,0.5,1,2,3,4,5,6,8,10,12,14,18];
function hiRow(tid, i){
  var a = ageY(), w = kg();
  if(tid === 'ett'){
    if(a == null && w == null) return false;

      var best = 0, d = Infinity;
      for(var k = 0; k < ETT_AGES.length; k++){
        var dd = Math.abs(ETT_AGES[k] - a);
        if(dd < d){ d = dd; best = k; }
      }
      return i === best;
    }
    var wts = [3.5,7,10,12,14,16,18,20,25,30,40,50,70], bw = 0, dw = Infinity;
    for(var j = 0; j < wts.length; j++){
      var e = Math.abs(wts[j] - w);
      if(e < dw){ dw = e; bw = j; }
    }
    return i === bw;
  }
  if(tid === 'neoett'){
    if(w == null || w > 5) return false;
    return (w < 1 && i === 0) || (w >= 1 && w < 2 && i === 1) || (w >= 2 && w < 3 && i === 2) || (w >= 3 && i === 3);
  }
  if(a == null) return false;
  if(tid === 'vitals')
    return (a < 1/12 && i === 0) || (a >= 1/12 && a < 1 && i === 1) || (a >= 1 && a < 3 && i === 2) ||
           (a >= 3 && a < 8 && i === 3) || (a >= 8 && a < 12 && i === 4) || (a >= 12 && i === 5);
  if(tid === 'sbp')
    return (a < 1/12 && i === 0) || (a >= 1/12 && a < 1 && i === 1) || (a >= 1 && i === 2);

}

function liHTML(item){

    return '<li>' + xr(item[0]) + '<ul class="bl">' + (item[1]||[]).map(liHTML).join('') + '</ul></li>';
  return '<li>' + xr(item) + '</li>';
}

function rxHTML(r){
  var d = dose(r.calc), h = [];
  h.push('<div class="rx' + (d && d.v ? ' hasval' : '') + '">');
  h.push('<div class="rxtop"><span class="rxname">' + xr(r.n) + '</span>');
  if(r.d) h.push('<span class="rxdose">' + xr(r.d) + '</span>');
  if(r.r) h.push('<span class="rxroute">' + esc(r.r) + '</span>');
  h.push('</div>');
  if(d){
    if(d.need === 'weight'){
      h.push('<div class="needw">Weight-based — <button type="button" data-focus="iWt">enter weight</button> to calculate.</div>');
    } else if(d.need === 'tbsa'){
      h.push('<div class="needw">Burn surface area:<input class="tbsain" type="number" inputmode="decimal" min="1" max="100" step="1" placeholder="%" value="' +
        (PT.tbsa || '') + '" aria-label="Percent total body surface area burned">% TBSA</div>');
    } else {
      h.push('<div class="calc"><span class="calcv">' + d.v + '</span><span class="calcu">' + esc(d.u) + '</span>' +
        (d.n ? '<span class="calcn' + (d.cap ? ' cap' : '') + '">' + d.n + '</span>' : '') + '</div>');
      if(r.calc && r.calc.per === 'burn')
        h.push('<div class="needw">%TBSA<input class="tbsain" type="number" inputmode="decimal" min="1" max="100" step="1" value="' + PT.tbsa + '" aria-label="Percent TBSA"></div>');
    }
  }
  if(r.note) h.push('<div class="rxnote">' + xr(r.note) + '</div>');
  h.push('</div>');
  return h.join('');
}

function blkHTML(b){
  var k = b[0];
  if(k === 'h')    return '<h4>' + xrShort(b[1]) + '</h4>';
  if(k === 'sub')  return '<h4>' + xr(b[1]) + '</h4>';
  if(k === 'p')    return '<p>' + xr(b[1]) + '</p>';
  if(k === 'ul')   return '<ul class="bl">' + b[1].map(liHTML).join('') + '</ul>';
  if(k === 'note') return '<div class="note">' + xr(b[1]) + '</div>';
  if(k === 'crit') return '<div class="crit">' + xr(b[1]) + '</div>';
  if(k === 'alt')  return '<div class="rxalt">— or —</div>';
  if(k === 'rx')   return rxHTML(b[1]);
  if(k === 'tbl'){
    var t = b[1], o = ['<div class="tw"><table><thead><tr>'];
    t.h.forEach(function(c){ o.push('<th>' + c + '</th>'); });
    o.push('</tr></thead><tbody>');
    t.r.forEach(function(row, i){
      o.push('<tr' + (hiRow(t.id, i) ? ' class="hi"' : '') + '>');
      row.forEach(function(c){ o.push('<td>' + xr(c) + '</td>'); });
      o.push('</tr>');
    });
    o.push('</tbody></table></div>');
    return o.join('');
  }
  return '';
}
var OPENALL = false;

function groupBlocks(bs){
  var g = [], cur = null;
  bs.forEach(function(b){
    if(b[0] === 'h'){ cur = {t:b[1], items:[]}; g.push(cur); }
    else { if(!cur){ cur = {t:null, items:[]}; g.push(cur); } cur.items.push(b); }
  });
  return g;
}

function secTitle(t){ return String(t).replace(/\{\{[^}]*\}\}/g,'').replace(/\s+/g,' ').trim(); }

/* Each heading becomes a section you open. On a phone that is the
   difference between a readable page and a wall of text. */
function blocksHTML(bs, K){
  var g = groupBlocks(bs), h = [];
  g.forEach(function(grp, i){
    var body = grp.items.map(blkHTML).join('');
    if(grp.t == null){ h.push('<div class="secb" style="padding:0">' + body + '</div>'); return; }
    var nrx = grp.items.filter(function(b){ return b[0] === 'rx'; }).length;
    var warn = grp.items.some(function(b){ return b[0] === 'crit'; });
    var bdg = (nrx ? '<span class="sbdg">' + nrx + ' RX</span>' : '') +
              (warn ? '<span class="sbdg warn">!</span>' : '');
    h.push('<details class="sect ' + (K || '') + '" id="sec' + i + '"' + ((OPENALL || i === 0) ? ' open' : '') + '>' +
      '<summary class="sech"><i class="chev">▶</i><span class="st">' + xrShort(grp.t) + '</span>' +
      (bdg ? '<span class="sb">' + bdg + '</span>' : '') + '</summary>' +
      '<div class="secb">' + body + '</div></details>');
  });
  return h.join('');
}

function jumpBar(bs, K){
  var g = groupBlocks(bs), items = [];
  g.forEach(function(grp, i){
    if(grp.t) items.push('<a href="#sec' + i + '" data-jump="' + i + '">' + esc(secTitle(grp.t).slice(0,30)) + '</a>');
  });
  if(items.length < 3) return '';
  return '<div class="sjump ' + (K || '') + '"><button class="tog" type="button" data-openall="1">' +
    (OPENALL ? 'Collapse all' : 'Expand all') + '</button>' + items.join('') + '</div>';
}

/* ---------- advisories ---------- */
function evHTML(id){

  var r = RESOLVED[id];

    '<summary class="evh"><i>▶</i><span>' + (r ? 'SETTLED BY REV 2024.04 — ' : '') + esc(e.t) + '</span></summary>' +
    '<div class="evb">' +
      (r ? '<p><span class="lbl">Resolved in the 2024 revision</span>' + xr(r.now) + '</p>' : '') +
