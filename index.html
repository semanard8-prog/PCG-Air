 ['rx',{n:'Sodium Bicarbonate 4.2% (infant)',d:'1 mEq/kg \u00D7 1',r:'IV',calc:{per:'kg',lo:1,u:'mEq'}}]
]});

P.push({id:'5.5',s:'5',pg:62,t:'Facial and Neck Trauma',sx:['facial trauma','neck trauma','midface fracture','csf','airway','scalp bleeding','le fort'],flags:['ev-txa-dose'],b:[
 ['h','Indications'],
 ['ul',['Any patient exhibiting signs and symptoms of blunt or penetrating trauma to the face and neck.']],
 ['crit','Be especially attentive to airway management principles \u2014 <b>these patients are at high risk of losing an initially adequate airway.</b> Disrupted anatomy may prevent adequate ventilation by BVM.'],
 ['h','Interventions'],
 ['ul',[
   'Conduct primary assessment, assure adequate ABCs.',
   'Suspect concurrent cervical spine, head, and ocular trauma. Maintain immobilization per clinical presentation.',
   'Control hemorrhage by means of direct pressure, packing or ligation before departure.',
   'Establish two IVs. Stabilize bone fragments or penetrating objects.',
   'Observe for CSF otorrhea or rhinorrhea.',
   'For uncontrolled scalp hemorrhage use bulk dressing and direct pressure (cautiously on neck). If unsuccessful consider hemostatic gauze \u2014 {{7.16}}.',
   '<strong>Do not insert NG tube if severe facial injury or midface fracture</strong> \u2014 utilize an OG tube for gastric decompression.',
   'Continually reassess airway for patency. Monitor for changes in hemodynamic and neurologic status.']],
 ['h','Airway'],
 ['ul',['Patients with maxillofacial trauma can be difficult to manage with typical orotracheal intubation.','If an airway cannot be maintained with BLS maneuvers, refer to {{2.3}}.','<strong>The use of a paralytic in RSI is indicated with caution in an unstable midface fracture due to distortion of the anatomy.</strong> Concurrently, prepare for needle/surgical cricothyrotomy \u2014 {{7.17}} or {{7.18}}.']],
 ...TRAUMA_HEMO
]});

P.push({id:'5.6',s:'5',pg:63,t:'Head Trauma',sx:['head trauma','tbi','herniation','icp','gcs','cushing','hypertonic saline','posturing','brain injury'],flags:['ev-txa-dose'],b:[
 ['h','Indications'],
 ['ul',['Any patient who has sustained a head injury who presents with an altered level of consciousness or has a history of unconsciousness following injury.']],
 ['crit','Consider <b>early intubation</b> because of the risk of deterioration during transport. <b>Maintain cerebral perfusion pressure.</b>'],
 ['h','Interventions'],
 ['ul',[
   'Conduct primary assessment, assure adequate ABCs. Control bleeding as directed by {{5.5}}.',
   'Administer supplemental oxygen to maintain SpO\u2082 &gt; 93%.',
   'If mechanically ventilated, maintain <strong>ETCO\u2082 35\u201340 mmHg</strong> until pCO\u2082 is measured, and then trend pCO\u2082.',
   'Place patient in reverse Trendelenburg, elevate head of bed <strong>15 to 20 degrees</strong>. Maintain spinal precautions if indicated.',
   'Obtain iSTAT INR value and ABG. Record and report to receiving staff.',
   'Consider Foley and orogastric tube in intubated patients.',
   'Consider placement of an arterial line. Treat with fluids in the presence of a shock state. <strong>Maintain SBP &gt; 90 mmHg for optimal cerebral perfusion.</strong> The arterial line should NOT cause any delay in transport.',
   'Cerebral perfusion pressure = mean arterial pressure minus intracranial pressure (<strong>CPP = MAP \u2212 ICP</strong>).',
   'Sedate and treat perceived pain \u2014 {{2.4}}. Intermediate-duration neuromuscular agents may be used <em>after</em> sedation for intubated patients resisting the ventilator or agitated with signs of increasing ICP.',
   'Treat seizures per {{4.12}}. Dress open wounds; if bleeding continues, refer to {{7.16}}.',
   'Document neurological status. Note and document spontaneous movement of all extremities.']],
 ['h','Assess for intracranial injury'],
 ['crit','GCS less than 9 \u00B7 Evidence of Cushing\u2019s triad \u00B7 Other evidence of rising intracranial pressure. If present, manage the airway per {{2.3}}.'],
 ['h','Evidence of herniation'],
 ['ul',['Unilateral pupillary dilation','Rapidly decreasing LOC','Decorticate / decerebrate posturing','Increase the ventilator rate sufficient to decrease ETCO\u2082 to at least 35 mmHg, correlating to a pCO\u2082 of 35, as soon as possible']],
 ['rx',{n:'Hypertonic Saline 3%',d:'5 mL/kg over 15 min',r:'IV central or large peripheral',calc:{per:'kg',lo:5,u:'mL',max:250},note:'With GCS &lt; 9, posturing, GCS decrease by 2, signs of increasing ICP or imminent herniation. Maximum 250 mL.'}],
 ...TRAUMA_HEMO
]});

P.push({id:'5.7',s:'5',pg:65,t:'Near Drowning',sx:['drowning','near drowning','submersion','water','hypothermia','aspiration','peep'],b:[
 ['h','Indications'],
 ['ul',['Any patient involved in a near drowning incident.']],
 ['h','Interventions'],
 ['ul',[
   'Conduct primary assessment for compromised airway, breathing and circulation. <strong>Simultaneously maintain spinal precautions.</strong>',
   'If evidence of a compromised airway or unable to protect the airway, proceed to {{2.3}}.',
   'Administer supplemental oxygen to maintain SpO\u2082 &gt; 93%.',
   'If there is evidence of significant bronchospasm, proceed to {{2.5}}.',
   'Begin or maintain cardiopulmonary resuscitation immediately as indicated \u2014 {{3.6}}.',
   'Establish two IVs, with NS at TKO.',
   '<strong>Check temperature.</strong> Treat per {{6.4}} if body temperature is compromised. Maintain warm environment and protect patient from further heat loss.',
   'If the patient becomes hypotensive, refer to {{4.13}}.',
   'Consider OG/NG tube. Consider Foley catheter at referring institution to monitor urine output.',
   'If pulmonary edema is present and felt to be secondary to near drowning, consider intubation \u2014 {{2.3}}. <strong>Oxygenation can be improved with the use of PEEP.</strong>',
   'If O\u2082 saturation cannot be maintained or improved, consider oxygenation strategies similar to {{2.6}}.']],
 ['h','If BGL &lt; 60'],
 ['rx',{n:'Dextrose 50%',d:'25 g',r:'IV'}],
 ['rx',{n:'Glucagon',d:'1 mg',r:'IM',note:'If unable to obtain IV access. (Source document reads \u201C1 gram\u201D \u2014 1 mg is the correct unit.)'}]
]});

P.push({id:'5.8',s:'5',pg:66,t:'Ocular Emergencies',sx:['eye','ocular','globe rupture','hyphema','chemical splash','irrigation','vision loss','canthotomy'],b:[
 ['h','Indications'],
 ['ul',['Patient with injuries to the globe of the eye, including corneal damage, hemorrhage into the globe, penetrating injuries and rupture of the globe.']],
 ['h','Exam'],
 ['ul',['Assess anatomy: pupil size, shape, equality, hyphema or other traumatic injury','Proptosis','Bleeding or fluid emanating from the eye','Extra-ocular movement','Laceration of surrounding structures','Checking visual acuity by finger counting']],
 ['h','Management by injury type'],
 ['ul',[
   ['<strong>Foreign body / imbedded object</strong>',['Reassure and calm patient','Remove contact lenses as soon as possible','If hyphema exists and there are no contraindications, transport with head of bed elevated to at least <strong>45 degrees</strong>']],
   ['<strong>Penetrating injuries</strong>',['<strong>DO NOT put any pressure on the eye.</strong>','Immobilize any penetrating object(s) and secure with a bulky dressing.','Non-pressure shield <strong>both</strong> eyes to prevent movement of the injured eye.']],
   ['<strong>Non-penetrating / blunt trauma</strong>',['Apply rigid shield to both eyes.','If there is significant proptosis with compromised visual acuity, consult sending physician for <strong>emergent lateral canthotomy</strong>.']],
   ['<strong>Foreign substance / chemical</strong>',['Remove loose particulate matter with a cotton swab moistened with saline.','If a chemical is involved, identify the chemical for appropriate treatment.','Irrigate with <strong>1000 mL NS per eye for at least 15\u201330 minutes</strong>.','If the chemical is a base (caustic) and eye damage is evident, continue irrigation with NS until arrival at the receiving facility.']]]]
]});

P.push({id:'5.9',s:'5',pg:66,t:'Spinal Injuries',sx:['spinal','spine','c-spine','neurogenic shock','paralysis','backboard','collar','immobilization'],b:[
 ['h','Indications'],
 ['ul',['Any patient with suspected or known spine injury.']],
 ['crit','<b>Cervical spinal cord injury patients have compromised respiratory function and may deteriorate enroute.</b> Consider pre-transport intubation.'],
 ['note','Removal of spinal immobilization for a patient with a \u201Cnegative\u201D spine injury, per protocol, may require specific communication and interactive skills for non-English speaking or pediatric patients.'],
 ['h','Interventions'],
 ['ul',[
   'Complete primary assessment to evaluate for critical injuries affecting airway, breathing and circulation. Simultaneously protect the spine (cervical, thoracic and lumbar) with appropriate immobilization based upon clinical presentation and mechanism.',
   'Initiate oxygen therapy to maintain SpO\u2082 &gt; 93%.',
   '<strong>Note and document any gross neurologic deficits prior to immobilization.</strong> Document levels of sensory and motor function.',
   'Assess for soft tissue injury, swelling, bony crepitus, pain, deformity, muscle spasm.',
   'Assess movement, sensation, and strength of extremities.',
   'Immobilize patient on backboard with straps and immobilize neck with cervical collar if indicated.',
   'Establish IV, NS at maintenance rate or as dictated by perfusion or associated injuries.',
   'Consider OG/NG tube. Consider Foley catheter at the referring institution if spinal cord injury is evident or there is known spinal column injury.',
   'If the patient develops <strong>neurogenic shock</strong>, follow {{4.13}}.',
   'Be alert for occult trauma to head, chest, abdomen, including pelvis.',
   'Treat pain and anxiety per {{4.16}} and {{4.17}}.']],
 ['note','<strong>Interfacility transfers:</strong> the use of a spine backboard can still be used as a transportation device at the discretion of the flight team.']
]});

P.push({id:'6.1',s:'6',pg:68,t:'Alcohol Emergencies',sx:['alcohol','etoh','withdrawal','dts','delirium tremens','thiamine','intoxication','methanol','ethylene glycol'],b:[
 ['h','Indications'],
 ['ul',['Any patient experiencing some or all of the following symptoms resulting from cessation of habitual alcohol intake: malaise, tremulousness, sweating, agitation, elevated blood pressure, hallucinations, tachycardia, hyperthermia, cardiovascular collapse, and seizures.']],
 ['crit','<b>Delirium tremens</b> (which can cause altered mental status) and <b>withdrawal seizures</b> can occur <b>6 to 24 hours</b> after the last alcoholic drink.'],
 ['h','Pearls, pitfalls and considerations'],
 ['ul',[
   'Trauma, communicable disease and alcoholism are frequently companions. Other significant co-morbidities may exist.',
   'If possible, determine when the patient last consumed alcohol and the quantity. Identify significant sequelae from alcohol use or withdrawal including seizures and delirium tremens in the past.',
   '<strong>Any significant simple or complex partial seizure is NOT alcohol related.</strong> The patient requires further investigation of the etiology (i.e. head CT). Refer to {{4.12}}.',
   'Determine if there are significant co-ingestants or other types of toxic alcohols consumed.']],
 ['h','Interventions'],
 ['ul',['Establish and maintain an adequate airway and ventilation. Assess for trauma concurrently.','Monitor EKG, end-tidal CO\u2082 and O\u2082 saturations.','Initiate IV access and provide 0.9% NS to achieve adequate hydration, <strong>250\u2013500 mL initial bolus</strong>. Use cautiously in patients with a history of CHF, renal failure, or pulmonary edema.','Maintain NPO status during patient care.','Restrain if needed to provide a safe transport for the patient and team.','If the patient becomes lethargic after benzodiazepine administration, consider advanced airway protection per {{2.3}}.']],
 ['h','If BGL &lt; 60 mg/dL'],
 ['rx',{n:'Dextrose 50%',d:'25 g',r:'IV push'}],
 ['rx',{n:'Glucagon',d:'1 mg',r:'IM',note:'If unable to obtain IV access.'}],
 ['rx',{n:'Thiamine',d:'100 mg',r:'IV / IM',note:'Give prior to dextrose if possible. <strong>Do not withhold dextrose if thiamine is unavailable.</strong>'}],
 ['h','Benzodiazepines for tremulousness, agitation, seizures'],
 ['note','Use caution in patients who are heavily intoxicated or have current head injuries.'],
 ['rx',{n:'Midazolam',d:'2.5\u20135 mg',r:'IV / IM',note:'May repeat q3\u20135 minutes as indicated.'}],
 ['alt'],
 ['rx',{n:'Lorazepam',d:'1\u20132 mg',r:'IV',note:'May repeat q15 minutes.'}],
 ['note','Most patients who experience alcohol withdrawal seizures will not seize after the administration of appropriate doses of benzodiazepines. For seizures refer to {{4.12}}.'],
 ['h','Toxic alcohols'],
 ['ul',['Isopropyl alcohol','Methanol','Ethylene glycol']],
 ['crit','In the setting of <b>ethylene glycol and methanol ingestions, rapid transport is required to a center that can provide emergent dialysis.</b> Consider Fomepizole \u2014 refer to the referring or receiving physician for dosing. During transport contact the receiving physician or medical director for potential administration of a Sodium Bicarbonate bolus or maintenance drip.']
]});

P.push({id:'6.2',s:'6',pg:70,t:'Behavioral Emergencies',sx:['behavioral','agitation','combative','restraint','psychiatric','violent','confusion','flight safety'],b:[
 ['h','Indications'],
 ['ul',['Any patient who demonstrates restlessness, agitation, confusion or potentially violent behavior regardless of underlying diagnosis.','The AirLIFE provider will assess the patient and take appropriate measures to sedate and restrain the patient prior to and during transport to ensure a safe and secure environment.']],
 ['crit','<b>Agitation may signal a physiologic deterioration</b> of the patient and accompany hypoxia, hypoglycemia, cerebral edema, etc. Changes in behavior may have a physiologic or pharmacologic explanation.'],
 ['crit','If behavior compatible with safe flight <b>cannot be achieved or predictably maintained, other transport modes MUST be considered.</b>'],
 ['h','Interventions'],
 ['ul',[
   'Assess mental, emotional, and physical status thoroughly prior to departure. Anticipate changes in attitude and behavior.',
   'Maintain calm demeanor and environment; give explanations to patient as appropriate.',
   'Establish intravenous access. If there is potential for agitation, make an additional attempt to secure IV access (Cling, bandages, etc).',
   'Attend to concurrent medical or trauma needs as per protocol.',
   'Medicate confused/combative patients as needed \u2014 {{4.17}}.',
   'Ensure that the patient is not carrying weapons or other items which may be used as such (e.g. ballpoint pens).',
   'If the patient continues to demonstrate aggression or combativeness and is deemed a risk to flight safety, and air transport is imperative, they should be <strong>sedated, paralyzed, and intubated</strong> \u2014 {{2.3}}.']]
]});

P.push({id:'6.3',s:'6',pg:71,t:'Hyperthermia / Heat Stroke',sx:['hyperthermia','heat stroke','heat exhaustion','hot','cooling','fever','environmental'],b:[
 ['h','Indications'],
 ['ul',['Any patient with exposure to environmental heat or drugs that increase body temperature above normal with the resulting loss of body fluids and electrolytes.','Heat exhaustion can progress to heat stroke if not treated.','Heat stroke patients may perspire or they may present hot, dry, and with flushed skin.']],
 ['crit','The differentiation between <b>heat stroke</b> and mild <b>heat exhaustion</b> is <b>mental status changes</b> in the former.'],
 ['h','Interventions'],
 ['ul',[
   'Assess and manage airway, breathing, and circulation. Move patient to a cool area. Remove clothing.',
   'Protect the patient from heat challenge. <strong>If core temp is above 104\u00B0F, cool the patient by radical cooling.</strong>',
   'Place ice packs in axilla and groin and moisten exposed skin to facilitate evaporative cooling.',
   'Provide oxygen appropriate for the patient\u2019s condition.',
   ['<strong>Discontinue radical cooling if:</strong>',['Shivering begins','CNS function returns to normal']],
   'Establish large bore IV access of 0.9% NS, perform fluid challenge of <strong>500 mL</strong> unless contraindicated.',
   'Initiate hemodynamic monitoring including BP, heart and respiratory rate, end tidal CO\u2082 and O\u2082 saturations.',
   'Consider Foley and NG tube if appropriate.']],
 ['h','If BGL &lt; 60 mg/dL'],
 ['rx',{n:'Dextrose 50%',d:'25 g',r:'IV'}],
 ['alt'],
 ['rx',{n:'Glucagon',d:'1 mg',r:'IM',note:'If unable to obtain IV access.'}]
]});

P.push({id:'6.4',s:'6',pg:72,t:'Hypothermia',sx:['hypothermia','cold','rewarming','frozen','exposure','core temperature','naloxone'],b:[
 ['h','Indications'],
 ['ul',['Any patient with low core body temperature (usually less than 35\u00B0C / 95\u00B0F) rectally, with or without accompanying signs and symptoms.']],
 ['h','Prevent further heat loss'],
 ['ul',['Insulate from cold','Protect from wind','Remove wet clothing','Cover with vapor barrier and blankets','Move to warm environment']],
 ['crit','<b>Minimize extraneous stimuli and movement of patient. Do not rub or manipulate extremities.</b>'],
 ['h','Interventions'],
 ['ul',['Assess ABCs. Establish and maintain airway and ventilation. Initiate airway protection if indicated per {{2.3}}.','Provide supplemental oxygen, <strong>preferably heated and humidified</strong>.','Initiate hemodynamic monitoring (ECG, BP, end tidal CO\u2082 and oxygen saturation).','Initiate and maintain two IVs, with NS warmed if possible. Consider Foley catheter.']],
 ['h','Mild to moderate hypothermia (32\u201335\u00B0C)'],
 ['ul',['Patient is cold but is not experiencing any severe adverse physiologic symptoms.','IV therapy same as normothermic patient.','Continue to aggressively rewarm patient with blankets and other external heat sources. <strong>Be sure not to leave external heat sources unmonitored. Monitor for thermal burns aggressively.</strong>']],
 ['h','Severe hypothermia (&lt; 32\u00B0C)'],
 ['ul',['<strong>Life signs present</strong> (pulse and respirations present, temperature \u2264 30\u00B0C / 86\u00B0F, depressed vital signs, altered LOC, no shivering) \u2014 consider transport to a center with bypass capability.','Administer warmed intravenous fluids. Initial bolus of LR/NS is 250\u2013500 mL. Repeat as needed.','Once the patient\u2019s temperature is approximately <strong>86\u00B0F (31\u00B0C)</strong>, all ACLS procedures and drugs should be utilized in the usual manner.']],
 ['rx',{n:'Dextrose 50%',d:'25 g',r:'IV',note:'If fingerstick glucose &lt; 80 mg/dL.'}],
 ['rx',{n:'Glucagon',d:'1 mg',r:'IM',note:'In patients with no IV access.'}],
 ['rx',{n:'Naloxone',d:'0.4\u20132.0 mg',r:'IV / IM',note:'Consider in the patient with decreased level of consciousness.'}],
 ['h','Cardiac arrest in hypothermia'],
 ['ul',['Ascertain presence or absence of pulse or respirations for <strong>one minute</strong>. If absent, start CPR.','<strong>CPR should not be initiated if core temperature is less than 60\u00B0F (15.5\u00B0C)</strong> or if the patient\u2019s chest wall is frozen making compression impossible.','Chest compressions should never be done if any clinical signs of life are present, even if a pulse is not palpable, and should be done only if functional cardiac activity is definitely absent (V-fib/asystole on monitor, or the patient loses pulse).','Support ventilations with heated, humidified air or oxygen. Intubate per normothermic patients.','See cardiac protocols for the particular dysrhythmia; however, <strong>defibrillation and antidysrhythmic medications should be withheld unless core temp is 86\u00B0F or greater</strong>.','If the patient is in VF or VT, repeat defibrillation as the core temperature rises.','Contact on-line medical control or the medical director for mitigating circumstances.']],
 ['crit','<b>Termination of resuscitation efforts cannot be done until the patient has a core temperature of 35\u00B0C (95\u00B0F) or greater.</b>']
]});

P.push({id:'6.5',s:'6',pg:74,t:'Toxic Ingestions and Overdose',sx:['overdose','toxic ingestion','poisoning','naloxone','narcan','tca','opioid','poison control','antidote'],flags:['ev-naloxone-dose'],b:[
 ['h','Indications'],
 ['ul',['Any patient diagnosed or suspected of having an overdose of medications, drugs, or products. <strong>Ensure patient is not contaminated.</strong>']],
 ['crit','Poison Control Center: <b>1-800-222-1222</b>. AirLIFE staff can call the poison center with any concerns at any point of patient care.'],
 ['h','Pearls, pitfalls and considerations'],
 ['ul',['Management principles include reducing exposure and absorption, enhancing elimination and treatment of signs and symptoms.','Attempt to identify a syndrome for which a selected physiologic antagonist may be administered. It is beyond the capacity of these protocols to identify the treatment for each and every poisoning which may be encountered.','Contact online medical control for specific treatment instructions.']],
 ['h','Interventions'],
 ['ul',[
   'Ensure safety of providers prior to evaluation. <strong>All patients should be decontaminated prior to evaluation and treatment.</strong>',
   'Assess and manage airway, breathing and circulation. Restrain as needed.',
   'Monitor hemodynamics including ECG, pulse, blood pressure, end tidal capnography and oxygen saturations.',
   'Obtain information on what was ingested and how long since ingestion (if possible and safe, bring bottle or substance ingested).',
   ['For all ingestions, note pupil size, reflexes, and specific signs and symptoms. Obtain 12-lead EKG:',['Note QTc interval','QRS interval','Other cardiac electrical abnormalities']],
   'Obtain IV access. Fluids can be kept at a KVO rate unless there is associated hypotension. If persistent MAP &lt; 65, refer to {{4.13}}.',
   'If the patient experiences seizures, refer to {{4.12}}.',
   'Consider sedation of the agitated or anxious patient \u2014 {{4.17}}.',
   'For all other known ingestions contact OLMD or Poison Control for guidance. Specific antidotes can be given under direct supervision or discussion with poison control and the sending/receiving providers.']],
 ['rx',{n:'Sodium Bicarbonate',d:'50 mEq',r:'IV',note:'If Tricyclic Antidepressant (TCA) overdose is suspected with a widened QRS.'}],
 ['rx',{n:'Dextrose 50%',d:'25 g',r:'IV push',note:'If bedside glucose &lt; 60 mg/dL.'}],
 ['rx',{n:'Glucagon',d:'1 mg',r:'IM',note:'If unable to obtain IV access.'}],
 ['rx',{n:'Naloxone',d:'0.4 mg increments up to 2 mg',r:'IV push',note:'If unknown or suspected narcotic overdose.'}]
]});

P.push({id:'6.6',s:'6',pg:75,t:'Suspected Cyanide Toxicity',sx:['cyanide','hydroxocobalamin','cyanokit','smoke inhalation','fire','lactate','carbon monoxide'],b:[
 ['h','Indications'],
 ['ul',['To be given in patients with suspected cyanide exposure who exhibit neurologic, respiratory or cardiovascular compromise. <strong>This includes cardiac arrest.</strong>']],
 ['crit','Administration should be <b>immediately upon recognizing the need</b> and should <b>not await a confirmatory test</b>.'],
 ['h','Interventions'],
 ['ul',[
   'Assess and manage airway, breathing and circulation.',
   'If adequate spontaneous respirations, administer supplemental oxygen to maintain SpO\u2082 &gt; 93%. If necessary, secure an advanced airway via endotracheal intubation \u2014 {{2.3}}.',
   'Establish IV access of NS/LR at a KVO rate. If the patient displays signs of inadequate perfusion refer to {{4.13}}.',
   '<strong>Use iSTAT to obtain a lactate value. If &gt; 2, administer Hydroxocobalamin.</strong>',
   'Treat seizures per {{4.12}}.']],
 ['h','If unconscious and in persistent shock despite adequate fluid resuscitation'],
 ['rx',{n:'Hydroxocobalamin (adult)',d:'5 g in 200 mL NS over 15 min',r:'IV infusion',note:'If a favorable response is seen and a second dose becomes necessary, a second 5 g dose may be considered.'}],
 ['rx',{n:'Hydroxocobalamin (pediatric)',d:'70 mg/kg',r:'IV',calc:{per:'kg',lo:70,u:'mg',max:5000,maxlbl:'max single dose 5 g'},note:'May repeat once if needed.'}],
 ['crit','Given the high potential for coexisting <b>carbon monoxide toxicity</b> in the smoke inhalation victim, the patient should be transported to a facility with capability for treating CO exposures <b>including hyperbaric oxygen</b> whenever possible.']
]});

P.push({id:'7.1',s:'7',pg:76,t:'Whole Blood, Packed Red Blood Cells and Liquid Plasma',sx:['blood','transfusion','whole blood','prbc','plasma','massive transfusion','hemorrhage','citrate'],b:[
 ['note','Whole blood may be utilized in any medical or trauma patient requiring transfusion in lieu of products.'],
 ['h','Indications for PRBCs \u2014 Adult'],
 ['ul',[['History of obvious or suspected acute blood loss, who have had crystalloid fluid resuscitation with <strong>2 liters of NS</strong>, and who demonstrate:',['SBP less than 90 mmHg, and/or','Clinical signs of shock (altered mental status, tachycardia, pallor, delayed capillary refill)']]]],
 ['h','Indications for PRBCs \u2014 Pediatric'],
 ['ul',[['History of obvious or suspected acute blood loss, who have had crystalloid fluid resuscitation with <strong>40 mL/kg of NS</strong>, and who demonstrate:',['Persistent signs of clinical shock','Altered mental status','Tachycardia','Pallor','Delayed capillary refill']]]],
 ['rx',{n:'Pediatric PRBC transfusion',d:'10 mL/kg incrementally',r:'IV',calc:{per:'kg',lo:10,u:'mL'},note:'Maximum of 40 mL/kg should be transfused in this situation.'}],
 ['rx',{n:'Pediatric transfusion (general)',d:'10\u201320 mL/kg',r:'IV',calc:{per:'kg',lo:10,hi:20,u:'mL'},note:'Maximum rate 0.5 mL/kg/min.'}],
 ['h','Indications for Liquid Plasma'],
 ['crit','Requires age <b>\u2265 16 years</b> AND weight <b>\u2265 50 kg</b>.'],
 ['ul',[['<strong>Trauma</strong> with evidence of, or concern for, severe internal or external hemorrhage AND any one of:',['SBP \u2264 90','HR &gt; 110','RR &gt; 24','Cool, pale skin and capillary refill &gt; 2 seconds','INR &gt; 1.7','Base excess &lt; \u22126','Hemoglobin &lt; 11 g/dL','Platelets &lt; 200,000']],
   ['<strong>Acute (non-traumatic) medical hemorrhage</strong>',['Massive gastrointestinal hemorrhage','Great vessel disruption','Postpartum hemorrhage','Life threatening bleeding from any source with an elevated INR &gt; 1.7','Anticipated emergent or urgent invasive/surgical procedures with concurrent life-threatening hemorrhage','Acute DIC with concurrent life-threatening hemorrhage']],
   '<strong>Intracerebral hemorrhage with INR &gt; 1.7</strong> (traumatic and/or non-traumatic), to include epidural or subdural hematoma, subarachnoid or intraparenchymal hemorrhage']],
 ['note','If AirLIFE is caring for a patient with continued hemodynamic instability from traumatic injury with significant hemorrhage, infusion of liquid plasma in a <strong>1:1 ratio with PRBCs</strong> and co-administration of TXA should be considered if not contraindicated. <strong>In the setting of trauma, PRBCs should be administered first</strong> for oxygen carrying capacity.'],
 ['note','Elevations in the INR can result from multiple causes including Coumadin therapy, congenital factor deficiency, liver disease, and acute coagulopathy of trauma. Co-administration of Vitamin K / phytonadione is indicated.'],
 ['h','Contraindications to liquid plasma'],
 ['crit','Patient &lt; 16 years of age OR &lt; 50 kg \u00B7 Documented intolerance to plasma or its components \u00B7 Congenital deficiency of IgA in the presence of anti-IgA antibodies. This is rarely identified prior to patient contact \u2014 <b>monitor for signs of anaphylaxis with plasma transfusions.</b>'],
 ['h','Clinical management'],
 ['ul',[
   'Remove the blood products from the cooler and check the temperature indicator. <strong>Use only if proper temperature of 2\u20136\u00B0C is maintained.</strong> Record temperature status, blood unit # and time the transfusion was initiated in the patient care record.',
   'Prime blood administration set with 0.9% NaCl.',
   'Utilize blood/fluid warmer \u2014 <strong>cold blood administration exacerbates the trauma triad (coagulopathy, hypothermia and acidosis)</strong>.',
   'Consider placing blood products in a pressure bag for rapid administration.',
   'Obtain temperature at 5 minutes then every 15 minutes for the first two hours.',
   'Return the completed transfusion documentation to the blood bank. Unused blood must be returned to the blood bank refrigerator upon return to the base hospital.',
   'If a transfusion reaction is suspected, <strong>stop transfusion immediately</strong> and present the suspect blood unit and tubing to the receiving facility for testing. Refer to anaphylaxis, pulmonary edema, and shock protocols as appropriate.',
   'If a suspected transfusion reaction has occurred, notify the base hospital blood bank as soon as possible upon completion of transport, and notify the AirLIFE Medical Director.']],
 ['rx',{n:'Calcium Gluconate (adult)',d:'2 grams',r:'IV',note:'Shall be administered after the patient has received two units of any blood product, to help manage potential citrate toxicity.'}],

]});

P.push({id:'7.2',s:'7',pg:78,t:'Tranexamic Acid (TXA)',sx:['txa','tranexamic','antifibrinolytic','trauma','hemorrhage','crash-2'],flags:['ev-txa-dose'],b:[

P.push({id:'7.3',s:'7',pg:79,t:'Management of Coagulopathy',sx:['coagulopathy','inr','reversal','vitamin k','plasma','ffp','pcc','kcentra','cryoprecipitate','platelets'],b:[
 ['h','Indications'],
 ['ul',['Patients on anti-coagulant therapy with prolonged coagulation times with traumatic injuries or surgical emergencies anticipated to require immediate operative intervention.']],
 ['h','Pearls, pitfalls and considerations'],
 ['ul',[
   'The use of intravenous vitamin K has become more mainstream. The possibility of anaphylaxis has lessened in recent years but can still be a rare event.',
   'Oral and intravenous vitamin K are the preferred routes over subcutaneous, because of the erratic absorption rate of subcutaneous vitamin K. <strong>Subcutaneous administration is no longer indicated.</strong>',
   '<strong>OLMD should be consulted before administering Prothrombin Complex Concentrate (K-Centra), Fresh Frozen Plasma, or Cryoprecipitate.</strong>',
   'Communication between sending and receiving facility is valuable due to the delay in thawing some blood products and their availability at some facilities.']],
 ['h','Indication \u2192 action'],
 ['tbl',{h:['Finding','Recommended action'],r:[
  ['Serious or life threatening hemorrhage and/or high probability of emergent surgical intervention with <strong>INR &gt; 1.7 or PTT &gt; 45 sec</strong>','Discontinue anticoagulants, monitor INR until it falls within therapeutic range, administer Liquid Plasma and/or consult OLMD for the use of FFP and PCC.'],
  ['Same, in a patient on <strong>Coumadin therapy</strong>','Discontinue anticoagulants and monitor INR. Administer Liquid Plasma <strong>and Vitamin K 10 mg in 50 mL NS IV over 20 minutes</strong>, and/or consult OLMD for the use of FFP.'],
  ['Same, with <strong>Fibrinogen &lt; 150 mg/dL</strong>','Consider Cryoprecipitate (consult with OLMD).'],
  ['Same, with <strong>Platelet count &lt; 75,000/mm\u00B3</strong>','Consider platelet transfusion (consult with OLMD).'],
  ['Patient who has received a large amount of blood products and has an <strong>ionized calcium below 1.0</strong>','Administer Calcium Gluconate 1 gram IV over 10 minutes.']]}],
 ['rx',{n:'Vitamin K (phytonadione)',d:'10 mg in 50 mL NS over 20 min',r:'IV',note:'For patients on Coumadin therapy.'}],
 ['rx',{n:'Calcium Gluconate',d:'1 gram over 10 min',r:'IV',note:'For ionized calcium below 1.0 after large-volume transfusion.'}]
]});

P.push({id:'7.4',s:'7',pg:81,t:'Rapid Reversal of Coagulopathy in Non-Traumatic ICH',sx:['kcentra','pcc','ich','warfarin reversal','intracerebral hemorrhage','inr','prothrombin complex'],b:[

 ['h','Contraindications'],
 ['crit','History of thromboembolic event (DVT, PE or ischemic stroke) within the last three months \u00B7 Urgent reversal for surgery in the absence of active major bleeding \u00B7 Hypersensitivity to K-Centra or any of its components (factors, heparin, albumin) \u00B7 Disseminated intravascular coagulation (DIC) \u00B7 Suspected or confirmed heparin-induced thrombocytopenia \u00B7 Patients whose care is deemed futile \u00B7 Coagulopathy secondary to liver disease \u00B7 <b>Currently NOT indicated for patients on thrombin inhibitors (dabigatran) or Factor Xa inhibitors (rivaroxaban, apixaban).</b>'],
 ['h','Procedure'],
 ['ul',[
   'Establish patent intravascular access with large bore IV.',
   '<strong>Confirm via CT scan the intracerebral hemorrhage.</strong>',
   'Complete INR via iSTAT or by laboratory staff at the sending facility.',
   'Identify both inclusion and exclusion criteria.',
   'Initiate Vitamin K (phytonadione) IV 5\u201310 mg.',
   'Identify receiving physician and provide extensive history and physical findings.',
   'Obtain order from the physician for administration of K-Centra. Document date, time, and name of the ordering physician.',
   'Clarify with the provider that his or her name will be the name on the medical record for the administration of the therapy.',
   'Document time of administration, route, dose, and any complications.',
   '<strong>In hand-off report, relay information in detail to the accepting provider IN PERSON. It is NOT sufficient to give report to accepting ancillary personnel.</strong>',

P.push({id:'8.2',s:'8',pg:107,t:'Pediatric Airway Management',ped:1,sx:['pediatric airway','pediatric intubation','ett size','child airway','apnea','obstruction'],flags:['ev-peds-atropine'],b:[

 ['ul',['Pediatric patients who present with an obstructed airway, compromised spontaneous breathing (hypoventilation), unremitting hypoxemia, and apnea.']],
 ['h','Clinical management'],
 ['ul',[
   'If effective spontaneous ventilation, administer oxygen appropriate for condition and attach to monitoring devices.',
   'If ineffective ventilation, attempt to open the airway. <strong>In the trauma patient utilize a jaw thrust with cervical spine immobilization; in the non-trauma patient utilize head tilt, chin lift.</strong>',

   ['If unable to ventilate, reposition head and/or neck and reattempt. If still unable, assess for upper airway obstruction:',['Clear airway (suction, Magill forceps)','<strong>Back blows and chest thrusts if &lt; 1 yr; Heimlich maneuver if &gt; 1 yr</strong>','If obstruction is noted and irresolvable, a surgical airway is needed \u2014 {{7.17}}, {{7.18}}']]]],

P.push({id:'8.4',s:'8',pg:109,t:'Pediatric Altered Mental Status, Non-Traumatic',ped:1,sx:['pediatric ams','altered mental status child','lethargy','unresponsive child','hypoglycemia','naloxone','intussusception'],b:[
 ['h','Indication'],
 ['ul',['Identify and correct immediately reversible causes of altered mental status and provide safe and expeditious transport to the closest appropriate facility.']],
 ['h','Possible causes'],
 ['ul',[
   '<strong>Toxic ingestion</strong> \u2014 question caregivers/referring staff about possibility of ingestion and access to substances. Observe for toxidromes (e.g. narcotic ingestion: pinpoint pupils, hypoventilation with AMS).',
   '<strong>Hypoxia</strong> \u2014 observe for airway patency, work of breathing (grunting, retractions, nasal flaring), tachypnea, tachycardia or bradycardia (late sign), cyanosis. Identification of the need for ventilatory support must be made rapidly and largely based on clinical observation.',
   '<strong>Hypovolemia</strong> \u2014 tachycardia, tachypnea, pallor, dry/pale mucous membranes, sunken fontanels, sunken eyes, poor skin turgor, decreased urine output. <strong>Decreased BP is a late sign and should not be used to \u201Crule out\u201D hypovolemia in children.</strong>',
   '<strong>Meningitis / meningoencephalitis</strong> \u2014 fever, nuchal rigidity, petechial rash (non-blanching reddish-purple areas), and bulging fontanels.',
   '<strong>Sepsis</strong> \u2014 history of recent illness, suspected source, or physical portal of entry (wound, umbilical stump). Assess for fever OR hypothermia, mottling of skin, signs of hypovolemia.',
   '<strong>Hypoperfusion of cardiac etiology</strong> \u2014 assess heart rate and regularity; auscultate for murmurs. Palpate brachial and femoral pulses for equality (coarctation of the aorta may present with bounding upper extremity pulses and diminished/absent femoral pulses). <strong>In cyanotic heart defects, cyanosis will persist despite appropriate oxygen administration and ventilation.</strong>',
   '<strong>Neurotrauma</strong> \u2014 question about recent trauma. Assess for head injuries, palpate head for depressed areas or hematomas. Observe for otorrhea, rhinorrhea, bulging fontanels.',
   '<strong>Seizure</strong> \u2014 seizures have numerous presentations in children. Partial seizures can be absence, abnormal vocalizations, or focal motor including head turning, eye deviation, tonic contractions, lip smacking, pedaling motions.',
   '<strong>Metabolic \u2014 DKA</strong> \u2014 assess glucose level. The initial diagnosis of type I diabetes is often made when the patient presents with DKA. Hyperventilation and signs of dehydration may trigger suspicion. See {{8.8}}.',
   '<strong>Metabolic \u2014 electrolyte abnormality</strong> \u2014 sodium imbalances in particular can have major impact on mental status.',
   '<strong>Intussusception</strong> \u2014 telescoping of the bowel into itself, most commonly ileocecal. Often the presentation is lethargy. <strong>The classic finding of \u201Ccurrant jelly stools\u201D is a late sign indicating infarction of the bowel.</strong>',
   '<strong>Stroke and intracerebral hemorrhage</strong> \u2014 though rare, pediatric ischemic strokes and intracranial hemorrhages do occur. Suspect ischemic stroke with unilateral deficits and AMS, particularly with a history of hematologic disorder (e.g. sickle cell disease). Intracranial hemorrhage may be suspected with a history of bleeding disorder (e.g. von Willebrand\u2019s), or infants born at home who did not receive post-partum vitamin K.']],
 ['h','Interventions'],
 ['rx',{n:'0.9% Normal Saline bolus',d:'20 mL/kg',r:'IV',calc:{per:'kg',lo:20,u:'mL'},note:'If volume depletion is suspected. If fluid resuscitation does not correct the problem, refer to {{8.7}}.'}],
 ['h','If blood glucose &lt; 60 mg/dL'],
 ['rx',{n:'D10 (age &gt; 1 year)',d:'5 mL/kg over 5\u201310 min',r:'IV',calc:{per:'kg',lo:5,u:'mL'}}],
 ['rx',{n:'Glucagon (age &gt; 1 year)',d:'0.5 mg',r:'SC / IM',note:'If unable to obtain IV access.'}],
 ['rx',{n:'D10 (infant &lt; 1 year)',d:'2 mL/kg',r:'IV',calc:{per:'kg',lo:2,u:'mL'}}],
 ['rx',{n:'Glucagon (infant &lt; 1 year)',d:'0.25 mg',r:'SC / IM',note:'If unable to obtain IV access.'}],
 ['h','Suspected opioid overdose'],
 ['rx',{n:'Naloxone',d:'0.1 mg/kg',r:'IV / IN',calc:{per:'kg',lo:0.1,u:'mg',max:2,maxlbl:'max single dose 2 mg'},note:'For pediatric patients &lt; 20 kg. If no improvement in level of consciousness, evaluate need for airway protection with tracheal intubation.'}]
]});

P.push({id:'8.6',s:'8',pg:112,t:'Pediatric Cardiac Arrest',ped:1,sx:['pediatric arrest','pals','child cpr','vfib child','pea','defibrillation','amiodarone','pediatric code'],b:[

P.push({id:'9.3',s:'9',pg:126,t:'Breech Presentation',sx:['breech','delivery','childbirth','cord clamp','placenta','postpartum hemorrhage','oxytocin'],b:[
 ['h','Types'],
 ['ul',[
   '<strong>Complete</strong> \u2014 the buttocks are the presenting part. The thighs are flexed up on the abdomen, and the feet and calves rest on the thighs (infant appears to be sitting cross-legged).',
   '<strong>Frank</strong> \u2014 the buttocks are the presenting part. The hips are flexed so that the legs are extended against the abdomen and chest. <strong>This is the most common presentation.</strong>',
   '<strong>Incomplete</strong> \u2014 one or both feet, or knees, extend below the buttocks. Also known as single or double footling breech.',
   '<strong>Compound</strong> \u2014 the buttocks, along with another part (such as a hand), present together.']],
 ['h','Delivery technique'],
 ['ul',[
   'Confirm that appropriately-sized resuscitation equipment (for both mother and infant) is available and functioning. Have OB kit open. Place sterile pad/drape underneath perineum. Wear sterile gloves. Offer reassurance to mother.',
   'Allow the infant to deliver until the umbilicus is visible. Disengage the legs if they do not deliver spontaneously.',
   'After the shoulders have delivered, rotate the infant so that the back is anterior.',
   'Apply gentle downward traction until the hairline is visible.',
   'Place one hand under the trunk so the infant\u2019s body rests on the palm, with the index and middle fingers of that hand supporting the mouth and chin.',
   'Place the other hand on the infant\u2019s back and shoulders, with the middle and index fingers resting on the shoulders, supporting the posterior neck.',
   'Slowly bring the body upward, while a second person applies <strong>suprapubic pressure</strong> to facilitate delivery of the head.',
   'Slowly allow the chin, face, then brow to be delivered. Suction the infant\u2019s mouth as soon as it is delivered. Deliver the rest of the infant\u2019s head.',
   'Clamp and cut the umbilical cord before pulsations in the cord cease. Place 2 Kelly clamps several inches from the umbilicus, cut between the clamps, then place the umbilical clamp. <strong>Note the number of vessels \u2014 normal is two arteries and one vein.</strong>',
   'Immediately dry off and warm the infant. Have a second medical transport team member attend to the newborn. Obtain APGAR score per {{9.2}}.']],
 ['h','Placental delivery'],
 ['ul',['Immediately after infant delivery, assess for signs of placental separation. Place a hand on the fundus and assess for contraction of the uterus. The uterus may rise upwards as the placenta separates and passes downwards. The umbilical cord will protrude 3 or more inches farther out of the vagina. The uterus changes from a discoid to a globular shape and becomes more firm. There may be a sudden trickle or spurt of blood.','<strong>Placental separation usually occurs within 1 to 15 minutes after the infant birth.</strong>','After the placenta separates, have mother bear down to expel the placenta. If unable to bear down, gentle pressure may be exerted on the fundus. <strong>This should not be done unless the uterus is hard, or the risk of uterine inversion greatly increases.</strong>']],
 ['h','Post-partum hemorrhage'],
 ['ul',['Firmly massage uterus.']],
 ['rx',{n:'Oxytocin infusion',d:'20 units / 1,000 mL NS or LR at 20\u201340 milliunits/min (60\u2013120 mL/hr)',r:'IV infusion'}],
 ['alt'],
 ['rx',{n:'Oxytocin',d:'10 units',r:'IM',note:'If no IV access.'}],
 ['rx',{n:'Tranexamic Acid (TXA)',d:'1 g over 10 min, then 1 g over 1 hr',r:'IV',note:'If fundal massage and Oxytocin are unsuccessful at stopping hemorrhage.'}],
 ['rx',{n:'0.9% NaCl or LR bolus',d:'250\u2013500 mL',r:'IV',note:'If hypotensive. For hemorrhagic shock that does not respond to warmed fluid resuscitation, administer blood per {{7.1}}.'}],
 ['note','Place patient in the left or right lateral recumbent position for transport. Contact the receiving physician and/or medical director for further guidance.']
]});

P.push({id:'9.10',s:'9',pg:135,t:'Various Complications of Delivery',sx:['shoulder dystocia','prolapsed cord','amniotic fluid embolus','delivery complication','mcroberts','terbutaline'],b:[
 ['h','Shoulder Dystocia'],
 ['ul',[
   'Place the patient in a <strong>semi-Fowler position</strong>.',
   'The patient\u2019s legs are flexed, with the knees pulled back up onto the thighs.',
   'Hips are abducted out as much as possible, increasing the AP diameter of the pelvis.',
   '<strong>Suprapubic pressure</strong> can be used to attempt to push the anterior shoulder under the symphysis bone. <strong>Do not use fundal pressure.</strong>',
   'Consider reaching into the vagina to deliver the anterior shoulder by trying to rotate it into the pelvis, extraction of the posterior arm, or using a corkscrew maneuver to rotate the shoulders out of the pelvis.',
   '<strong>Delivery of the anterior shoulder must occur within several minutes.</strong>']],
 ['h','Prolapsed Cord'],
 ['ul',[
   'The umbilical cord lies beside or below the presenting part. Compression of the cord between the presenting part and the maternal pelvis reduces or cuts off the blood supply of the fetus and, if uncorrected, leads to fetal death.',
   '<strong>If fetal bradycardia occurs after rupture of the membranes, prolapsed cord should be considered.</strong>',
   'Diagnosis is made by seeing the cord either outside of, or in, the vagina; or feeling the cord on exam.',
   '<strong>Place a hand in the vagina and push and hold the presenting part up and away from the cord. Maintain until the patient is in the operating room.</strong>',
   'Alternatively, the bladder may be filled via Foley catheter to maintain the head in a favorable position.',
   'Minimize manipulation of the cord. At the same time, preparations are made for delivery.',
   'The woman is placed in the <strong>knee-chest or Trendelenburg position</strong>, with the hips elevated and the head low.',
   'Oxygen by NRB to the mother.',
   'Fetal heart rate is checked by doppler if available, and may possibly be palpated in the cord.',
   'If the baby is okay and the cord is protruding out of the vagina, a gauze with sterile saline may be placed on it.']],
 ['rx',{n:'Terbutaline',d:'0.25 mg',r:'SQ',note:'As a tocolytic agent, to decrease frequency of contractions.'}],
 ['h','Amniotic Fluid Embolus'],
 ['ul',[
   'Occurs when amniotic fluid gains access to the maternal circulation during labor or delivery, resulting in obstruction of the pulmonary vasculature.',
   'In addition to the actual amniotic fluid causing emboli, particulate matter such as meconium, lanugo hairs, fetal squamous cells, bile, fat, and mucin may also cause pulmonary emboli.',
   'Maintain airway and supplemental ventilation and oxygen as indicated. <strong>PEEP may be indicated beginning at 5 cm.</strong>',
   'Two large bore IVs and fluid resuscitate as needed.',
   'Monitor mother and fetus frequently and treat the mother\u2019s symptoms as indicated.',
   '<strong>Watch for evidence of D.I.C.</strong>']]
]});

/* ============================================================
   EVIDENCE ADVISORIES
   These compare the 2020 PCG text against literature published
   since. They are DECISION SUPPORT ONLY. The PCG remains the
   operative standing order until the Medical Director says
   otherwise. Every flag states the PCG position first.
   ============================================================ */

const EV = {

'ev-txa-dose':{
  t:'TXA dose is internally inconsistent, and 2 g bolus now has direct trial support',
  pcg:'{{7.2}} specifies a 1 g load over 10 min followed by 1 g over 8 hours (the CRASH-2 regimen). The five trauma protocols ({{5.1}}, {{5.3}}, {{5.4}}, {{5.5}}, {{5.6}}) instead each say \u201CTXA 2 Grams should be considered.\u201D These cannot both be followed.',
  lit:'The Prehospital TXA for TBI trial randomized a 2 g bolus against 1 g + 1 g infusion and placebo; the 2 g bolus arm was associated with improved survival and 6-month disability scores in patients with intracranial hemorrhage, and a subsequent Bayesian reanalysis found a high probability of benefit for the 2 g strategy over both placebo and the standard regimen. The Joint Trauma System updated its guidance in 2023 to favor a 2 g bolus over the traditional 1 g + infusion for prehospital use. TAMPITI found no thromboembolic signal at 2 g or 4 g bolus dosing. A 2025 NAEMSP / ACEP / ACS-COT joint position statement addresses simplified prehospital dosing.',
  act:'A single 2 g bolus removes the infusion entirely \u2014 an operational advantage in a rotor-wing cabin where an 8-hour pump is rarely relevant. Worth raising with the Medical Director as a protocol harmonization item: pick one number and make {{7.2}} and the trauma sections agree.',
  src:'Prehospital TXA for TBI Trial (JAMA 2020;324:961) and Bayesian reanalysis (J Trauma Acute Care Surg); JTS Anesthesia for Trauma Patients CPG, 2023 update; TAMPITI (Front Immunol 2020;11:2085); NAEMSP/ACEP/ACS-COT joint position statement, J Trauma 2025.'},

'ev-keppra-dose':{
  t:'Levetiracetam 20 mg/kg (max 1,500 mg) is below the established status epilepticus dose',
  pcg:'{{4.12}} directs Keppra 20 mg/kg, maximum 1,500 mg, for seizures refractory to benzodiazepines.',
  lit:'ESETT (2019) established levetiracetam at 60 mg/kg up to a maximum of 4,500 mg over 10 minutes as the second-line dose, and found it equivalent to fosphenytoin and valproate. The American Epilepsy Society guideline recommends this weight-based regimen. For a 70 kg adult the PCG dose delivers 1,400 mg against the trial dose of 4,200 mg \u2014 roughly a third. Note the evidence is not unanimous: retrospective cohorts published since have not consistently shown better seizure control at \u2265 40 mg/kg versus lower doses, and one found higher intubation rates above 40 mg/kg.',
  act:'If a refractory seizure is not breaking on the protocol dose, this gap is worth knowing about before you call OLMD. The Neurocritical Care Society range (1,000\u20133,000 mg) also sits above the PCG cap for most adults.',
  src:'ESETT, N Engl J Med 2019 (NCT01960075); American Epilepsy Society guideline; Neurocritical Care Society guidelines; contrary data in Am J Emerg Med 2024 and a 2026 retrospective cohort.'},

'ev-keppra-peds':{
  t:'Pediatric Keppra maximum of 500 mg caps the dose at a 25 kg child',
  pcg:'{{8.10}} directs Levetiracetam 20 mg/kg IV over 10 minutes, maximum dose 500 mg.',
  lit:'ESETT enrolled children and used 60 mg/kg up to 4,500 mg. At the PCG\u2019s own 20 mg/kg, the 500 mg ceiling binds at 25 kg \u2014 so a 40 kg adolescent receives 12.5 mg/kg, not 20. The adult protocol {{4.12}} uses a 1,500 mg cap for the same drug and the same indication.',
  act:'The mg/kg figure and the ceiling disagree for any child above 25 kg. Flag for Medical Director review \u2014 at minimum the ceiling should scale with the adult cap.',
  src:'ESETT, N Engl J Med 2019; PECARN participation in ESETT pediatric enrollment.'},

'ev-lorazepam-cap':{
  t:'Lorazepam single-dose cap of 2 mg is below the usual adult seizure dose',
  pcg:'{{4.12}} and {{4.17}} both cap adult lorazepam at 2 mg per dose (0.1 mg/kg), repeat twice as needed.',
  lit:'0.1 mg/kg is the standard first-line dose for convulsive status epilepticus, but the commonly cited adult ceiling is 4 mg per dose, which is also what the pediatric protocol {{8.10}} in this same document allows. At 2 mg an 80 kg adult receives 0.025 mg/kg on the first dose \u2014 a quarter of the intended weight-based dose. Under-dosing benzodiazepines is a well-described driver of benzodiazepine-\u201Crefractory\u201D status.',
  act:'Worth noting the internal inconsistency: this document permits 4 mg to a child and 2 mg to an adult. Repeat dosing per protocol gets you there, but more slowly.',
  src:'American Epilepsy Society evidence-based guideline on convulsive status epilepticus; Neurocritical Care Society guidelines.'},

'ev-sepsis-cvp':{
  t:'CVP 12\u201315 as a resuscitation target reflects superseded sepsis guidance',
  pcg:'{{4.7}} directs aggressive crystalloid to maintain urine output &gt; 0.5 mL/kg/hr, lactate &lt; 4.0, and a CVP of 12\u201315.',
  lit:'The CVP 8\u201312 / 12\u201315 target comes from Rivers\u2019 early goal-directed therapy protocol. ProCESS, ARISE and ProMISe each failed to show benefit of protocolized EGDT over usual care, and the Surviving Sepsis Campaign dropped CVP as a resuscitation target in its 2016 revision \u2014 four years before this PCG was issued. CVP has poor performance as a predictor of fluid responsiveness across a wide range of values.',
  act:'The rest of the sepsis protocol \u2014 30 mL/kg crystalloid, MAP 65, norepinephrine first line, lactate-guided, antibiotics within 60 minutes \u2014 is consistent with current Surviving Sepsis guidance. The CVP line is the outlier. Dynamic measures (pulse pressure variation, IVC collapse, passive leg raise) are already referenced in {{4.13}} of this same document.',
  src:'Surviving Sepsis Campaign 2016 and 2021 international guidelines; ProCESS (NEJM 2014), ARISE (NEJM 2014), ProMISe (NEJM 2015).'},

'ev-etom-sepsis':{
  t:'Blanket prohibition on etomidate in sepsis is more contested than the PCG implies',
  pcg:'{{2.3}} states \u201Cdo not use in sepsis or adrenal insufficiency.\u201D {{4.7}} softens this to \u201Cgiven the debate\u2026 Ketamine should be considered as a first line induction agent.\u201D',
  lit:'A single induction dose of etomidate causes measurable adrenal suppression, but meta-analyses and randomized data published since have not demonstrated a consistent mortality difference against ketamine in critically ill patients requiring intubation. Ketamine is not neutral either \u2014 it carries its own hemodynamic considerations in catecholamine-depleted shock, where its indirect sympathomimetic effect can be unmasked as direct myocardial depression.',
  act:'The PCG\u2019s two sections disagree with each other in strength. Practically: ketamine-first in sepsis is defensible and is what {{4.7}} recommends, but the {{2.3}} language reads as an absolute contraindication that the evidence does not support. Either agent, dose-reduced, with a pressor at the bedside, is a reasonable plan.',
  src:'Meta-analyses of etomidate vs ketamine for RSI in critical illness; KETASED trial (Lancet 2009); ongoing debate summarized in critical care airway literature.'},

'ev-peds-atropine':{
  t:'Routine atropine premedication before pediatric RSI is no longer recommended',
  pcg:'{{2.3}} says atropine \u201Cshould be considered for patients &lt; 5 years of age.\u201D {{8.2}} says it is \u201Cindicated for patients &lt; 1 year of age\u201D and to \u201Cconsider in patients &lt; 5 years.\u201D',
  lit:'AHA/PALS and pediatric emergency airway guidance moved away from routine atropine premedication. The evidence that it prevents clinically important intubation-associated bradycardia is weak, and it can mask the hypoxia-driven bradycardia that is itself the signal to stop and oxygenate. It remains reasonable for a second dose of succinylcholine, for known vagotonic situations, and as a drying agent \u2014 all of which the PCG also lists.',
  act:'The PCG\u2019s own stated rationale (drying agent; second succinylcholine dose; blocking laryngeal-stimulation bradycardia) still holds. What has changed is \u201Croutine for every child under 5.\u201D Note the minimum-dose figure: this document uses 0.1 mg, which is also currently debated as potentially unnecessary.',
  src:'AHA PALS guidelines; pediatric emergency airway management literature on premedication.'},

'ev-peds-tbsa':{
  t:'The pediatric Rule of Nines row sums to 101%',
  pcg:'{{5.2}} gives the child row as Head 18, Chest 9, Abdomen 9, Back 18, Genitals 1, arms 9 + 9, legs 14 + 14.',
  lit:'That totals 101. The standard pediatric modification uses 13.5% per leg (or omits the 1% genital segment), giving 100%. The adult row in the same table sums correctly to 100.',
  act:'A 1% error will not change a transport decision on its own, but TBSA drives the fluid formula, and the formula in the same protocol is also mis-stated (see the burn formula flag). Use a Lund-Browder chart or a length-based tool for children where accuracy matters. Remember the palm-equals-1% rule the PCG gives for scattered burns.',
  src:'American Burn Association Advanced Burn Life Support; Lund-Browder chart.'},

'ev-burn-formula':{
  t:'The burn fluid formula is printed in a form that reads as a duplicated multiplier',
  pcg:'{{5.2}} prints: \u201CLactated Ringer\u2026 administered at 2 ml/kg x KG x %BSA.\u201D',
  lit:'As literally written, that expression multiplies by weight twice. The intended formula is almost certainly <strong>2 mL \u00D7 kg \u00D7 %TBSA</strong> for the first 24 hours \u2014 the American Burn Association consensus (modified Brooke / ABLS) figure, which replaced the older Parkland 4 mL \u00D7 kg \u00D7 %TBSA to reduce over-resuscitation and fluid creep. The PCG\u2019s own follow-on instruction (half in the first 8 hours, half over the next 16) matches the consensus formula.',
  act:'Read it as 2 mL \u00D7 kg \u00D7 %TBSA. The calculator in this app uses that interpretation. Confirm the intended wording with the Medical Director \u2014 it is a one-character fix with a large clinical consequence. Also note the PCG\u2019s own warning to \u201Cavoid over-hydration,\u201D and that pediatric maintenance with dextrose is additive to the consensus volume.',
  src:'American Burn Association / ABLS consensus formula; Advanced Burn Life Support Provider Manual.'},

'ev-ich-bp':{
  t:'SBP &lt; 160 for intraparenchymal hemorrhage is more permissive than current guidance',
  pcg:'{{4.4}} targets SBP &lt; 160 mmHg for intraparenchymal hemorrhagic CVA, &lt; 180 for ischemic CVA, &lt; 140 for non-traumatic SAH.',
  lit:'The 2022 AHA/ASA spontaneous ICH guideline supports initiating treatment promptly with a target in the 130\u2013150 mmHg range for patients presenting with mild-to-moderate ICH and SBP 150\u2013220, emphasizing smooth and sustained control rather than a single ceiling. INTERACT3 (2023) found a care bundle including early intensive BP lowering improved functional outcome. ATACH-2 cautioned that very rapid large drops may carry renal adverse effects.',
  act:'The direction of travel since 2020 is toward lower and smoother, not just \u201Cunder 160.\u201D Nicardipine infusion \u2014 already the PCG\u2019s agent \u2014 is well suited to smooth control. The ischemic and SAH targets in this protocol remain consistent with current guidance.',
  src:'AHA/ASA 2022 Guideline for the Management of Patients with Spontaneous Intracerebral Hemorrhage; INTERACT3 (Lancet 2023); ATACH-2 (NEJM 2016).'},

'ev-anaphylaxis-antihistamine':{
  t:'Antihistamines and steroids do not treat anaphylaxis \u2014 order matters',
  pcg:'{{4.1}} lists diphenhydramine, methylprednisolone, albuterol and famotidine under \u201CMild reaction,\u201D and epinephrine under \u201CModerate to severe.\u201D',
  lit:'The structure is defensible, but the 2023 anaphylaxis practice parameter update is emphatic that H1 antihistamines and corticosteroids relieve cutaneous symptoms only, do not prevent or treat airway or cardiovascular compromise, and must never delay epinephrine. Corticosteroids have not been shown to prevent biphasic reactions.',
  act:'The risk is a mild-looking reaction being worked down the H1/steroid list while it progresses. Any airway, respiratory, or circulatory involvement is moderate-to-severe by definition \u2014 epinephrine IM to the anterior thigh first, everything else after. The PCG\u2019s own pearl says early rather than late airway intervention.',
  src:'Anaphylaxis \u2014 a 2023 practice parameter update (AAAAI/ACAAI Joint Task Force); World Allergy Organization anaphylaxis guidance.'},

'ev-amio-lido':{
  t:'Amiodarone and lidocaine are in equipoise for shock-refractory VF/pVT',
  pcg:'{{3.6}} lists Amiodarone 300 mg first, with Lidocaine 1.5 mg/kg as the alternative. {{8.6}} does the same for children.',
  lit:'ALPS (NEJM 2016) found neither amiodarone nor lidocaine improved survival to discharge versus placebo, though both improved survival to hospital admission, with a signal favoring both in witnessed arrest. AHA guidance treats them as reasonable alternatives rather than ranking one above the other.',
  act:'No change to practice implied \u2014 the PCG\u2019s \u201C-OR-\u201D structure already reflects equipoise. Worth knowing so the choice can be made on availability, line access, and post-ROSC infusion plan rather than on a presumed hierarchy.',
  src:'ALPS trial (NEJM 2016;374:1711); AHA Guidelines for CPR and ECC, adult advanced cardiovascular life support.'},

'ev-benzo-sedation':{
  t:'Benzodiazepine infusions are second-line for sustained ICU sedation',
  pcg:'{{2.4}} offers midazolam and lorazepam infusions alongside propofol and ketamine for post-intubation sedation, and permits continuation of propofol only if the referring facility started it.',
  lit:'PADIS guidelines recommend non-benzodiazepine sedation (propofol or dexmedetomidine) over benzodiazepine infusions in mechanically ventilated adults, based on shorter time to extubation and less delirium. The effect grows with duration of exposure.',
  act:'For a 20\u201360 minute rotor-wing transport this is a small effect, and the PCG\u2019s emphasis on empiric scheduled dosing to prevent awareness under paralysis is the more important clinical point. It matters more for long-range fixed-wing or when the transport agent becomes the receiving unit\u2019s starting regimen \u2014 worth including in handoff.',
  src:'PADIS Clinical Practice Guidelines for Pain, Agitation/Sedation, Delirium, Immobility and Sleep Disruption (Crit Care Med 2018).'},

'ev-morphine-cap':{
  t:'Morphine caps of 4 mg single / 8 mg total are restrictive for an intubated adult',
  pcg:'{{2.4}} allows morphine 0.05\u20130.1 mg/kg IV PRN but caps the single dose at 4 mg and the total at 8 mg. {{4.16}} caps the non-intubated single dose at 4 mg.',
  lit:'0.1 mg/kg in an 80 kg patient is 8 mg \u2014 twice the permitted single dose, so the weight-based figure and the ceiling conflict above 40 kg. An 8 mg total ceiling is low for a patient who is intubated, paralyzed, and being moved. The PCG\u2019s own pearl warns that patients can awaken while paralyzed and that dosing should be empiric and scheduled.',
  act:'Fentanyl is the more practical agent here and the PCG allows up to 150 mcg plus an infusion. If morphine is the only agent available, the cumulative cap is likely to be reached quickly \u2014 anticipate needing OLMD contact.',
  src:'Internal inconsistency within the source document; PADIS analgesia recommendations.'},

'ev-naloxone-dose':{
  t:'Starting naloxone at 0.4 mg risks precipitated withdrawal in the opioid-tolerant',
  pcg:'{{6.5}} directs naloxone in 0.4 mg increments up to 2 mg IV for suspected narcotic overdose. {{6.4}} allows 0.4\u20132.0 mg IV/IM in hypothermia with decreased LOC.',
  lit:'Current practice for a breathing patient with suspected opioid toxicity favors starting at 0.04\u20130.1 mg IV and titrating to adequate respiratory effort rather than to full arousal, reserving larger initial doses for apnea or arrest. Precipitated withdrawal in a tolerant patient can produce vomiting, agitation and catecholamine surge \u2014 all of which are considerably worse inside an aircraft than in an ED.',
  act:'Target respiratory rate and tidal volume, not GCS. In a restrained patient at altitude, a combative emergence is a flight-safety event. Bag the patient and titrate.',
  src:'Toxicology and emergency medicine guidance on naloxone titration; ACMT position statements on opioid antagonist dosing.'},

'ev-croup-racemic':{
  t:'The two croup protocols give different racemic epinephrine regimens',
  pcg:'{{2.5}} gives a fixed dose by age: &lt; 6 months 0.25 mL (5.625 mg), &gt; 6 months 0.5 mL (11.25 mg), max single dose 0.5 mL, not more often than every 1\u20132 hours. {{8.9}} gives a weight-based dose: 2.25% solution at 0.05 mL/kg, max single dose 0.5 mL, diluted in 3 mL NS, may repeat once in 20 minutes.',
  lit:'The weight-based 0.05 mL/kg of 2.25% racemic epinephrine to a 0.5 mL ceiling is the more commonly cited pediatric regimen. The two sections also disagree on repeat interval \u2014 20 minutes versus 1\u20132 hours \u2014 which is a meaningful difference in a child with severe stridor.',
  act:'For a 10 kg child the two protocols happen to converge (0.5 mL). Below 10 kg they diverge: the fixed-dose table would give a 7 kg infant 0.5 mL where the weight-based rule gives 0.35 mL. Use the pediatric protocol {{8.9}} for children and raise the discrepancy for reconciliation.',
  src:'Internal inconsistency within the source document; standard pediatric croup dosing references.'},

'ev-procainamide-peds':{
  t:'Pediatric procainamide dose and maximum are mutually impossible above ~7 kg',
  pcg:'{{8.14}} directs Procainamide 15 mg/kg IV over 30\u201360 minutes, \u201Cmaximum single dose 100 mg.\u201D',
  lit:'15 mg/kg reaches the stated 100 mg ceiling at 6.7 kg. A 20 kg child would be prescribed 300 mg by the weight rule and capped at 100 mg by the ceiling \u2014 a third of the intended dose. The PALS figure for procainamide in refractory SVT/VT is 15 mg/kg infused over 30\u201360 minutes; the \u201C100 mg\u201D is most likely a transcription artifact, possibly from a maximum rate or an incremental-dose instruction.',
  act:'Do not reconcile this at the bedside. Procainamide here is already a second-line agent after cardioversion has failed \u2014 contact OLMD for the dose. Flag for correction.',
  src:'Internal inconsistency within the source document; AHA PALS tachycardia algorithms.'},

'ev-roc-dose':{
  t:'Rocuronium at the low end of 0.6 mg/kg gives a shorter, shallower block than RSI needs',
  pcg:'{{2.3}} gives Rocuronium 0.6\u20131.2 mg/kg IV, max 150 mg, with onset stated as 60\u2013120 seconds.',
  lit:'The range is correct, but the two ends behave differently: 0.6 mg/kg produces intubating conditions in roughly 90\u2013120 seconds, while 1.2 mg/kg approaches succinylcholine-like onset near 45\u201360 seconds with a considerably longer duration. For rapid sequence intubation the higher end of the PCG\u2019s own range is what produces the conditions the technique assumes.',
  act:'No protocol deviation needed \u2014 1.2 mg/kg is within the stated range. Note the duration trade: at 1.2 mg/kg, block may exceed an hour, which raises the stakes on the PCG\u2019s own warning about awareness under paralysis. Sedation must be scheduled, not PRN.',
  src:'Standard anesthesia and emergency airway pharmacology references on rocuronium dose-response.'}
