<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AIRLIFE PCG — Flight Reference</title>
<meta name="description" content="HCA Houston Healthcare AIRLIFE Patient Care Guidelines — case-driven protocol, dosing, calculator and procedure reference. Runs fully offline.">
<meta name="theme-color" content="#FFFFFF">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="AIRLIFE PCG">
<meta name="format-detection" content="telephone=no">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   LIGHT is the default. Dark is one tap away for night flights.
   Every colour is a variable so the two themes stay in step.
   ============================================================ */
:root{
  --bg:#EEF3F6; --bg2:#FFFFFF; --panel:#FFFFFF; --panel2:#F3F7F9; --panel3:#E7EEF2;
  --line:#DBE5EB; --line2:#C2D2DB; --line3:#98AFBC;
  --ink:#13232C; --ink2:#3A5462; --dim:#6B8492;
  --dose:#07836A; --doseBg:#07836A14; --doseGlow:#07836A2e;
  --warn:#A96400; --warnBg:#A9640014; --warnLine:#E0B778;
  --crit:#C0362B; --critBg:#C0362B12; --critLine:#E9A69E;
  --ok:#0F7A4E;  --okBg:#0F7A4E12;  --okLine:#96CBAE;
  --shadow:0 1px 2px #13232c0f, 0 8px 22px -14px #13232c26;
  --shadowUp:0 2px 6px #13232c12, 0 18px 34px -20px #13232c33;
  --chip:#FFFFFF;
  --rad:11px; --rad2:7px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;

  --c-gen:#546B7A;   --c-air:#0080AD;  --c-card:#C32C63;  --c-med:#9A6A00;
  --c-trauma:#C14420; --c-env:#4E8417; --c-proc:#00815B;  --c-ped:#2A55C4;
  --c-ob:#7C33C4;    --c-neo:#A76500;  --c-adult:#06827A; --c-press:#BC4A1C;
  --c-sed:#5C41C4;
}
:root[data-theme="dark"]{
  --bg:#080F13; --bg2:#0C1519; --panel:#111E25; --panel2:#172A33; --panel3:#1E3A46;
  --line:#1E3540; --line2:#2A4655; --line3:#3B6274;
  --ink:#ECF4F6; --ink2:#B2C7D0; --dim:#75909C;
  --dose:#4EE6BE; --doseBg:#4EE6BE16; --doseGlow:#4EE6BE44;
  --warn:#FFBE4D; --warnBg:#FFBE4D14; --warnLine:#63501F;
  --crit:#FF6F5E; --critBg:#FF6F5E14; --critLine:#6B2E2A;
  --ok:#5ED696;  --okBg:#5ED69612;  --okLine:#2C5C40;
  --shadow:0 1px 2px #0006, 0 10px 24px -16px #000;
  --shadowUp:0 2px 8px #0007, 0 20px 38px -22px #000;
  --chip:#101E25;
  color-scheme:dark;

  --c-gen:#9FB6C0;   --c-air:#46D3F5;  --c-card:#FF6E9C;  --c-med:#F0C95E;
  --c-trauma:#FF7F63; --c-env:#A9DA6A; --c-proc:#3FE5A4;  --c-ped:#7FAEFF;
  --c-ob:#C583FF;    --c-neo:#FFC46B;  --c-adult:#3FD9CC; --c-press:#FF8A6B;
  --c-sed:#B39DFF;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 150px);height:100%}
body{
  margin:0;height:100%;color:var(--ink);background:var(--bg);
  font-family:Barlow,"Segoe UI",system-ui,-apple-system,sans-serif;
  font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%;font-variant-numeric:tabular-nums;
}
:root[data-theme="dark"] body{
  background:radial-gradient(1100px 540px at 12% -8%,#12313B 0%,transparent 62%),
             radial-gradient(900px 480px at 92% 2%,#1B2440 0%,transparent 58%),var(--bg);
  background-attachment:fixed;
}
h1,h2,h3,h4{font-family:"Barlow Condensed",Barlow,sans-serif;margin:0;line-height:1.14;letter-spacing:.01em}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
a{color:var(--dose);text-decoration:none}
::selection{background:var(--doseGlow)}
:focus-visible{outline:2px solid var(--dose);outline-offset:2px}

/* colour keys */
.k-1,.k-gen{--k:var(--c-gen)} .k-2,.k-air,.k-airway,.k-resp{--k:var(--c-air)}
.k-3,.k-card{--k:var(--c-card)} .k-4,.k-med,.k-metab{--k:var(--c-med)}
.k-5,.k-trauma,.k-hemo{--k:var(--c-trauma)} .k-6,.k-env{--k:var(--c-env)}
.k-7,.k-proc,.k-vascular,.k-thorax{--k:var(--c-proc)} .k-8,.k-ped,.k-neuro{--k:var(--c-ped)}
.k-9,.k-O,.k-ob{--k:var(--c-ob)} .k-neo{--k:var(--c-neo)} .k-adult{--k:var(--c-adult)}
.k-press{--k:var(--c-press)} .k-sed{--k:var(--c-sed)} .k-misc{--k:var(--c-gen)}
.k-warn{--k:var(--warn)} .k-dose{--k:var(--dose)}
[class*="k-"]{--k:var(--c-gen)}
[class*="k-"]{--kf:color-mix(in srgb, var(--k) 14%, transparent);
              --kg:color-mix(in srgb, var(--k) 6%, transparent);
              --kb:color-mix(in srgb, var(--k) 34%, transparent)}

.wrap{max-width:900px;margin:0 auto;padding:0 13px 130px}

/* ================= sticky head ================= */
#top{
  position:sticky;top:0;z-index:60;background:var(--bg2);
  border-bottom:1px solid var(--line2);padding-top:env(safe-area-inset-top,0px);
  box-shadow:var(--shadow);
}
:root[data-theme="dark"] #top{background:linear-gradient(180deg,#0E1F27,#0B171D 70%,#0A151A)}
.ptin{max-width:900px;margin:0 auto;padding:8px 13px}
.ptrow{display:flex;gap:6px;align-items:stretch}
#pt.mini .ptrow,#pt.mini .dxrow,#pt.mini .qchips{display:none}
.fld{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--panel2);border:1.5px solid var(--line);border-radius:var(--rad2);transition:.16s}
.fld.on{border-color:var(--dose);background:var(--doseBg)}
.fld label{font:700 9.5px/1 Barlow;letter-spacing:.12em;color:var(--dim);padding:6px 8px 0;text-transform:uppercase}
.fldb{display:flex;align-items:center}
.fld input{width:100%;min-width:0;background:none;border:none;padding:0 8px 7px;font:700 24px/1.15 "Barlow Condensed",Barlow;color:var(--ink)}
.fld.on input{color:var(--dose)}
.fld input::placeholder{color:var(--line3);font-weight:600}
.fld input::-webkit-outer-spin-button,.fld input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.fld input[type=number]{-moz-appearance:textfield}
.unit{display:flex;flex-direction:column;justify-content:flex-end;padding:0 5px 6px 0;gap:2px}
.unit button{font:700 10px/1 Barlow;color:var(--dim);padding:4px 6px;border-radius:4px;border:1px solid transparent;min-width:28px}
.unit button[aria-pressed=true]{background:var(--dose);color:var(--bg2);border-color:var(--dose)}

.dxrow{margin-top:6px;position:relative}
.dxrow input{width:100%;background:var(--panel2);border:1.5px solid var(--line);border-radius:var(--rad2);padding:12px 12px;font:600 15.5px/1.2 Barlow;color:var(--ink)}
.dxrow input::placeholder{color:var(--dim);font-weight:500}
.dxrow input:focus{border-color:var(--dose);background:var(--panel);box-shadow:0 0 0 3px var(--doseBg)}
.qchips{display:flex;gap:5px;overflow-x:auto;margin-top:6px;padding-bottom:2px;scrollbar-width:none}
.qchips::-webkit-scrollbar{display:none}
.qc{white-space:nowrap;border:1.5px solid var(--line2);border-radius:20px;padding:8px 13px;font:600 13px/1 Barlow;color:var(--ink2);background:var(--chip);min-height:36px}
.qc[aria-pressed=true]{background:var(--k);border-color:var(--k);color:#fff;font-weight:700}
:root[data-theme="dark"] .qc[aria-pressed=true]{color:#08141A}

.ptmeta{display:flex;gap:5px;flex-wrap:wrap;align-items:center;margin-top:7px;min-height:24px}
#pt.mini .ptmeta{margin-top:0}
.tag{font:600 12px/1 Barlow;padding:6px 9px;border-radius:5px;border:1.5px solid var(--line2);color:var(--ink2);background:var(--panel2)}
.tag b{font-weight:700;color:var(--dose)}
.tag.ped{border-color:var(--c-ped);color:var(--c-ped);background:color-mix(in srgb,var(--c-ped) 10%,transparent)}
.tag.ped b{color:var(--c-ped)}
.tag.adult{border-color:var(--c-adult);color:var(--c-adult);background:color-mix(in srgb,var(--c-adult) 10%,transparent)}
.tag.adult b{color:var(--c-adult)}
.ptclear,.pttog,.themebtn{font:700 11px/1 Barlow;letter-spacing:.06em;color:var(--dim);padding:7px 9px;border:1.5px solid var(--line2);border-radius:5px;min-height:32px}
.pttog{margin-left:auto}
.themebtn{font-size:14px;letter-spacing:0;padding:6px 10px}
.hint{font:500 12.5px/1.35 Barlow;color:var(--dim)}

#nav{background:none;border-top:1px solid var(--line);display:flex;overflow-x:auto;scrollbar-width:none}
#nav::-webkit-scrollbar{display:none}
#nav .nvin{display:flex;gap:2px;max-width:900px;margin:0 auto;width:100%;padding:0 7px}
#nav a{flex:0 0 auto;min-width:68px;white-space:nowrap;text-align:center;padding:9px 11px 7px;font:600 12.5px/1 Barlow;color:var(--dim);border-bottom:3px solid transparent;transition:.16s}
#nav a b{display:block;font:700 17px/1 Barlow;margin-bottom:2px;opacity:.6}
#nav a[aria-current=page]{color:var(--k);border-bottom-color:var(--k)}
#nav a[aria-current=page] b{opacity:1}
#nav a.n-find{--k:var(--dose)} #nav a.n-skills{--k:var(--c-proc)} #nav a.n-doses{--k:var(--c-sed)}
#nav a.n-calc{--k:var(--dose)} #nav a.n-rx{--k:var(--c-med)} #nav a.n-mcs{--k:var(--c-card)}
#nav a.n-ai{--k:var(--c-sed)} #nav a.n-flags{--k:var(--warn)}

/* ================= search ================= */
.srchwrap{position:relative;margin:14px 0 0}
#srch,#rxq,#dq{width:100%;background:var(--panel);border:1.5px solid var(--line2);border-radius:var(--rad);padding:14px 42px 14px 14px;font:600 17px/1.2 Barlow;color:var(--ink);box-shadow:var(--shadow)}
#srch::placeholder,#rxq::placeholder,#dq::placeholder{color:var(--dim);font-weight:500}
#srch:focus,#rxq:focus,#dq:focus{border-color:var(--dose);box-shadow:0 0 0 3px var(--doseBg)}
.xbtn{position:absolute;right:4px;top:4px;bottom:4px;width:38px;color:var(--dim);font-size:21px}

/* ================= chips / grids ================= */
.cgrp{margin-top:20px}
.cglab{font:700 11px/1 Barlow;letter-spacing:.14em;color:var(--dim);text-transform:uppercase;margin-bottom:9px;display:flex;align-items:center;gap:9px}
.cglab::after{content:"";flex:1;height:1px;background:var(--line2)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--line2);border-radius:20px;padding:9px 14px;font:600 13.5px/1.15 Barlow;color:var(--ink2);background:var(--chip);min-height:38px;transition:.16s;box-shadow:var(--shadow)}
.chip:hover{border-color:var(--k);color:var(--k)}
.chip[aria-pressed=true]{background:var(--k);border-color:var(--k);color:#fff;font-weight:700}
:root[data-theme="dark"] .chip[aria-pressed=true]{color:#08141A}

.secgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:7px;margin-top:9px}
.secbtn{display:flex;align-items:center;gap:9px;text-align:left;color:var(--ink);border:1.5px solid var(--line);border-left:4px solid var(--k);background:var(--panel);padding:14px 12px;border-radius:0 var(--rad) var(--rad) 0;min-height:54px;box-shadow:var(--shadow);transition:.16s}
.secbtn:hover{background:var(--kg);border-color:var(--kb);border-left-color:var(--k)}
.secbtn i{font:700 17px/1 "Barlow Condensed";color:var(--k);font-style:normal;min-width:19px}
.secbtn span{font:600 14.5px/1.2 Barlow;flex:1}
.secbtn em{font:700 11px/1 Barlow;color:var(--k);font-style:normal;background:var(--kf);padding:4px 7px;border-radius:20px}

.res{margin-top:6px}
.rhdr{display:flex;align-items:baseline;gap:9px;margin:22px 0 9px}
.rhdr h2{font-size:20px;font-weight:700}
.rhdr em{font:600 12px/1 Barlow;color:var(--dim);font-style:normal}
.item{display:block;width:100%;text-align:left;color:var(--ink);border:1.5px solid var(--line);border-left:4px solid var(--k);background:var(--panel);padding:13px 13px;margin-bottom:7px;border-radius:0 var(--rad) var(--rad) 0;box-shadow:var(--shadow);transition:.16s}
.item:hover{background:var(--kg);border-color:var(--kb);border-left-color:var(--k)}
.itop{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.inum{font:700 12px/1 Barlow;color:#fff;background:var(--k);padding:5px 7px;border-radius:5px;letter-spacing:.02em}
:root[data-theme="dark"] .inum{color:#08141A}
.ittl{font:600 16.5px/1.25 Barlow;flex:1;min-width:0}
.iflag{font:700 10px/1 Barlow;letter-spacing:.06em;color:var(--warn);border:1.5px solid var(--warnLine);background:var(--warnBg);border-radius:20px;padding:5px 8px;white-space:nowrap}
.iflag.rev{color:var(--ok);border-color:var(--okLine);background:var(--okBg)}
.iflag.v2{color:var(--dim);border-color:var(--line2);background:none}
.iflag.rx{color:var(--dose);border-color:var(--dose);background:var(--doseBg)}
.isub{font:500 13px/1.4 Barlow;color:var(--dim);margin-top:6px}
.empty{border:2px dashed var(--line2);border-radius:var(--rad);padding:28px 18px;text-align:center;color:var(--dim);margin-top:16px}
.empty b{display:block;color:var(--ink2);font:600 17px/1.3 Barlow;margin-bottom:6px}

/* ================= case dashboard ================= */
.caseband{margin-top:14px;border:1.5px solid var(--kb);border-radius:var(--rad);background:var(--kf);padding:14px 15px;box-shadow:var(--shadow)}
.caseband .cbt{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.caseband h2{font-size:21px;font-weight:700;color:var(--k)}
.caseband .pill{font:700 10px/1 Barlow;letter-spacing:.12em;text-transform:uppercase;color:#fff;background:var(--k);padding:6px 10px;border-radius:20px}
:root[data-theme="dark"] .caseband .pill{color:#08141A}
.caseband p{margin:7px 0 0;font:500 13px/1.45 Barlow;color:var(--ink2)}
.caseband p b{color:var(--ink);font-weight:700}

.primary{margin-top:10px;border:2px solid var(--k);border-radius:var(--rad);overflow:hidden;background:var(--panel);box-shadow:var(--shadowUp)}
.primary .ph1{display:flex;align-items:flex-start;gap:11px;padding:15px 16px 12px;background:var(--kf)}
.primary .pn{font:700 12px/1 Barlow;color:#fff;background:var(--k);padding:6px 8px;border-radius:5px;margin-top:3px}
:root[data-theme="dark"] .primary .pn{color:#08141A}
.primary h2{font-size:25px;font-weight:700;flex:1}
.primary .sub{display:block;font:500 12.5px/1.35 Barlow;color:var(--dim);margin-top:5px}
.primary .pacts{display:flex;border-top:1.5px solid var(--line)}
.primary .pacts a{flex:1;text-align:center;padding:15px 8px;font:700 14px/1 Barlow;color:var(--ink2);border-right:1.5px solid var(--line)}
.primary .pacts a:last-child{border-right:none}
.primary .pacts a.go{color:#fff;background:var(--k)}
:root[data-theme="dark"] .primary .pacts a.go{color:#08141A}
.mini-rx{padding:4px 16px 12px}
.mini-rx .mr{display:flex;align-items:baseline;gap:10px;padding:11px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.mini-rx .mrn{font:700 15px/1.2 Barlow;flex:1 1 130px}
.mini-rx .mrv{font:700 23px/1 "Barlow Condensed";color:var(--dose)}
.mini-rx .mru{font:600 12px/1 Barlow;color:var(--dose)}
.mini-rx .mrd{font:500 12.5px/1 Barlow;color:var(--dim)}
.mini-rx .mrw{font:700 12px/1 Barlow;color:var(--warn)}

.vitgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:7px;margin-top:9px}
.vit{border:1.5px solid var(--line);border-top:4px solid var(--k);border-radius:var(--rad2);padding:11px 12px;background:var(--panel);box-shadow:var(--shadow)}
.vit .vl{font:700 9.5px/1 Barlow;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);display:block}
.vit .vv{font:700 24px/1.05 "Barlow Condensed";color:var(--k);display:block;margin-top:6px}
.vit .vn{font:500 11px/1.3 Barlow;color:var(--dim);display:block;margin-top:4px}
.skscope{display:flex;align-items:center;gap:7px;margin-top:8px;font:600 12px/1.35 Barlow;padding:9px 11px;border-radius:var(--rad2)}
.skscope.ok{color:var(--ok);background:var(--okBg);border:1.5px solid var(--okLine)}
.skscope.no{color:var(--crit);background:var(--critBg);border:1.5px solid var(--critLine)}

/* ================= headers ================= */
.back{display:inline-flex;align-items:center;gap:7px;margin:13px 0 0;font:600 14px/1 Barlow;color:var(--ink2);border:1.5px solid var(--line2);padding:11px 14px;border-radius:var(--rad2);background:var(--panel);min-height:42px;box-shadow:var(--shadow)}
.phead{margin:15px 0 4px;display:flex;align-items:flex-start;gap:10px}
.phead .pn{font:700 13px/1 Barlow;color:#fff;background:var(--k);padding:7px 9px;border-radius:6px;margin-top:5px;white-space:nowrap}
:root[data-theme="dark"] .phead .pn{color:#08141A}
.phead h1{font-size:29px;font-weight:700;flex:1}
.phead h1 small{display:block;font:500 13.5px/1.4 Barlow;color:var(--dim);margin-top:6px}
.pmeta{font:500 12.5px/1.45 Barlow;color:var(--dim);margin:8px 0 0}
.kbar{height:4px;background:var(--k);margin:12px 0 0;border-radius:4px}

/* ---- collapsible protocol sections ---- */
.sjump{display:flex;gap:6px;overflow-x:auto;margin-top:14px;padding-bottom:3px;scrollbar-width:none}
.sjump::-webkit-scrollbar{display:none}
.sjump a,.sjump button{white-space:nowrap;border:1.5px solid var(--line2);background:var(--panel);color:var(--ink2);border-radius:20px;padding:8px 13px;font:600 12.5px/1 Barlow;min-height:36px}
.sjump .tog{border-color:var(--k);color:var(--k);background:var(--kf);font-weight:700}
.sect{border:1.5px solid var(--line);border-left:4px solid var(--k);border-radius:0 var(--rad) var(--rad) 0;background:var(--panel);margin:9px 0;overflow:hidden;box-shadow:var(--shadow)}
.sech{display:flex;align-items:center;gap:10px;padding:15px 14px;width:100%;text-align:left;min-height:56px}
.sech .chev{font-style:normal;color:var(--k);font-size:13px;transition:transform .18s;flex:0 0 auto}
.sect[open] .sech{border-bottom:1.5px solid var(--line);background:var(--kg)}
.sect[open] .sech .chev{transform:rotate(90deg)}
.sech .st{font:700 16px/1.25 Barlow;flex:1;color:var(--ink);text-transform:none;letter-spacing:0}
.sech .sb{display:flex;gap:5px;flex:0 0 auto}
.sbdg{font:700 10px/1 Barlow;letter-spacing:.05em;padding:5px 8px;border-radius:20px;border:1.5px solid var(--dose);color:var(--dose);background:var(--doseBg);white-space:nowrap}
.sbdg.warn{border-color:var(--critLine);color:var(--crit);background:var(--critBg)}
.secb{padding:4px 14px 14px}

/* ================= blocks ================= */
.blk{margin-top:20px}
.blk h3{font-size:16px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--k);padding-bottom:7px;border-bottom:2px solid var(--kb);margin-bottom:11px}
.blk h4{font-size:15.5px;font-weight:700;color:var(--ink);margin:15px 0 6px}
.secb h4{font-size:15px;font-weight:700;color:var(--k);margin:14px 0 5px}
ul.bl{list-style:none;margin:0;padding:0}
ul.bl li{position:relative;padding:5px 0 5px 17px;color:var(--ink2);font-size:15px;line-height:1.5}
ul.bl li::before{content:"";position:absolute;left:2px;top:13px;width:7px;height:2px;border-radius:2px;background:var(--k)}
ul.bl li strong,ul.bl li b{color:var(--ink);font-weight:700}
ul.bl ul.bl{margin:3px 0 3px 2px}
ul.bl ul.bl li::before{width:4px;height:4px;border-radius:50%;opacity:.6}
.note{border:1.5px solid var(--kb);border-left:4px solid var(--k);background:var(--kg);padding:11px 13px;margin:12px 0;font-size:14.5px;color:var(--ink2);border-radius:0 var(--rad2) var(--rad2) 0}
.note b,.note strong{color:var(--ink)}
.crit{border:1.5px solid var(--critLine);border-left:4px solid var(--crit);background:var(--critBg);padding:12px 14px;margin:12px 0;border-radius:0 var(--rad2) var(--rad2) 0;font-size:14.8px;color:var(--ink2)}
.crit b{color:var(--crit);font-weight:700}

/* ================= dose row ================= */
.rx{border:1.5px solid var(--line);border-left:4px solid var(--line2);background:var(--panel);padding:12px 13px;margin:8px 0;border-radius:0 var(--rad) var(--rad) 0;box-shadow:var(--shadow)}
.rx.hasval{border-left-color:var(--dose);background:var(--doseBg)}
.rxtop{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.rxname{font:700 17.5px/1.2 Barlow;color:var(--ink)}
.rxdose{font:600 14.5px/1.3 Barlow;color:var(--ink2)}
.rxroute{font:700 11px/1 Barlow;letter-spacing:.07em;color:#fff;background:var(--c-gen);padding:5px 8px;border-radius:20px;white-space:nowrap}
:root[data-theme="dark"] .rxroute{color:#08141A}
.calc{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-top:10px;border-top:2px solid var(--line);padding-top:10px}
.calcv{font:700 30px/1 "Barlow Condensed",Barlow;color:var(--dose)}
.calcu{font:700 15px/1 Barlow;color:var(--dose)}
.calcn{font:500 12.5px/1.45 Barlow;color:var(--dim);flex:1 1 220px}
.calcn.cap{color:var(--warn);font-weight:600}
.calcn b{color:var(--ink2)}
.needw{margin-top:9px;font:500 13px/1.4 Barlow;color:var(--dim);border-top:2px solid var(--line);padding-top:9px}
.needw button{color:var(--dose);font-weight:700;text-decoration:underline;text-underline-offset:3px;min-height:34px}
.needw input{background:var(--panel2);border:1.5px solid var(--line2);border-radius:5px;color:var(--ink);font:700 16px/1 Barlow;padding:8px 9px;width:80px;margin:0 5px}
.rxnote{font:500 13.4px/1.5 Barlow;color:var(--dim);margin-top:8px}
.rxalt{font:700 11px/1 Barlow;color:var(--dim);margin:11px 0 5px;letter-spacing:.14em;text-transform:uppercase;text-align:center}

/* ================= advisories / alarms ================= */
.ev{border:1.5px solid var(--warnLine);border-left:4px solid var(--warn);background:var(--warnBg);border-radius:0 var(--rad2) var(--rad2) 0;margin:10px 0;overflow:hidden}
.ev.done{border-color:var(--okLine);border-left-color:var(--ok);background:var(--okBg)}
.evh{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:13px 14px;min-height:50px}
.evh span{font:700 13.5px/1.35 Barlow;color:var(--warn);flex:1}
.ev.done .evh span{color:var(--ok)}
.evh i{font-style:normal;color:var(--warn);font-size:12px;transition:transform .16s}
.ev.done .evh i{color:var(--ok)}
.ev[open] .evh i{transform:rotate(90deg)}
.evb{padding:0 14px 14px;font-size:14.4px;color:var(--ink2);line-height:1.55}
.evb p{margin:0 0 10px}
.evb .lbl{font:700 10.5px/1 Barlow;letter-spacing:.11em;color:var(--dim);text-transform:uppercase;display:block;margin-bottom:4px}
.evb .src{font:500 12.4px/1.45 Barlow;color:var(--dim);border-top:1px solid var(--line2);padding-top:9px;margin-top:10px}
details summary{list-style:none;cursor:pointer}
details summary::-webkit-details-marker{display:none}

.alarm{border:1.5px solid var(--line2);border-left:4px solid var(--line3);background:var(--panel);border-radius:0 var(--rad2) var(--rad2) 0;margin:8px 0;overflow:hidden;box-shadow:var(--shadow)}
.alarm.red{border-color:var(--critLine);border-left-color:var(--crit);background:var(--critBg)}
.alarm.yellow{border-color:var(--warnLine);border-left-color:var(--warn);background:var(--warnBg)}
.alh{display:flex;align-items:center;gap:9px;padding:13px 14px;width:100%;text-align:left;min-height:52px}
.alh i{font-style:normal;font-size:12px;color:var(--dim);transition:transform .16s}
.alarm[open] .alh i{transform:rotate(90deg)}
.alh .sev{font:700 9.5px/1 Barlow;letter-spacing:.1em;padding:5px 7px;border-radius:20px;color:#fff}
.alarm.red .sev{background:var(--crit)}
.alarm.yellow .sev{background:var(--warn)}
:root[data-theme="dark"] .alh .sev{color:#08141A}
.alh .alt{font:700 15px/1.3 Barlow;flex:1;color:var(--ink)}
.alb{padding:0 14px 14px}
.alb .why{margin:0 0 10px;font:500 14px/1.55 Barlow;color:var(--ink2);border-left:3px solid var(--line2);padding-left:11px}

.xref{display:inline-block;font:700 13.5px/1 Barlow;color:var(--dose);background:var(--doseBg);border:1.5px solid var(--kb);border-color:color-mix(in srgb,var(--dose) 32%,transparent);padding:4px 8px;border-radius:5px;margin:1px}
.xref.fix::after{content:"↦";font-size:10px;vertical-align:super;margin-left:2px}

/* ================= tables ================= */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:12px 0;border:1.5px solid var(--line);border-radius:var(--rad);background:var(--panel)}
table{border-collapse:collapse;width:100%;min-width:380px;font-size:14px}
th,td{padding:11px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font:700 11px/1.2 Barlow;letter-spacing:.09em;color:var(--dim);text-transform:uppercase;background:var(--panel2)}
tr:last-child td{border-bottom:none}
tr.hi td{background:var(--doseBg);font-weight:600}
tr.hi td:first-child{box-shadow:inset 4px 0 0 var(--dose)}

/* ================= skills ================= */
.skgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;margin-top:9px}
.skcard{display:block;text-align:left;color:var(--ink);border:1.5px solid var(--line);border-top:5px solid var(--k);background:var(--panel);border-radius:0 0 var(--rad) var(--rad);padding:15px 14px;box-shadow:var(--shadow);transition:.16s}
.skcard:hover{background:var(--kg);box-shadow:var(--shadowUp)}
.skcard.off{opacity:.55}
.skcard .ic{font:400 26px/1 Barlow;color:var(--k);display:block;margin-bottom:8px}
.skcard h3{font-size:18.5px;font-weight:700}
.skcard p{margin:5px 0 0;font:500 12.8px/1.35 Barlow;color:var(--dim)}
.skcard em{display:inline-block;margin-top:10px;font:700 10px/1 Barlow;letter-spacing:.1em;text-transform:uppercase;color:#fff;background:var(--k);font-style:normal;padding:5px 8px;border-radius:20px}
:root[data-theme="dark"] .skcard em{color:#08141A}
.skcard em.no{background:var(--crit)}

.scene{position:relative;width:100%;margin-top:13px;background:var(--panel);border:1.5px solid var(--line);border-radius:var(--rad);overflow:hidden;box-shadow:var(--shadow)}
.scene svg{display:block;width:100%;height:auto}
.sc{opacity:0;transition:opacity .3s}
.sc.on{opacity:1}
.skin{fill:#C9AF9C}.fat{fill:#EBD9C4}
.bone,.bone2{fill:#F2F5F6;stroke:#9EB0B7;stroke-width:1.5}
.marrow{fill:#C4737E}.musc{fill:#B05C63;opacity:.9}
.nvb circle{fill:var(--crit);stroke:#fff;stroke-width:1.5}
.pleura{stroke:#0080AD;stroke-width:2;fill:none;stroke-dasharray:6 4}
.lung{fill:#CFE6EE;stroke:#7FADBD;stroke-width:1.5}
.tongue{fill:#C4737E}
.cart{fill:#E4EBEE;stroke:#93A9B1;stroke-width:1.5}
.ctm{fill:var(--dose);stroke:#fff;stroke-width:1.5}
.trach{fill:#DCE8EC;stroke:#8AA5AF;stroke-width:1.5}
.rib path{fill:none;stroke:#A2B4BB;stroke-width:2}
.ln2{fill:none;stroke:#A2B4BB;stroke-width:1.6}
.mid{stroke:#BCCBD2;stroke-width:1.2;stroke-dasharray:4 5;fill:none}
.gl path{stroke:var(--c-air);stroke-width:1.3;stroke-dasharray:5 5;fill:none;opacity:.8}
.gl text{fill:var(--c-air);font:700 10px Barlow}
.site{fill:none;stroke:var(--crit);stroke-width:3}
.stx{fill:var(--crit);font:700 11.5px Barlow}
.steel{stroke:#6C8390;stroke-width:5;stroke-linecap:round;fill:#6C8390}
.hubline{stroke:var(--dose);stroke-width:9;stroke-linecap:round}
.tubeln{stroke:#0080AD;stroke-width:10;stroke-linecap:round;fill:none}
.hub{fill:var(--dose)}.mark5{stroke:#fff;stroke-width:2.5}
.airjet path{stroke:#0080AD;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-dasharray:5 7}
.lbl{fill:#7A8D95;font:700 11px Barlow;text-anchor:middle;letter-spacing:.08em}
.lbl2{fill:#5D7280;font:700 10.5px Barlow}
.lbl3{fill:#5D7280;font:600 10px Barlow}
.lbl-hi{fill:var(--dose);font:700 10.5px Barlow}
.warn-lbl{fill:var(--crit);font:700 9.5px Barlow;text-anchor:middle}
.axis{stroke:#A2B4BB;stroke-width:1.5;fill:none}
.tick path{stroke:#A2B4BB;stroke-width:1.5}
.tick text{fill:var(--dim);font:600 10px Barlow;text-anchor:middle}
.ph rect{fill:var(--panel2);stroke:var(--line2);stroke-width:1.5}
.ph text{fill:var(--dim);font:700 12px Barlow;text-anchor:middle}
.ph text.sub{fill:var(--dim);font:500 9.5px Barlow}
.ph.on rect{fill:var(--doseBg);stroke:var(--dose);stroke-width:2.5}
.ph.on text{fill:var(--ink)}.ph.on text.sub{fill:var(--dose)}
.o2{stroke:var(--c-air);stroke-width:3;stroke-linecap:round;opacity:.65;stroke-dasharray:10 8}
.o2t{fill:var(--c-air);font:700 10px Barlow}
:root[data-theme="dark"] .skin{fill:#3A4A50}
:root[data-theme="dark"] .fat{fill:#26353B}
:root[data-theme="dark"] .bone,:root[data-theme="dark"] .bone2{fill:#CAD8DC;stroke:#90A5AC}
:root[data-theme="dark"] .lung{fill:#1F4450;stroke:#38626F}
:root[data-theme="dark"] .cart{fill:#BCCED4;stroke:#87A0A8}
:root[data-theme="dark"] .trach{fill:#274450;stroke:#497381}
:root[data-theme="dark"] .rib path,:root[data-theme="dark"] .ln2{stroke:#54707A}
:root[data-theme="dark"] .steel{stroke:#E2ECEF;fill:#E2ECEF}
:root[data-theme="dark"] .lbl{fill:#3A4A50}
:root[data-theme="dark"] .mark5{stroke:#080F13}

@keyframes advA{0%{transform:translate(78px,-52px)}55%,100%{transform:translate(0,0)}}
@keyframes advB{0%{transform:translate(-56px,-70px)}55%,100%{transform:translate(0,0)}}
@keyframes drill{0%{transform:translateY(0)}45%,100%{transform:translateY(96px)}}
@keyframes jet{0%{opacity:0;stroke-dashoffset:30}50%{opacity:0}62%{opacity:1}100%{opacity:.25;stroke-dashoffset:-30}}
@keyframes ping{0%,100%{opacity:.4;r:11}50%{opacity:1;r:15}}
@keyframes flowline{to{stroke-dashoffset:-36}}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.sc.on .anim-adv-a{animation:advA 3.2s cubic-bezier(.4,0,.2,1) infinite}
.sc.on .anim-adv-b{animation:advB 3.2s cubic-bezier(.4,0,.2,1) infinite}
.sc.on .anim-drill{animation:drill 3.2s cubic-bezier(.45,0,.2,1) infinite}
.sc.on .airjet path{animation:jet 3.2s linear infinite}
.sc.on .site{animation:ping 2.2s ease-in-out infinite}
.sc.on .site.b{animation-delay:1.1s}
.sc.on .o2{animation:flowline 1.6s linear infinite}
#view>*{animation:rise .2s ease both}

.stepbar{display:flex;gap:4px;margin-top:13px}
.stepdot{flex:1;height:5px;border-radius:3px;background:var(--line2)}
.stepdot.done{background:var(--k);opacity:.45}
.stepdot.now{background:var(--k)}
.stepn{display:flex;align-items:baseline;gap:11px;margin-top:15px}
.stepn .num{font:700 32px/1 "Barlow Condensed";color:var(--k);min-width:58px}
.stepn .num small{font:700 10.5px/1 Barlow;color:var(--dim);display:block;letter-spacing:.1em;margin-top:4px}
.stepn h2{font-size:24px;font-weight:700;flex:1}
.stepbody p{margin:12px 0 0;font-size:15.5px;line-height:1.58;color:var(--ink2)}
.stepbody p strong,.stepbody p b{color:var(--ink);font-weight:700}
.stepnav{display:flex;gap:8px;margin-top:22px;align-items:center;position:sticky;bottom:14px;z-index:20}
.stepnav button{flex:1;padding:16px 12px;border:1.5px solid var(--line2);border-radius:var(--rad);background:var(--panel);font:700 15px/1 Barlow;color:var(--ink2);box-shadow:var(--shadowUp)}
.stepnav button.go{background:var(--k);border-color:var(--k);color:#fff;flex:2}
:root[data-theme="dark"] .stepnav button.go{color:#08141A}
.stepnav button:disabled{opacity:.35}
.sklist{margin-top:22px}
.sklist summary{font:700 12px/1 Barlow;letter-spacing:.11em;text-transform:uppercase;color:var(--dim);padding:14px 0;border-top:1.5px solid var(--line)}
.skmeta{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(232px,1fr));margin-top:15px}
.skbox{border:1.5px solid var(--line);border-radius:var(--rad);padding:13px;background:var(--panel);box-shadow:var(--shadow)}
.skbox h4{font:700 10.5px/1 Barlow;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin-bottom:8px}
.skbox.ind h4{color:var(--ok)}.skbox.con h4{color:var(--crit)}.skbox.kit h4{color:var(--k)}
.skbox li{font-size:13.8px;padding:4px 0 4px 14px}

/* ================= calculators ================= */
.cgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:14px}
.cf{display:flex;flex-direction:column;gap:6px}
.cf>span:first-child{font:700 10.5px/1 Barlow;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.cf input,.cf select{background:var(--panel);border:1.5px solid var(--line2);border-radius:var(--rad2);color:var(--ink);padding:13px 12px;font:600 16.5px/1.15 Barlow;width:100%;min-width:0;min-height:48px}
.cf input:focus,.cf select:focus{border-color:var(--dose);box-shadow:0 0 0 3px var(--doseBg)}
.cin{display:flex;gap:6px}
.cin input{flex:2;min-width:0}
.cin select{flex:1.15;min-width:0;padding-left:8px;padding-right:4px;font-size:14.5px}
.calcrow{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.cbtn{border:1.5px solid var(--line2);background:var(--panel);color:var(--ink2);padding:14px 17px;border-radius:var(--rad);font:700 14px/1 Barlow;min-height:48px;box-shadow:var(--shadow)}
.cbtn.go{background:var(--dose);border-color:var(--dose);color:#fff}
:root[data-theme="dark"] .cbtn.go{color:#06141A}
.bigout{margin-top:16px;border:2px solid var(--k);border-radius:var(--rad);padding:20px;background:var(--kf);box-shadow:var(--shadowUp)}
.bov{font:700 56px/1 "Barlow Condensed",Barlow;color:var(--k)}
.bov small{font:700 18px/1 Barlow;margin-left:10px}
.bon{margin-top:9px;font:500 13.2px/1.5 Barlow;color:var(--ink2)}

.bodysvg{display:block;width:100%;height:auto;padding:8px 4px}
.figlab{fill:var(--dim);font:700 10.5px Barlow;letter-spacing:.18em;text-anchor:middle}
.bz *{fill:var(--panel2);stroke:var(--line3);stroke-width:1.8;transition:.14s}
.bz{cursor:pointer}
.bz.on *{fill:var(--c-trauma);stroke:#fff}
.bz:focus-visible *{stroke:var(--dose);stroke-width:3}
.bzp{fill:var(--dim);font:700 11.5px Barlow;text-anchor:middle;pointer-events:none}
.bzp.sm{font-size:9px}
.tbsabar{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-top:14px;border:2px solid var(--c-trauma);border-radius:var(--rad);background:color-mix(in srgb,var(--c-trauma) 10%,transparent);padding:16px;box-shadow:var(--shadowUp)}
.tbsav{font:700 54px/1 "Barlow Condensed",Barlow;color:var(--c-trauma)}
.tbsav small{font:700 16px/1 Barlow;margin-left:7px}
.tbsaside{flex:1 1 230px;min-width:0}
.tbsarow{display:flex;justify-content:space-between;gap:12px;padding:7px 0;font:500 13.4px/1.35 Barlow;color:var(--ink2);border-bottom:1px solid var(--line2)}
.tbsarow:last-child{border-bottom:none}
.tbsarow b{color:var(--ink);font-weight:700}
.tbsarow.hi b{color:var(--c-trauma);font-size:19px}

.dosehd{border:1.5px solid var(--kb);border-left:4px solid var(--k);background:var(--kf);padding:14px 15px;border-radius:0 var(--rad) var(--rad) 0;margin-top:16px}
.dosehd h2{font-size:22px;font-weight:700;color:var(--k)}
.dosehd p{margin:6px 0 0;font:500 13px/1.45 Barlow;color:var(--ink2)}
.nowt{border:1.5px solid var(--warnLine);background:var(--warnBg);border-radius:var(--rad);padding:15px;margin-top:14px;font-size:14.5px;color:var(--ink2)}
.nowt b{color:var(--warn)}
.nowt button{margin-top:11px;display:block;border:1.5px solid var(--warn);color:#fff;background:var(--warn);font:700 13.5px/1 Barlow;padding:13px 17px;border-radius:var(--rad2);min-height:46px}
:root[data-theme="dark"] .nowt button{color:#08141A}
.fcard{border:1.5px solid var(--line);border-left:4px solid var(--k);background:var(--panel);border-radius:0 var(--rad) var(--rad) 0;padding:14px;margin-bottom:8px;box-shadow:var(--shadow)}
.fhd{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.fhd h3{font-size:20px;font-weight:700}
.fhd em{font:500 13.5px/1 Barlow;color:var(--dim);font-style:normal}
.fhd .cls{margin-left:auto;font:700 9.5px/1 Barlow;letter-spacing:.1em;text-transform:uppercase;color:#fff;background:var(--k);padding:5px 8px;border-radius:20px}
:root[data-theme="dark"] .fhd .cls{color:#08141A}
.fgrp{margin-top:12px}
.fglab{font:700 10.5px/1 Barlow;letter-spacing:.11em;text-transform:uppercase;color:var(--dim);margin-bottom:6px}
.fglab.ad{color:var(--c-adult)}.fglab.pd{color:var(--c-ped)}.fglab.ob{color:var(--c-ob)}
.find{font:500 13.2px/1.5 Barlow;color:var(--dim);margin-top:10px}
.find b{color:var(--ink2);font-weight:700}
.find .no{color:var(--crit)}
.tabs{display:flex;gap:6px;margin-top:16px;overflow-x:auto;scrollbar-width:none;padding-bottom:3px}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:11px 15px;font:600 14px/1 Barlow;color:var(--ink2);white-space:nowrap;border:1.5px solid var(--line2);border-radius:20px;background:var(--panel);min-height:42px;display:flex;align-items:center}
.tab[aria-selected=true]{background:var(--k);border-color:var(--k);color:#fff;font-weight:700}
:root[data-theme="dark"] .tab[aria-selected=true]{color:#08141A}

/* ================= assistant ================= */
.chatwrap{margin-top:14px;display:flex;flex-direction:column;gap:9px}
.msg{border-radius:var(--rad);padding:13px 15px;font-size:15px;line-height:1.58;max-width:94%}
.msg.user{align-self:flex-end;background:var(--c-sed);color:#fff;font-weight:600}
:root[data-theme="dark"] .msg.user{color:#0E0A1E}
.msg.user p{margin:0}
.msg.assistant{align-self:flex-start;background:var(--panel);border:1.5px solid var(--line2);color:var(--ink2);box-shadow:var(--shadow)}
.msg.assistant p{margin:0 0 10px}
.msg.assistant p:last-child{margin:0}
.msg.assistant b{color:var(--ink)}
.msg.assistant code{background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:1px 6px;font-size:13.5px}
.msg.busy{display:flex;align-items:center;gap:10px;color:var(--dim);font:500 14px/1 Barlow}
.dots{display:flex;gap:4px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--c-sed);display:block;animation:bl 1.1s infinite}
.dots i:nth-child(2){animation-delay:.16s}.dots i:nth-child(3){animation-delay:.32s}
@keyframes bl{0%,100%{opacity:.25;transform:translateY(0)}50%{opacity:1;transform:translateY(-3px)}}
.askbar{display:flex;gap:8px;margin-top:14px;position:sticky;bottom:14px;z-index:20}
.askbar input{flex:1;min-width:0;background:var(--panel);border:1.5px solid var(--line2);border-radius:var(--rad);padding:15px 14px;font:600 16px/1.2 Barlow;color:var(--ink);box-shadow:var(--shadowUp)}
.askbar input:focus{border-color:var(--c-sed)}
.asksend{background:var(--c-sed);color:#fff;border-radius:var(--rad);padding:15px 21px;font:700 14.5px/1 Barlow;box-shadow:var(--shadowUp)}
:root[data-theme="dark"] .asksend{color:#0E0A1E}
.asksend:disabled{opacity:.4}

.disc{margin-top:34px;border-top:1.5px solid var(--line);padding-top:15px;font:500 12.5px/1.55 Barlow;color:var(--dim)}
.disc b{color:var(--ink2);font-weight:700}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.lgi{display:flex;align-items:center;gap:6px;font:700 11.5px/1 Barlow;color:var(--k);border:1.5px solid var(--kb);background:var(--kf);padding:7px 11px;border-radius:20px}
.lgi i{width:9px;height:9px;border-radius:50%;background:var(--k);display:block}


/* ---------- PWA chrome ---------- */
.netbadge{position:fixed;left:11px;bottom:calc(11px + env(safe-area-inset-bottom,0px));z-index:200;

P.push({id:'2.5',s:'2',pg:18,t:'Respiratory Distress',sx:['sob','shortness of breath','wheezing','asthma','copd','bronchospasm','croup','stridor','epiglottitis','dyspnea'],flags:['ev-croup-racemic'],b:[
 ['h','Indications'],
 ['ul',['Acute bronchospasm occurs in a variety of disease processes including COPD, emphysema, bronchitis, and congestive heart failure. Other reversible disorders include asthma. Determining a patient\u2019s usual status of disease will enable the provider to assess the current presentation.']],
 ['crit','Indications for aggressive treatment include evidence of hypercarbia, hypoxia, and fatigue. <b>Controlled hypercarbia is preferable to inducing barotrauma</b> in these patients. <b>All that wheezes is not asthma.</b>'],
 ['h','Interventions'],
 ['ul',[
   'Assess and maintain an adequate airway. Watch for increasing ventilatory fatigue, which will culminate in hypoventilation and the need for intubation and ventilatory support.',

   'Administer supplemental oxygen 6\u201315 L/min via NC or NRB to maintain SpO\u2082 &gt; 93%. If severe distress, consider high flow oxygen and prepare for advanced airway management.',
   'Monitor cardiac rhythm, oxygen saturation, end tidal carbon dioxide and hemodynamic status.',
   'Establish IV and maintain KVO rate.']],
 ['rx',{n:'Duo-Neb (Albuterol 2.5 mg / Ipratropium 0.5 mg)',d:'1 neb over 5\u201315 min',r:'Nebulized',note:'Flow rate 6\u20138 LPM air/oxygen. After two doses of Duo-Neb, administer continuous albuterol nebulizers PRN. Do not use Atrovent in patients with known peanut allergies.'}],
 ['rx',{n:'Methylprednisolone (Solu-Medrol)',d:'125 mg adult  \u2022  1 mg/kg peds',r:'IV',calc:{per:'kg',lo:1,u:'mg',pedonly:true,note:'pediatric dose'}}],
 ['rx',{n:'Magnesium Sulfate',d:'2 g over 20 min adult  \u2022  50 mg/kg peds',r:'IV',calc:{per:'kg',lo:50,u:'mg',max:2000,pedonly:true,maxlbl:'max 2 g'},note:'Consider in patients with known history of asthma. Monitor for respiratory depression.'}],
 ['rx',{n:'Epinephrine 1:1000',d:'0.3 mg IM q15 min \u00D7 3 doses PRN',r:'IM',note:'For life-threatening respiratory distress or refractory shock. Use with caution in patients with cardiovascular disease or over age 55.'}],
 ['rx',{n:'Ketamine',d:'1\u20132 mg/kg',r:'IV',calc:{per:'kg',lo:1,hi:2,u:'mg'},note:'Induction medication of choice for asthma. If the patient\u2019s mental status continues to wane, prepare for emergent intubation.'}],
 ['note','<strong>BiPAP:</strong> if respiratory status continues to deteriorate, consider a trial at initial settings of <strong>10/5 with FiO\u2082 100%</strong>. Titrate accordingly. See {{7.13}}.'],
 ['note','<strong>In intubated patients, use MDI.</strong> Install a spacer in the ventilator circuit and extend it fully. If an HME filter is in use, remove it prior to MDI administration. Insert the MDI at the top of the spacer and depress just prior to the inspiratory phase. Allow several breaths and repeat. Collapse the spacer after treatment to minimize dead space.'],
 ['h','Special case \u2014 Croup'],
 ['ul',['Assess adequacy of airway, breathing and circulation; intervene as appropriate.','Provide ventilatory support as needed. If there is concern for maintaining a patent airway, consider endotracheal intubation by the most experienced provider (including anesthesiology in an operating room environment).','Monitor and record RR, SpO\u2082, HR, ECG and BP. Administer high flow, high concentration oxygen.','Connect the nebulizer to an oxygen source at 6 L/min.']],
 ['rx',{n:'Dexamethasone',d:'0.6 mg/kg',r:'PO / IV',calc:{per:'kg',lo:0.6,u:'mg',max:10},note:'Maximum 10 mg.'}],
 ['rx',{n:'Racemic Epinephrine',d:'&lt; 6 mo: 0.25 mL (5.625 mg)  \u2022  &gt; 6 mo: 0.5 mL (11.25 mg)',r:'Nebulized',note:'Max single dose 0.5 mL (11.25 mg). May not exceed every 1\u20132 hours as needed for severe stridor. NOTE: {{8.9}} gives a different weight-based regimen for the same indication \u2014 see the evidence flag below.'}],
 ['h','Special case \u2014 Epiglottitis or undifferentiated stridor'],
 ['ul',[
   'Assess adequacy of airway, breathing and circulation; intervene as appropriate.',

   'Administer high flow, high concentration oxygen.',

P.push({id:'3.3',s:'3',pg:25,t:'Paroxysmal Supraventricular Tachycardia (PSVT)',sx:['svt','psvt','tachycardia','narrow complex','adenosine','palpitations','fast heart rate'],b:[
 ['h','Indications'],
 ['ul',['Successful treatment of the rapid heart rate by stabilizing the abnormal heart rhythm through therapeutic interventions.']],

 ['h','Interventions'],
 ['ul',['Apply hands-free multi-function pads. May proceed directly to cardioversion if the patient becomes unstable.','Obtain 12-lead EKG if not provided.','Attempt to perform vagal maneuvers.']],

 ['rx',{n:'Diltiazem',d:'0.25 mg/kg over 2 min',r:'IV bolus',calc:{per:'kg',lo:0.25,u:'mg',max:20,maxlbl:'not to exceed 20 mg'},note:'If not converted with Adenosine. May repeat at 0.35 mg/kg IV in 15 minutes, not to exceed 25 mg. If effective, begin infusion 5 mg/hr and titrate to max 15 mg/hr; target heart rate 100 bpm.'}],
 ['h','Wide complex, stable patient'],
 ['ul',['If rhythm regular and monomorphic, consider Adenosine per above dosing guideline.']],
 ['rx',{n:'Amiodarone',d:'150 mg over 10 min',r:'IV infusion',note:'If not converted with Adenosine. If effective, follow with maintenance infusion 60 mg/hr \u00D7 6 hours, then 30 mg/hr \u00D7 18 hours. If SVT recurs, may repeat the 150 mg load over 10 minutes one time.'}],
 ['h','If patient is unstable'],
 ['crit','Prepare for <b>synchronized cardioversion</b> per device manufacturer recommendations. Consider sedation and analgesia per {{4.16}} and {{4.17}}. Contact medical control if unsuccessful in converting the dysrhythmia.']

 ['crit','<b>Early, rather than late, airway intervention may be required if swelling is rapid.</b>'],
 ['h','Interventions'],
 ['ul',[
   'Identify etiology of antigen exposure. Assess and maintain adequate airway, breathing, and circulation.',
   'Provide supplemental oxygen to maintain SpO\u2082 &gt; 93%. Proceed to advanced airway management and intubation if there is potential for airway obstruction or the patient has severe dyspnea.',
   'If there is concern for progression, consider establishing IV access with two large bore needles (18 g or larger) with 0.9% NS at initial KVO rate.']],
 ['h','Mild reaction'],
 ['rx',{n:'Diphenhydramine (Benadryl)',d:'50 mg',r:'IV',note:'H1 antagonist.'}],
 ['rx',{n:'Methylprednisolone (Solu-Medrol)',d:'125 mg q8h',r:'IV',note:'Corticosteroid.'}],
 ['rx',{n:'Albuterol',d:'5 mg',r:'Nebulized',note:'May repeat \u00D7 3.'}],
 ['rx',{n:'Famotidine',d:'20 mg',r:'IV',note:'Consider. H2 antagonist.'}],
 ['h','Moderate to severe reaction'],
 ['rx',{n:'Epinephrine 1:1,000',d:'0.3 mg IM q15 min',r:'IM',note:'MAX 0.9 mg (3 doses). If there is evidence of worsening respiratory distress or failure, consider RSI per {{2.3}}.'}],
 ['h','Persistent hypotension'],
 ['ul',['Provide IV fluid resuscitation with crystalloids to maintain SBP &gt; 90 mmHg.','If the patient remains hypotensive despite a total of 2000 mL of IV fluid, refer to {{4.13}}.','Monitor for signs of pulmonary edema and fluid overload.']],
 ['rx',{n:'Epinephrine infusion',d:'Start 0.05 mcg/kg/min',r:'IV infusion',calc:{per:'kg/min',lo:0.05,u:'mcg/min'},note:'Titrate by 0.02\u20130.05 mcg/kg/min as indicated. Dose range up to 0.5 mcg/kg/min. There is no true maximum dose, but consider an additional agent if the patient is unresponsive to higher doses.'}],
 ['crit','In refractory shock due to severe anaphylaxis, <b>epinephrine infusion is the vasopressor of choice</b>.']

P.push({id:'4.2',s:'4',pg:31,t:'Diabetic Emergencies (Adult)',sx:['diabetes','dka','hypoglycemia','hyperglycemia','low blood sugar','glucose','insulin','d50','altered mental status'],b:[
 ['h','Pearls, pitfalls and considerations'],
 ['ul',[
   'DKA represents a state of disordered metabolism in which the level of hyperglycemia may not fully describe or comport with the other metabolic changes such as potassium depletion or ketoacidosis.',
   'Repletion of potassium, fluids, and correction of the acidotic state must proceed deliberately and with due regard for the time interval in which this patient has been experiencing this condition.',
   '<strong>Overly aggressive administration of insulin, fluids, potassium, and sodium bicarbonate will produce untoward outcomes.</strong>',
   'Hyperglycemia from etiologies other than DKA should be ruled out before applying this protocol.']],
 ['h','Hypoglycemia'],
 ['ul',['Determine serum glucose with point-of-care device (iSTAT or Accu-Chek fingerstick).','Obtain IV access. Initiate 0.9% NS at TKO rate.','Maintain appropriate hemodynamic status with fluid resuscitation as indicated.']],
 ['crit','If measured glucose is low (<b>BGL &lt; 60 mg/dL</b>) in a known diabetic with decreased LOC, or any patient with AMS and hypoglycemia:'],
 ['rx',{n:'Dextrose 50%',d:'25 g',r:'IV',note:'Repeat as needed.'}],
 ['rx',{n:'Glucagon',d:'1 mg',r:'IM',note:'If unable to obtain IV access.'}],
 ['rx',{n:'Thiamine',d:'100 mg over 5 min',r:'IV',note:'If suspected or known ETOH abuse \u2014 give prior to Dextrose 50%.'}],
 ['h','Hyperglycemia \u2014 workup'],
 ['ul',[['Review lab values (document for chart and receiving facility):',['CBC','CMP, Mg, and Phos','Serum \u03B2-hydroxybutyrate (serum ketones)','Venous blood gas','UA','Anion gap = Na \u2212 (Cl + CO\u2082)']],'If labs are unavailable, complete VBG and BMP on iSTAT.']],
 ['h','DKA criteria \u2014 all must be met'],
 ['crit','Whole blood glucose &gt; 200 mg/dL \u00B7 Venous pH &lt; 7.3 \u00B7 Bicarbonate (HCO\u2083) &lt; 15 mmol/L \u00B7 UA demonstrates ketones \u00B7 Anion gap &gt; 12'],
 ['note','If the above criteria are not met, or all data has not been obtained, discuss the necessity of therapy with OLMC. 0.9% NS at maintenance therapy can be initiated; rate can be adjusted based upon diagnosis and hemodynamic stability.'],
 ['h','DKA treatment (adult)'],
 ['ul',['Patient to remain NPO. Stop insulin pump if applicable.']],
 ['rx',{n:'0.9% Normal Saline',d:'500\u20131000 mL bolus',r:'IV',note:'May repeat if needed to address fluid deficits.'}],
 ['rx',{n:'Insulin infusion',d:'0.1 unit/kg/hr',r:'IV infusion',calc:{per:'kg/hr',lo:0.1,u:'units/hr'},note:'Reduce infusion to 0.05 units/kg/hr when BGL reaches 200 mg/dL.'}],
 ['rx',{n:'D5NS',d:'150 mL/hr',r:'IV infusion',note:'Initiate when BGL reaches 250 mg/dL.'}],
 ['rx',{n:'Potassium chloride',d:'10 mEq in 100 mL over 1 hour',r:'IV infusion',note:'Initiate replacement when potassium reaches 5.5 mEq/L.'}],
 ['crit','<b>In extremis, if posturing is noted:</b> Hypertonic Saline 250 mL over 10 minutes.']
]});

P.push({id:'4.3',s:'4',pg:33,t:'GI Bleed',sx:['gi bleed','hematemesis','melena','coffee ground','varices','octreotide','vomiting blood','black stool'],b:[
 ['h','Indications'],
 ['ul',['Patients who present with the loss of blood in either the upper or lower tract.','Patient may present with mild anemia to severe hypovolemic shock.']],
 ['h','Pearls, pitfalls and considerations'],
 ['ul',[
   '\u201CCoffee ground\u201D emesis or hematemesis suggest a proximal lesion; hematochezia or melena suggest a distal lesion.',
   'History of medication, alcohol use, and anticoagulants should be elicited.',
   'Octreotide has been shown to be an effective bridge to endoscopy in patients suffering from upper GI bleeding (variceal or otherwise), and is also appropriate for GI hemorrhage of unknown origin.']],
 ['h','Interventions'],
 ['ul',[
   'Administer supplemental oxygen to maintain SpO\u2082 &gt; 93% if adequate spontaneous respirations.',
   'Establish <strong>TWO large bore IVs</strong> of 0.9% Normal Saline.',
   ['Treat for hypovolemic shock as appropriate:',['Use permissive hypotension strategy','Maintain MAP of 60\u201365','If continued hypotension, refer to {{4.13}}']],
   'Identify a completed INR, type and screen, and hematocrit prior to transport. If not completed, obtain iSTAT INR, hemoglobin/hematocrit and ABG with lactate.',
   'If supratherapeutic INR, consider discussion of anticoagulation reversal with the accepting physician including liquid plasma or PCC \u2014 {{7.3}}.',
   '<strong>NG tubes are NOT contraindicated</strong> in patients vomiting bright red blood or with confirmed esophageal/gastric varices that have recently bled. Avoid over-vigorous suction to avoid mucosal irritation.',
   'If balloon tamponade (Blakemore tube) is necessary, <strong>endotracheal intubation should be completed prior to its placement</strong> to prevent airway obstruction during transport.',
   'Consider blood product administration per {{7.1}}.']],
 ['rx',{n:'Octreotide bolus',d:'40\u201380 mcg in 100 mL over 20 min',r:'IV',note:'Specifically indicated in end-stage liver disease with esophageal varices, but should be used for all significant bleeds.'}],
 ['rx',{n:'Octreotide infusion',d:'25\u201350 mcg/hour',r:'IV infusion',note:'After bolus.'}],
 ['rx',{n:'Pantoprazole',d:'80 mg',r:'IV bolus',note:'Consider for undifferentiated gastrointestinal bleeding.'}],
 ['rx',{n:'Vasopressin',d:'0.2\u20130.4 units/min',r:'IV infusion',note:'In cases of severe bleeding from esophageal varices.'}]
]});

P.push({id:'4.4',s:'4',pg:34,t:'Ischemic and Hemorrhagic CVA, TIA, Non-Traumatic SAH',sx:['stroke','cva','tia','sah','hemorrhage','weakness','facial droop','slurred speech','nihss','icp','tpa'],flags:['ev-ich-bp'],b:[
 ['h','Indications'],
 ['ul',['To identify patients with intracranial abnormalities including hemorrhage and ischemia. Once identified, management should be tailored to blood pressure management and rapid transport to the appropriate receiving center.']],
 ['h','Pearls, pitfalls and considerations'],
 ['ul',['Initial evaluation should include differentiation between stroke and associated mimics (hypoglycemia, seizures).','Subsequent management of intracranial pathology is tailored to the diagnosis. Emergent transport to the most appropriate facility should be completed efficiently and swiftly.','In the setting of ischemic stroke without reperfusion and subarachnoid hemorrhage, consideration for neurosurgical consultation is required.']],
 ['h','Interventions'],
 ['ul',[
   'Assess airway, breathing, and circulation. Maintain adequate airway and ventilation. Provide supplemental oxygen to maintain SpO\u2082 &gt; 93%.',
   'Determine fingerstick blood glucose.',
   'Obtain IV access with two peripheral IVs of 0.9% NS at a TKO rate.',
   'Obtain vitals and place on monitor including pulse oximetry and ETCO\u2082. Complete a neurologic exam including appropriate stroke score (NIHSS or Cincinnati).',
   '<strong>Determine exact time of onset of signs and symptoms, if possible.</strong>',
   'If significant alteration in mental status and unable to protect the airway, consider RSI per {{2.3}}. With airway placement, <strong>avoid hypotension (SBP \u2264 90 mmHg) and hypoxia (PaO\u2082 &lt; 60)</strong>.',
   'Elevate head of bed 30 degrees. Minimize noxious stimuli and treat pain aggressively.',
   'If the patient received tPA, document time of bolus and time of infusion, physician ordering, and any noted complications.',
   'Consider placing an arterial line for continuous BP monitoring.',
   'If an ICP monitor is in place, maintain <strong>CPP between 70\u2013100 mmHg</strong> (minimum 60 mmHg).']],
 ['h','If BGL &lt; 60 mg/dL'],
 ['rx',{n:'Dextrose 50%',d:'25 g',r:'IV'}],
 ['rx',{n:'Glucagon',d:'1 mg',r:'IM',note:'If IV unobtainable.'}],
 ['h','Coagulopathy'],
 ['ul',['If intracranial bleeding is suspected, obtain iSTAT INR value.','If INR is elevated &gt; 2.0, contact receiving center staff for options: LP, FFP, or PCC \u2014 {{7.3}} or {{7.4}}.']],
 ['rx',{n:'Vitamin K (phytonadione)',d:'5\u201310 mg in 50\u2013100 mL NS over 30 min',r:'IV'}],
 ['h','Blood pressure targets'],
 ['crit','<b>Do not treat hypertension in prehospital patients presenting as possible stroke/TIA.</b> Transport to the nearest stroke center.'],
 ['tbl',{h:['Confirmed diagnosis (CT/MRI)','SBP target'],r:[
   ['Ischemic CVA','&lt; 180 mmHg'],
   ['Intraparenchymal hemorrhagic CVA','&lt; 160 mmHg'],
   ['Spontaneous non-traumatic SAH','&lt; 140 mmHg']]}],
 ['note','If hypotensive with MAP &lt; 65 mmHg and associated mental status changes, refer to {{4.13}}. If hypertensive, refer to {{4.14}}.'],
 ['rx',{n:'Nicardipine infusion',d:'Start 2.5 mg/hr',r:'IV infusion',note:'Titrate in 2.5 mg increments q5 minutes to a maximum of 15 mg/hr to achieve goal blood pressure.'}],
 ['rx',{n:'Labetalol',d:'10\u201320 mg slow IVP over 2 min',r:'IV',note:'May repeat q10 minutes with the second dose at 40 mg and subsequent doses at 80 mg. Maximum 300 mg.'}],
 ['h','Herniation / rising ICP'],
 ['crit','Severe neurological deterioration \u2014 altered mental status, obtundation, unequal pupils, and Cushing\u2019s triad (hypertension, bradycardia, irregular respirations).'],
 ['rx',{n:'Hypertonic Saline 3%',d:'5 mL/kg over 15 min',r:'IV',calc:{per:'kg',lo:5,u:'mL',max:250},note:'Maximum 250 mL.'}],
 ['note','There is currently a debate in the use of prophylactic anti-epileptic drugs in the setting of spontaneous ischemic strokes, TIAs, or intracerebral bleeding, except in the setting of SAH. Consult the accepting attending for the option of Levetiracetam (Keppra) or other. If a seizure occurs, reference {{4.12}}.']
]});

P.push({id:'4.5',s:'4',pg:36,t:'Aortic Aneurysm',sx:['aaa','aortic aneurysm','abdominal pain','back pain','ruptured','permissive hypotension','pulseless'],b:[
 ['h','Indications'],
 ['ul',['An aortic aneurysm can develop anywhere in the ascending, descending, arch or thoraco-abdominal area of the aorta. Aortic aneurysms are commonly located below the renal arteries.']],
 ['h','Pearls, pitfalls and considerations'],
 ['ul',[
   'A distending abdomen, absence of distal pulses, mottled and/or cyanotic distal extremities accompany severe hypotension from a ruptured aneurysm.',
   'The patient may have a history of severe abdominal pain but may not have ruptured.',
   'Many patients with leaking aneurysms may need to remain mildly hypotensive to survive this complicated disease process during transport to a definitive-care facility.',
   'Aortic dissection may present as an acute stroke or AMI.',
   '<strong>Syncope and back pain are key findings.</strong>']],
 ['crit','A <b>permissive hypotensive strategy</b> should be utilized. Titrate BP to a systolic of <b>80\u201390</b> and/or a <b>MAP of 60</b>.'],
 ['h','Interventions'],
 ['ul',[
   'Rapidly assess and obtain history including known trauma, infection, congenital condition, hypertension, atherosclerosis, known aneurysm, and onset of pain.',
   'Assessment to include primary and secondary surveys, blood pressure in both arms, and distal pulses in all four extremities. <strong>Avoid aggressive abdominal examinations.</strong>',
   'If any alteration in mental status or level of consciousness, consider advanced airway placement per {{2.3}}.',
   'Consider utilizing ultrasound to assess great vessels.',
   'Obtain two peripheral IVs. Alert the receiving hospital for imminent surgery.',
   'Titrate fluids to keep SBP approximately 90 mmHg or a blood pressure that maintains cerebral perfusion. Consider giving blood if needed. Consider placement of arterial line.',
   'Obtain iSTAT INR value. If anticoagulated and/or INR &gt; 1.4, consider emergent reversal in consultation with the accepting physician \u2014 {{7.3}} or {{7.4}}.',
   'If providing whole blood, refer to {{7.1}}. If the patient remains hypotensive despite fluid and blood, refer to {{4.13}}.',
   'Provide appropriate pain and anxiolysis per {{4.16}} and {{4.17}}.']],
 ['h','If hypertensive \u2014 priority is SBP control over heart rate'],
 ['rx',{n:'Labetalol',d:'10\u201320 mg slow IV push over 2 min',r:'IV',note:'May repeat every 10 minutes with additional doses of 40 mg then 80 mg until SBP 100 mmHg or a maximum total dose of 300 mg.'}],
 ['alt'],
 ['rx',{n:'Metoprolol',d:'5 mg q5 min \u00D7 3 doses',r:'IV'}],
 ['alt'],
 ['rx',{n:'Esmolol',d:'Load 500 mcg/kg over 1 min, then 50 mcg/kg/min',r:'IV',calc:{per:'kg',lo:500,u:'mcg',lbl:'loading dose'},note:'If no response, repeat loading dose 500 mcg/kg over 1 minute and increase infusion by 50 mcg/kg/min increments every 5\u201315 minutes up to a total of 300 mcg/kg/min.'}],
 ['h','If SBP remains &gt; 120 mmHg after beta-blockade'],
 ['rx',{n:'Nicardipine infusion',d:'Start 2.5 mg/hr',r:'IV infusion',note:'Increase by 2.5 mg/hr every 5\u201315 minutes up to a maximum of 15 mg/hr. Once target BP achieved, titrate down. Use to achieve target SBP 90\u2013100. If hypertension persists, contact receiving clinician \u2014 {{4.14}}.'}],
 ['crit','A ruptured AAA is a <b>time-sensitive diagnosis requiring immediate operative repair</b>. Minimize scene times. Determination of the need for direct admission to the O.R. must be made and communicated with medical control as soon as possible.']
]});

P.push({id:'4.6',s:'4',pg:38,t:'Aortic Dissection',sx:['aortic dissection','tearing chest pain','ripping','back pain','pulse deficit','stanford','esmolol'],b:[
 ['h','Indications'],
 ['ul',['Aortic dissection begins with the formation of a tear in the aortic intima that directly exposes an underlying medial layer to the driving force (pulse pressure) of the intraluminal blood.']],
 ['h','Classification'],
 ['ul',[
   ['<strong>Stanford type A</strong>',['Involves the ascending aorta and/or aortic arch, and possibly the descending aorta.','The tear can originate in the ascending aorta, the aortic arch, or, more rarely, in the descending aorta.','Includes DeBakey types I and II. <strong>Requires emergent surgical repair.</strong>']],
   ['<strong>Stanford type B</strong>',['Involves the descending aorta or the arch (distal to the left subclavian artery), without involvement of the ascending aorta.','Includes DeBakey type III. Typically managed medically until complications arise.']]]],
 ['crit','Achieve maximal control of luminal flow with <b>initial heart rate control</b> and then subsequent BP management.'],
 ['h','Interventions'],
 ['ul',[
   'Rapidly assess and obtain history including known trauma, infection, congenital condition, hypertension, atherosclerosis, and onset of pain.',
   'Assessment to include primary and secondary surveys, <strong>blood pressure in both upper extremities</strong>, and distal pulses in all 4 extremities. Assess for new heart murmurs.',
   'Consider utilizing ultrasound to assess great vessels and determine presence of pericardial effusion.',
   'Obtain all laboratory and imaging reports from the sending facility. EKGs should be completed on all dissections. Prior to transport, attempt to view chest x-ray \u2014 note size of mediastinum and evaluate for apical capping.',
   'Place at least two large bore IV lines. If unable, consider IO placement or having a provider place a central line.',
   '<strong>Blood pressures should be completed every 5 minutes during transport.</strong> Consider placement of an arterial line.',
   'Provide appropriate pain and anxiolysis per {{4.16}} and {{4.17}}.']],
 ['h','Hypotensive patient'],
 ['ul',['Titrate fluids to keep SBP at 90 systolic, or that which maintains cerebral perfusion.','Consider whole blood per {{7.1}}.','Consider vasopressors if hypotension has not responded to fluids and blood.','If HR &gt; 70 AND SBP &lt; 90, contact receiving clinician for rate control options.']],
 ['h','Hypertensive patient'],
 ['note','Consider aggressive analgesia and anxiolysis <strong>prior to</strong> progressing to antihypertensives.'],
 ['rx',{n:'Labetalol',d:'10\u201320 mg slow IV push over 2 min',r:'IV',note:'May repeat every 10 minutes with additional doses of 40 mg then 80 mg until SBP 100 mmHg or maximum total dose of 300 mg.'}],
 ['alt'],
 ['rx',{n:'Metoprolol',d:'5 mg q5 min \u00D7 3 doses',r:'IV'}],
 ['alt'],
 ['rx',{n:'Esmolol',d:'Load 500 mcg/kg over 1 min, then 50 mcg/kg/min',r:'IV',calc:{per:'kg',lo:500,u:'mcg',lbl:'loading dose'},note:'If no response, repeat loading dose and increase infusion by 50 mcg/kg/min every 5\u201315 minutes up to 300 mcg/kg/min.'}],
 ['rx',{n:'Nicardipine infusion',d:'Start 2.5 mg/hr',r:'IV infusion',note:'If SBP remains &gt; 120 mmHg after beta-blockers. Increase by 2.5 mg/hr every 5\u201315 minutes up to 15 mg/hr. Target SBP 90\u2013100.'}],
 ['h','Concurrent myocardial infarction confirmed by EKG'],
 ['crit','<b>Avoid thrombolytics, aspirin or heparin.</b> Consult immediately with the receiving physician team and transport to the appropriate destination. If hypotensive refer to {{4.13}}; if hypertensive refer to {{4.14}}.']
]});

P.push({id:'4.7',s:'4',pg:40,t:'Sepsis',sx:['sepsis','septic shock','fever','infection','lactate','norepinephrine','hypotension','vasopressor'],flags:['ev-sepsis-cvp','ev-etom-sepsis'],b:[
 ['h','Indications'],
 ['ul',['To identify those patients with septic shock.']],
 ['h','Pearls, pitfalls and considerations'],
 ['ul',['Once identified, septic shock must be treated with aggressive crystalloid infusion to maintain urine output &gt; 0.5 mL/kg/hr, a lactate less than 4.0 and a CVP of 12\u201315.','<strong>Blood cultures and appropriate antibiotic therapy and resuscitation MUST occur within 60 minutes of presentation</strong>, and prior to transport.']],
 ['crit','Given the debate on the use of <b>Etomidate</b> in sepsis due to adrenal suppression, <b>Ketamine should be considered as first-line induction agent</b> for RSI in this population.'],
 ['h','Interventions'],
 ['ul',[
   'Assess airway, breathing, and circulation. If any alteration in mental status, consider advanced airway placement per {{2.3}}.',
   'Provide supplemental oxygen to maintain SpO\u2082 &gt; 93%.',
   'Obtain at least two large bore peripheral IVs. If not possible, proceed to IO or request sending providers place a central line.',
   '<strong>Obtain core temperature (rectally if possible).</strong>',
   'If central venous access is available, monitor CVP.',
   'Prior to departure: obtain blood cultures <strong>prior to</strong> antibiotics; ensure broad-spectrum antibiotics have been administered prior to transfer.',
   'Obtain iSTAT lactate.',
   'Monitor blood glucose q1\u20132 hours. If glucose &gt; 180 mg/dL, refer to {{4.2}}.',
   'If using vasopressor therapy, it is recommended that an arterial line be placed as soon as feasibly possible.',
   'If hemoglobin \u2264 7.0, initiate packed red blood cell infusion targeting 7.0\u20139.0 g/dL \u2014 {{7.1}}.',
   'Contact receiving physician for the option of Sodium Bicarbonate if pH &lt; 7.1. There is very limited current indication for its use.']],
 ['h','Fluid resuscitation'],
 ['rx',{n:'Crystalloid bolus',d:'30 mL/kg',r:'IV',calc:{per:'kg',lo:30,u:'mL'},note:'For hypotension and/or a lactate \u2265 4.0 mmol/L. If hemodynamic status does not improve or lactate remains &gt; 4, refer to {{4.13}}.'}],
 ['h','Vasopressors \u2014 target MAP 65 mmHg. See {{4.13}}'],
 ['rx',{n:'Norepinephrine infusion',d:'2\u201330 mcg/min (0.02\u20130.1 mcg/kg/min)',r:'IV infusion',calc:{per:'kg/min',lo:0.02,hi:0.1,u:'mcg/min'}}],
 ['rx',{n:'Epinephrine infusion',d:'2\u201310 mcg/min (0.1 mcg/kg/min)',r:'IV infusion',calc:{per:'kg/min',lo:0.1,u:'mcg/min'}}],
 ['rx',{n:'Vasopressin',d:'0.03 units/min',r:'IV infusion',note:'Can be added to norepinephrine with the intent of either raising MAP or decreasing norepinephrine use. Vasopressin is a fixed medication and is typically not titrated. It should NOT be used as a single agent.'}],
 ['rx',{n:'Dobutamine infusion',d:'Salvage therapy',r:'IV infusion',note:'When combined inotrope/vasopressor drugs and low-dose vasopressin have failed to achieve MAP target, in the presence of: myocardial dysfunction suggested by elevated cardiac filling pressures and low cardiac output; or ongoing signs of hypoperfusion despite adequate intravascular volume and adequate MAP.'}],
 ['rx',{n:'Hydrocortisone',d:'100 mg',r:'IV',note:'Should be considered if the patient remains hypotensive despite aggressive fluid resuscitation and vasopressor use.'}]
]});

P.push({id:'4.8',s:'4',pg:42,t:'Hypokalemia',sx:['hypokalemia','low potassium','kcl','electrolyte','potassium replacement'],b:[
 ['h','Indications'],
 ['ul',['Any patient for whom electrolyte replacement therapy has been initiated by the referring institution.']],
 ['h','Potassium administration procedure'],
 ['ul',[
   'Verify that the patient meets criteria for urine output and serum creatinine level.',
   'Generally the patient\u2019s <strong>urine output should be more than 20 mL/hr for at least 2 hours</strong> before using this protocol.',
   'The patient\u2019s <strong>serum creatinine should be &lt; 2.0</strong> before using this protocol, unless otherwise ordered by the physician.',
   ['If serum K\u207A is less than 3.5, infuse KCl in concentrations no greater than:',['20 mEq / 50 mL D5W (or NS if indicated) for <strong>central lines</strong>','10 mEq / 100 mL D5W (or NS if indicated) for <strong>peripheral lines</strong>']]]],
 ['crit','<b>NEVER ADMINISTER KCL IV PUSH.</b> It could cause BRADYCARDIA, VENTRICULAR FIBRILLATION and ARREST.'],
 ['h','Central lines'],
 ['tbl',{h:['Serum K\u207A','KCl dose','Total'],r:[['&lt; 2.5','20 mEq KCl q1hr \u00D7 5','100 mEq'],['2.6\u20133.0','20 mEq KCl q1hr \u00D7 4','80 mEq'],['3.1\u20133.5','20 mEq KCl q1hr \u00D7 3','60 mEq']]}],
 ['h','Peripheral lines'],
 ['tbl',{h:['Serum K\u207A','KCl dose','Total'],r:[['&lt; 2.5','10 mEq KCl q1hr \u00D7 10','100 mEq'],['2.6\u20133.0','10 mEq KCl q1hr \u00D7 8','80 mEq'],['3.1\u20133.5','10 mEq KCl q1hr \u00D7 6','60 mEq']]}]
]});

P.push({id:'4.9',s:'4',pg:43,t:'Hyperkalemia',sx:['hyperkalemia','high potassium','peaked t waves','renal failure','dialysis','calcium gluconate','insulin dextrose'],b:[
 ['h','Indications \u2014 emergent treatment of hyperkalemia due to'],
 ['ul',['Decreased or impaired potassium excretion (acute or chronic renal failure)','Addition of potassium into extracellular space (medications, rhabdomyolysis, hemolysis)','Transmembrane shifts (acidosis, medication effects)','Factitious hyperkalemia (improper blood collection or lab error)']],
 ['crit','Mortality from hyperkalemia can be as high as <b>67%</b> if severe hyperkalemia is not treated rapidly.'],
 ['h','Severity'],
 ['tbl',{h:['Serum K\u207A (mEq/L)','Condition'],r:[['5.5\u20136.0','Mild'],['6.1\u20137.0','Moderate'],['\u2265 7.1','Severe']]}],
 ['h','Pearls, pitfalls and considerations'],
 ['ul',[
   'The presence of typical EKG changes or any rapid rise in serum potassium indicates hyperkalemia is potentially life threatening and warrants immediate treatment.',
   '<strong>Succinylcholine should be avoided in patients exhibiting a serum potassium above 5.5.</strong>',
   'Confirm any potassium level &gt; 5.5 prior to treatment unless the patient is hemodynamically unstable.',
   'Monitor serum potassium by iSTAT every 20\u201330 minutes after starting treatment.',
   'Perform continuous EKG monitoring with vital signs documented every five minutes.',
   'If severe (K\u207A &gt; 7.0) or symptomatic, begin treatment before investigation of the underlying cause.',
   'Individualize treatment; if not severe, the patient may only need furosemide to enhance elimination.']],
 ['crit','<b>Avoid Calcium if digoxin toxicity is suspected.</b> Magnesium Sulfate 2 g over 5 min may be used alternatively in the face of digoxin-toxic cardiac arrhythmias.'],
 ['h','Therapies'],
 ['tbl',{h:['Therapy','Adult dose','Pediatric','Onset','Duration'],r:[
   ['Calcium Gluconate','1 g over 10 min IV','100 mg/kg over 2 min','1\u20133 min','30\u201360 min'],
   ['Sodium Bicarbonate','1 mEq/kg IV bolus (max 100 mEq)','1\u20132 mEq/kg/dose','5\u201310 min','1\u20132 hr'],
   ['Insulin + Dextrose','Regular insulin 10 U IV + 25 g dextrose in 50 mL IV bolus','0.1 IU/kg + 0.5\u20131 g/kg','30 min','4\u20136 hr'],
   ['Nebulized albuterol','10\u201320 mg neb over 15 min','2.5 mg if &lt; 25 kg; 5.0 mg if &gt; 25 kg','15 min','15\u201390 min'],
   ['Furosemide','40\u201380 mg IV bolus','1 mg/kg','With onset of diuresis','Until diuretic effect ends']]}],
 ['note','Use a <strong>1 unit insulin : 2.5 g glucose</strong> ratio. Monitor for predictive K\u207A drop.'],
 ['h','Treatment by severity'],
 ['ul',[
   ['<strong>Mild (5.5\u20136.0)</strong>',['Cardiac monitor and repeat K\u207A enroute','Furosemide']],
   ['<strong>Moderate (6.0\u20137.0) without EKG changes</strong>',['The above treatments, plus Insulin &amp; Dextrose IV']],
   ['<strong>Severe (&gt; 7.0), or Moderate (6.0\u20137.0) with EKG changes</strong>',['The above treatments, plus Sodium Bicarbonate','Plus Calcium Gluconate. If there is a central line (not IO), 1 gram (an amp) of Calcium Chloride can be given alternatively.']]]],
 ['h','Special situations'],

P.push({id:'4.13',s:'4',pg:48,t:'Refractory Shock and Hypotension',sx:['shock','hypotension','vasopressor','levophed','norepinephrine','map','septic','cardiogenic','hypovolemic','neurogenic'],b:[

P.push({id:'5.1',s:'5',pg:54,t:'Abdominal and Pelvic Trauma',sx:['abdominal trauma','pelvic fracture','blunt trauma','penetrating','pelvic binder','hemorrhage','shock'],flags:['ev-txa-dose'],b:[

P.push({id:'5.2',s:'5',pg:55,t:'Burns — Major',sx:['burn','thermal','chemical burn','electrical','tbsa','parkland','escharotomy','inhalation injury','rule of nines'],flags:['ev-burn-formula','ev-peds-tbsa'],b:[
 ['h','Indications'],
 ['ul',['Any patient with chemical, electrical, or thermal burns. <strong>Chemical decontamination MUST occur prior to transport.</strong>']],
 ['note','For scene flights with patients who have sustained second or third degree burns greater than <strong>15% TBSA</strong>, transport to the Blocker Burn Unit at UTMB in Galveston, TX.'],
 ['h','Interventions'],
 ['ul',[
   'Stop the burning process and remove all clothing. Thoroughly rinse chemicals off with water, with the exception of powdered chemicals which should be brushed off.',

 ['ul',['If intubated, refer to {{2.4}}. If adequate spontaneous respirations, administer supplemental oxygen to maintain SpO\u2082 &gt; 93% \u2014 consider 100% via NRB due to concerns of CO poisoning.','If bronchospasm is present, consider Albuterol \u2014 {{2.5}}.']],

 ['note','<strong>Maintenance fluids:</strong> for pediatric patients, maintenance fluids with dextrose (D5NS) must be calculated and administered <em>in addition to</em> consensus fluids.'],

 ['h','Wound care'],

P.push({id:'5.4',s:'5',pg:60,t:'Extremity Trauma',sx:['extremity trauma','fracture','amputation','tourniquet','compartment syndrome','crush injury','bleeding'],flags:['ev-txa-dose'],b:[

 ['ul',['Any patient exhibiting signs and symptoms of trauma to the extremities.']],
 ['h','Interventions'],
 ['ul',[
   'Assess critical systems first including airway, breathing, and circulation <strong>prior to</strong> addressing extremity trauma.',
   'Control external hemorrhage with direct pressure, elevation of extremity, and/or hemostatic gauze \u2014 {{7.16}}.',
   'If unable to control bleeding, consider a <strong>tourniquet proximal to the site of injury</strong>.',
   'Assess extremity for pulse, circulation, sensation, and motor function.',
   'Stabilize impaled objects. Identify significant swelling, discoloration, deformities or angulation/shortening.',

 ['h','Fractures'],
 ['ul',['Reduce and splint fractures, if possible, by clinician or staff before departure. <strong>Do not reduce fractures if increased pain or resistance is encountered.</strong>','Assess tetanus immunization status in all trauma patients.']],
 ['h','Amputation'],
 ['ul',[
   ['<strong>Complete amputation</strong>',['Wrap part in saline soaked gauze, place in water-tight zip lock bag, place bag in cold water filled container; save for possible reimplantation.','<strong>DO NOT SOAK AMPUTATED PART DIRECTLY IN WATER.</strong>','Wrap stump in sterile saline moistened dressing and pressure dressings.']],
   ['<strong>Partial amputation</strong>',['Place in anatomical position and splint.','Wrap in bulky sterile saline moistened dressing and keep moist.','Save any avulsed part. Treat pain per {{4.16}}.','Pulse oximetry or doppler may be used to establish status of pulses.']]]],
 ['h','Crush syndrome \u2014 extremity'],
 ['crit','Significant crush syndromes: <b>one extremity crushed for &gt; 2 hours</b>, or <b>two extremities crushed for &gt; 1 hour</b>.'],
 ['ul',['Establish two IVs.','Administer crystalloid fluid therapy as needed to maintain SBP &gt; 90 mmHg.','Alkalinization (if the patient meets diagnostic criteria for crush syndrome) <strong>PRIOR TO EXTRICATION</strong>.','If hyperkalemia is suspected (PVCs, QRS &gt; 0.12, or peaked T-waves) refer to {{4.9}}.']],
 ['rx',{n:'Sodium Bicarbonate 8.4% (adult)',d:'50 mEq \u00D7 1',r:'IV'}],
