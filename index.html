var STOP = {the:1,of:1,a:1,an:1,for:1,with:1,and:1,in:1,to:1,my:1,is:1,on:1,not:1,no:1,
  dose:1,dosing:1,patient:1,pt:1,push:1,give:1,what:1,how:1,need:1,protocol:1,pcg:1};
function normQ(q){
  var t = q.toLowerCase().replace(/[^a-z0-9. ]/g,' ').split(/\s+/).filter(function(w){ return w && !STOP[w]; });
  var out = [];
  t.forEach(function(w){ out.push(w); if(SYN[w]) SYN[w].split(' ').forEach(function(x){out.push(x);}); });
  return {terms:t, expanded:out};
}
function drugNames(p){
  var n = [];
  p.b.forEach(function(b){ if(b[0] === 'rx' && b[1].n) n.push(String(b[1].n).replace(/<[^>]+>/g,'').toLowerCase()); });
  return n;
}
var DRUGS_OF = {}; P.forEach(function(p){ DRUGS_OF[p.id] = drugNames(p); });
function rx_(w){ return new RegExp('\\b' + w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')); }

function search(q){
  var strict = search1(q, false);
  return strict.length ? strict : search1(q, true);
}
function search1(q, loose){
  var nq = normQ(q);
  if(!nq.terms.length) return [];
  var pedIntent = nq.expanded.indexOf('pediatric') > -1 || nq.expanded.indexOf('child') > -1;
  var res = [];
  P.forEach(function(p){
    var title = p.t.toLowerCase(), sxa = (p.sx || []).map(function(x){ return x.toLowerCase(); }),
        sx = sxa.join(' '), dn = DRUGS_OF[p.id].join(' '),
        hay = title + ' ' + sx + ' ' + dn + ' ' + p.id;
    var score = 0, all = true;
    nq.terms.forEach(function(w){
      var s = 0;
      if(p.id.toLowerCase() === w || p.id.toLowerCase().indexOf(w) === 0) s = 240;
      else if(title === w) s = 200;
      else if(title.indexOf(w) === 0) s = 140;
      else if(rx_(w).test(title)) s = 112;
      else if(rx_(w).test(dn)) s = 88;
      else if(title.indexOf(w) > -1) s = 76;
      else if(rx_(w).test(sx)){
        var at = -1;
        for(var i = 0; i < sxa.length; i++){ if(rx_(w).test(sxa[i])){ at = i; break; } }
        var term = at < 0 ? '' : sxa[at];
        var base = (term === w) ? 120 : (term.indexOf(w) === 0 ? 110 : 100);
        s = base - Math.min(at < 0 ? 6 : at, 6) * 8;
      }
      else if(hay.indexOf(w) > -1) s = 38;
      else if(SYN[w]){
        var alt = SYN[w].split(' ');
        for(var j = 0; j < alt.length; j++){ if(rx_(alt[j]).test(hay)){ s = 30; break; } }
      }
      if(s === 0 && w.length >= 6 && rx_(w.slice(0, Math.min(w.length - 1, 6))).test(hay)) s = 20;
      if(s === 0) all = false;
      score += s;
    });
    if(!all){ if(!loose) return; score = Math.round(score * 0.45); if(score <= 0) return; }
    if(pedIntent) score += p.ped ? 70 : -25;
    else if(isPed() && p.ped) score += 45;
    else if(!isPed() && hasPt() && p.ped) score -= 20;
    if(p.stub) score -= 15;
    if(p.rev) score += 10;
    if(score > 0){
      var hits = [];
      DRUGS_OF[p.id].forEach(function(d){
        nq.terms.forEach(function(w){ if(d.indexOf(w) > -1 && hits.indexOf(d) < 0) hits.push(d); });
      });
      res.push({p:p, s:score, drug:hits[0]});
    }
  });
  res.sort(function(a,b){ return b.s - a.s || (a.p.id < b.p.id ? -1 : 1); });
  return res.slice(0, 26);
}
/* skills are searchable too */
function searchSkills(q){
  var nq = normQ(q);
  if(!nq.terms.length) return [];
  return SKILLS.filter(function(s){
    var hay = (s.t + ' ' + s.sub + ' ' + s.cat + ' ' + s.id + ' ' +
      s.steps.map(function(x){return x.t;}).join(' ')).toLowerCase();
    return nq.terms.every(function(w){ return hay.indexOf(w) > -1; }) ||
           nq.expanded.some(function(w){ return w.length > 2 && hay.indexOf(w) > -1; });
  }).slice(0,4);
}

 {re:/drown|submersion|near drown/i,                  a:['5.7','6.4']},
 {re:/hypotherm|cold exposure|frostbite/i,            a:['6.4']},
 {re:/hypertherm|heat stroke|heat exhaust/i,          a:['6.3']},
 {re:/ocular|\beye\b|globe|retinal|chemical splash/i, a:['5.8']},
 {re:/crush|entrap|compartment|rhabdo/i,              a:['5.4','4.9','7.2']},
 {re:/multi.?system|polytrauma|major trauma|\bmvc\b|\bmva\b|ejected|rollover|motorcycle|pedestrian struck/i, a:['5.6','5.3','5.1','5.4','7.1','7.2']},
 {re:/gunshot|\bgsw\b|stab|penetrat|impal/i,          a:['5.3','5.1','7.1','7.2']},
 {re:/fall|fell from/i,                               a:['5.6','5.9','5.4']},

 {re:/eclamp|\bpih\b|hellp|pregnancy induced hyperten|magnesium tox/i, a:['O.4']},
 {re:/preterm|\bptl\b|tocoly|terbutalin|\bppro?m\b|rupture of membran/i, a:['O.5']},
 {re:/postpartum|\bpph\b|uterine aton|pitocin|cytotec/i, a:['O.6','O.3']},
 {re:/abruption|previa|ectopic|uterine rupture|vaginal bleed/i, a:['O.3']},
 {re:/deliver|crowning|breech|shoulder dystocia|prolapsed cord|childbirth|in labor/i, a:['O.6']},
 {re:/newborn|neonat|\bapgar\b|\bnrp\b|just delivered/i, a:['O.7']},
 {re:/pregnan|gravid|\bg\d+p\d+|weeks gestation|\d+\s*weeks/i, a:['O.1','O.3'], soft:1},
 {re:/trauma in pregnan|pregnant.*(mvc|crash|fall)/i, a:['9.8','O.3','5.1']}
];

function lexHits(){
  var out = {}, ped = isPed(), dx = PT.dx;
  if(!dx.trim()) return out;
  LEX.forEach(function(L){
    if(!L.re.test(dx)) return;
    var list = (ped && L.p) ? L.p.concat(L.a || []) : (L.a || []);
    var base = L.soft ? 62 : 175;
    list.forEach(function(id, j){ out[id] = Math.max(out[id] || 0, base - j * 14); });
  });
  /* obstetric context re-points a handful of general presentations */
  if(isOB()){
    if(/seiz|convuls|eclamp|fitting/i.test(dx))                 out['O.4'] = 210;
    if(/hyperten|\bhtn\b|\bpih\b|hellp|preeclamp|pre-eclamp|proteinuria|\b1[4-9]\d\s*\/\s*\d{2,3}|\b2\d\d\s*\/\s*\d{2,3}|headache|seeing spots|photophob|\bruq\b/i.test(dx)) out['O.4'] = Math.max(out['O.4']||0, 200);
    if(/bleed|hemorrhag|abrupt|previa|shock|hypotens/i.test(dx)) out['O.3'] = Math.max(out['O.3']||0, 200);
    if(/sugar|glucose|\bdka\b|hypogly|hypergly|diabet/i.test(dx)) out['O.2'] = Math.max(out['O.2']||0, 200);
    if(/preterm|contraction|tocoly|\bppro?m\b|membran/i.test(dx)) out['O.5'] = Math.max(out['O.5']||0, 200);
    if(/deliver|crowning|breech|dystocia|prolapse|labor/i.test(dx)) out['O.6'] = Math.max(out['O.6']||0, 200);
    if(/newborn|neonat|apgar|\bnrp\b/i.test(dx))               out['O.7'] = Math.max(out['O.7']||0, 205);
    ['4.12','8.10','4.14','4.13'].forEach(function(id){ if(out[id]) out[id] = Math.min(out[id], 70); });
  }
  return out;
}

/* ---------- case engine ---------- */
/* assessment and policy guidelines: useful, but never the headline */
var GENERIC = {'1.1':1,'1.2':1,'8.1':1,'O.1':1,'2.1':1};

function skillScope(sk){
  var w = kg(), a = ageY();
  if(sk.id === 'finger-thoracostomy' || sk.id === 'chest-tube'){
    if(w == null) return {ok:null, why:'Guideline requires > 36 kg — enter a weight to confirm scope'};
    return w > 36
      ? {ok:true,  why:'In scope at ' + fmt(w,'') + ' kg'}
      : {ok:false, why:'Out of scope at ' + fmt(w,'') + ' kg — the guideline requires > 36 kg. Use chest decompression.'};
  }
  if(sk.id === 'rsi-adult'){
    if(a != null && a <= 12) return {ok:false, why:'Age ' + fmt(a,'') + ' — this guideline is for age > 12 or longer than the Broselow tape. Use the pediatric RSI guide.'};
    return {ok:true, why:a != null ? 'In scope at ' + fmt(a,'') + ' yr' : 'Adult drug-assisted intubation'};
  }
  if(sk.id === 'rsi-peds'){
    if(a != null && a > 12) return {ok:false, why:'Age ' + fmt(a,'') + ' — use the adult DAI guide.'};
    return {ok:true, why:a != null ? 'In scope at ' + fmt(a,'') + ' yr' : 'Pediatric rapid sequence intubation'};
  }
  if(sk.id === 'needle-cric'){
    if(a != null && a >= 10) return {ok:false, why:'Age ' + fmt(a,'') + ' — surgical cricothyroidotomy is the indicated route.'};
    return {ok:true, why:a != null ? 'Indicated route under 10 yr' : 'Children under 10'};
  }
  if(sk.id === 'surgical-cric'){
    if(a != null && a < 10) return {ok:false, why:'Under 10 yr — contraindicated. Use needle cricothyroidotomy.'};
    return {ok:true, why:a != null ? 'In scope at ' + fmt(a,'') + ' yr' : 'Adult failed airway'};
  }
  return {ok:true, why:'Any age'};
}

/* rank every guideline against the current case */
function caseRank(){
  var sc = {}, ped = isPed(), ob = isOB();
  PT.tags.forEach(function(i){
    var c = CHIPS[i];
    if(!c) return;
    c.ids.forEach(function(id, j){ sc[id] = (sc[id] || 0) + (120 - j * 12); });
  });
  var lex = lexHits(), lexed = Object.keys(lex).length;
  Object.keys(lex).forEach(function(id){ sc[id] = (sc[id] || 0) + lex[id]; });
  if(PT.dx.trim()){
    search(PT.dx).slice(0, lexed ? 5 : 10).forEach(function(r, j){
      sc[r.p.id] = (sc[r.p.id] || 0) + (lexed ? Math.max(12, 55 - j * 9) : Math.max(24, 130 - j * 11));
    });
  }
  /* pediatric patient: pull the pediatric counterpart of every adult hit into the list */
  if(ped) Object.keys(sc).slice().forEach(function(id){
    var c = PEDMAP[id];
    if(c && BY[c]) sc[c] = Math.max(sc[c] || 0, sc[id] + 30);
  });
  /* adult patient sitting on a pediatric hit: pull the adult counterpart in */
  if(!ped && hasPt()) Object.keys(sc).slice().forEach(function(id){
    var c = ADLMAP[id];
    if(c && BY[c]) sc[c] = Math.max(sc[c] || 0, sc[id] + 30);
  });

  /* mechanism words in free text pull the trauma section up as a block */
  var traumaMech = /\bmvc\b|\bmva\b|\bcrash\b|collision|wreck|motorcycle|ejected|rollover|\bfall\b|\bfell\b|gsw|gunshot|stab|penetrat|blast|explos|assault|struck|pedestrian|entrap|crushed|crush injur|amputat|impal|blunt (chest|abdom|trauma|force)/i.test(PT.dx);
  var out = [];
  Object.keys(sc).forEach(function(id){
    var p = BY[id];
    if(!p) return;
    var s = sc[id];
    if(traumaMech){
      if(p.s === '5') s += 70;
      else if(p.s === '7') s += 15;
    }
    if(ob && p.ob) s += 150;
    else if(ob && p.s === '9') s += 60;
    else if(!ob && (p.ob || p.s === '9')) s -= 140;
    if(ped && p.ped) s += 95;
    if(ped && !p.ped && PEDMAP[id]) s -= 55;
    if(!ped && hasPt() && p.ped && !ob) s -= 70;
    if(p.stub) s -= 40;
    if(p.rev) s += 10;
    if(GENERIC[id]) s -= 55;
    if(!ped && hasPt() && p.ped) s -= 60;
    if(s <= (lexed ? 62 : 20)) return;
    out.push({p:p, s:s});
  });
  out.sort(function(a,b){ return b.s - a.s || (a.p.id < b.p.id ? -1 : 1); });
  return out;
}

/* skills relevant to the current case, scope-checked */
function caseSkills(){
  var want = {}, hard = {}, ped = isPed();
  PT.tags.forEach(function(i){
    var c = CHIPS[i];
    if(c && c.sk) c.sk.forEach(function(id, j){ want[id] = (want[id] || 0) + (60 - j * 6); hard[id] = 1; });
  });
  if(PT.dx.trim()) searchSkills(PT.dx).forEach(function(s, j){ want[s.id] = (want[s.id] || 0) + (58 - j * 12); });
  var list = Object.keys(want).map(function(id){
    var s = SK[id];
    if(!s) return null;
    var sp = skillScope(s), score = want[id];
    /* an airway skill for the wrong age band is noise unless the clinician asked for it */
    if(sp.ok === false && !hard[id]) return null;
    if(sp.ok === false) score -= 200;
    if(ped && s.cls === 'ped') score += 45;
    if(!ped && hasPt() && s.cls === 'ped') score -= 45;
    if(score < 18) return null;
    return {s:s, score:score, scope:sp};
  }).filter(Boolean);
  list.sort(function(a,b){ return b.score - a.score; });
  return list.slice(0, 4);
}

    if(ped){
      card('card','Cardioversion', fmt(w * 0.5,'J') + ' / ' + fmt(w,'J') + ' J', '0.5 then 1 J/kg');
      card('ped','Arrest epinephrine', fmt(w * 0.01,'mg') + ' mg', fmt(w * 0.1,'mL') + ' mL of 1:10,000 · 0.01 mg/kg');
      card('ped','Maintenance', dose({per:'421',u:'mL/hr'}).v + ' mL/hr', '4-2-1');
    }
    card('sed','Fentanyl 1–2 mcg/kg', fmt(w,'mcg') + '–' + fmt(Math.min(w * 2, 100),'mcg') + ' mcg', 'max single dose 100 mcg');
    card('sed','Ketamine 1–2 mg/kg', fmt(w,'mg') + '–' + fmt(w * 2,'mg') + ' mg', 'induction');
    card('sed','Rocuronium', ped ? fmt(w,'mg') + ' mg' : fmt(w * 0.6,'mg') + '–' + fmt(w * 1.2,'mg') + ' mg', ped ? '1 mg/kg' : '0.6–1.2 mg/kg');

  if(!v.length) return '';
  return '<div class="cgrp"><div class="cglab">Set for this patient</div><div class="vitgrid">' + v.join('') + '</div></div>';
}

/* the first few dosed medications of a guideline, inline */
function miniRx(p, n){
  var rows = [], count = 0;
  for(var i = 0; i < p.b.length && count < (n || 4); i++){
    if(p.b[i][0] !== 'rx') continue;
    var r = p.b[i][1], d = dose(r.calc);
    count++;
    var val = '';
    if(!d) val = '<span class="mrd">' + esc(String(r.d || '').replace(/<[^>]+>/g,'')) + '</span>';
    else if(d.need) val = '<span class="mrw">needs ' + (d.need === 'tbsa' ? '%TBSA' : 'weight') + '</span>';
    else val = '<span class="mrv">' + d.v + '</span><span class="mru">' + esc(d.u) + '</span>';
    rows.push('<div class="mr"><span class="mrn">' + xr(r.n) + '</span>' + val +
      (r.r ? '<span class="mrd">' + esc(r.r) + '</span>' : '') + '</div>');
  }
  return rows.length ? '<div class="mini-rx">' + rows.join('') + '</div>' : '';
}

function caseHTML(){
  if(!hasCase()) return '';
  var ranked = caseRank(), sks = caseSkills(), ped = isPed(), ob = isOB(), w = kg(), a = ageY();
  var cls = ob ? 'k-ob' : (ped ? 'k-ped' : 'k-adult');
  var who = ob ? 'OBSTETRIC' : (ped ? 'PEDIATRIC' : (hasPt() ? 'ADULT' : 'NO PATIENT DATA'));
  var bits = [];
  if(a != null) bits.push('<b>' + (PT.au === 'm' ? PT.age + ' months' : fmt(a,'') + ' years') + '</b>');
  if(w != null) bits.push('<b>' + fmt(w,'') + ' kg</b>' + (PT.wu === 'lb' ? ' (' + fmt(PT.wt,'') + ' lb)' : ''));
  if(cm() != null) bits.push('<b>' + fmt(cm(),'') + ' cm</b>');
  var label = PT.tags.map(function(i){ return CHIPS[i] ? CHIPS[i].l : ''; }).filter(Boolean).join(' · ');
  if(PT.dx.trim()) label = label ? label + ' · ' + PT.dx.trim() : PT.dx.trim();

  var h = ['<div class="caseband ' + cls + '">'];
  h.push('<div class="cbt"><h2>' + esc(label || 'Patient loaded') + '</h2><span class="pill">' + who + '</span></div>');
  h.push('<p>' + (bits.length ? bits.join(' &nbsp;·&nbsp; ') : 'No age or weight yet — add one and every dose below fills in.') +
    (w == null ? ' &nbsp;·&nbsp; <button class="xref" type="button" data-focus="iWt" style="border:none;padding:0">add weight →</button>' : '') + '</p>');
  h.push('</div>');

  if(!ranked.length){
    h.push('<div class="empty"><b>Tell me what is going on</b>Tap a presentation or mechanism above, or type it in — the guideline, the doses and the procedures come to you.</div>');
    h.push(vitalsHTML());
    return h.join('');
  }

  /* primary */
  var top = ranked[0].p, K = keyOf(top), nrx = top.b.filter(function(b){ return b[0] === 'rx'; }).length;
  h.push('<div class="cgrp"><div class="cglab ' + K + '">Start here</div>');
  h.push('<div class="primary ' + K + '">');
  h.push('<div class="ph1"><span class="pn">' + top.id + '</span><h2>' + esc(top.t) +
    '<span class="sub">' + esc(SEC[top.s].t) + (top.rev ? ' · Rev ' + top.rev : '') + ' · source p.' + top.pg +
    (nrx ? ' · ' + nrx + ' medication' + (nrx > 1 ? 's' : '') : '') + '</span></h2></div>');
  h.push(miniRx(top, 4));
  h.push('<div class="pacts"><a class="go" href="#p/' + top.id + '">Open guideline</a>' +
    (nrx ? '<a href="#d/' + top.id + '">Doses only</a>' : '') + '</div>');
  h.push('</div></div>');

  /* skills */
  if(sks.length){
    h.push('<div class="cgrp"><div class="cglab k-proc">Procedures for this patient</div><div class="skgrid">');
    sks.forEach(function(x){
      h.push('<a class="skcard k-' + x.s.cls + (x.scope.ok === false ? ' off' : '') + '" href="#sk/' + x.s.id + '/0">' +
        '<span class="ic">' + x.s.icon + '</span><h3>' + esc(x.s.t) + '</h3><p>' + esc(x.s.sub) + '</p>' +
        '<em' + (x.scope.ok === false ? ' class="no"' : '') + '>' + (x.scope.ok === false ? 'out of scope' : x.s.steps.length + ' steps') + '</em></a>');
    });
    h.push('</div>');
    sks.forEach(function(x){
      if(x.scope.ok === false) h.push('<div class="skscope no">✕ ' + esc(x.s.t) + ' — ' + esc(x.scope.why) + '</div>');
      else if(x.scope.ok === true && hasPt()) h.push('<div class="skscope ok">✓ ' + esc(x.s.t) + ' — ' + esc(x.scope.why) + '</div>');
    });
    h.push('</div>');
  }

  /* also consider */
  var rest = ranked.slice(1, 7);
  if(rest.length){
    h.push('<div class="cgrp"><div class="cglab">Also consider</div>');
    rest.forEach(function(x){
      var n = x.p.b.filter(function(b){ return b[0] === 'rx'; }).length;
      h.push(itemHTML(x.p, SEC[x.p.s].t + ' · p.' + x.p.pg + (n ? ' · ' + n + ' medication' + (n>1?'s':'') : '')));
    });
    h.push('</div>');
  }

  h.push(vitalsHTML());
  return h.join('');
}

  PT.tags.forEach(function(i){
    var c = CHIPS[i];
    if(c) h.push('<button class="qc k-' + c.k + '" type="button" data-chip="' + i + '" aria-pressed="true">' + esc(c.l) + ' ×</button>');
  });
  var shown = 0;
  CHIPS.forEach(function(c, i){
    if(PT.tags.indexOf(i) > -1) return;
    if(shown > 40) return;
    if(isOB() && !c.ob && shown > 12) return;
    shown++;
    h.push('<button class="qc k-' + c.k + '" type="button" data-chip="' + i + '" aria-pressed="false">' + esc(c.l) + '</button>');
  });
  return h.join('');
}

function render(){
  var hash = location.hash.replace(/^#/,''), html;
  if(hash.indexOf('sk/') === 0){
    var pr = hash.slice(3).split('/');
    html = viewSkill(pr[0], pr[1] || 0);
  }
  else if(hash === 'skills')        html = viewSkills();
  else if(hash.indexOf('p/') === 0) html = viewProtocol(hash.slice(2));
  else if(hash.indexOf('s/') === 0) html = viewSection(hash.slice(2));
  else if(hash.indexOf('d/') === 0) html = viewDoseSheet(hash.slice(2));
  else if(hash === 'doses')         html = viewDoses();
  else if(hash === 'rx')            html = viewForm();
  else if(hash === 'rxp')           html = viewRxProto();
  else if(hash.indexOf('calc/') === 0) html = viewCalc(hash.slice(5));
  else if(hash === 'calc')          html = viewCalc('nines');
  else if(hash.indexOf('mcs/') === 0)  html = viewMCSDevice(hash.slice(4));
  else if(hash === 'mcs')           html = viewMCS();
  else if(hash === 'ask')           html = viewAI();
  else if(hash === 'ev')            html = viewEv();
  else if(hash === 'about')         html = viewAbout();
  else                              html = viewHome();
  VIEW.innerHTML = html;
  $('#ptmeta').innerHTML = metaHTML();
  $('#qchips').innerHTML = qchipsHTML();
  paintScene();
  var cur = navFor(hash);
  document.querySelectorAll('#nav a').forEach(function(a){
    if(a.dataset.r === cur) a.setAttribute('aria-current','page'); else a.removeAttribute('aria-current');
  });
}

/* activate the scene and phase named by the current step */
function paintScene(){
  var hash = location.hash.replace(/^#/,'');
  if(hash.indexOf('sk/') !== 0) return;
  var pr = hash.slice(3).split('/'), s = SK[pr[0]];
  if(!s) return;
  var st = s.steps[Math.max(0, Math.min((pr[1]|0), s.steps.length - 1))];
  VIEW.querySelectorAll('.sc').forEach(function(g){
    g.classList.toggle('on', g.getAttribute('data-sc') === st.sc);
  });
  VIEW.querySelectorAll('.ph').forEach(function(g){
    g.classList.toggle('on', !!st.ph && g.getAttribute('data-ph') === st.ph);
  });
}

var lastHash = null;
window.addEventListener('hashchange', function(){
  var h = location.hash;
  render();
  if(h !== lastHash) window.scrollTo(0, 0);
  lastHash = h;
});

function repaint(){
  var y = window.scrollY, act = document.activeElement, id = act ? act.id : null,
      sel = (act && act.selectionStart != null) ? act.selectionStart : null;
  render();
  if(id){
    var back = document.getElementById(id);
    if(back){
      back.focus();
      if(sel != null && back.setSelectionRange){ try{ back.setSelectionRange(sel, sel); }catch(e){} }
    }
  }
  window.scrollTo(0, y);
}

/* ---------- input wiring ---------- */
function num(v){ var n = parseFloat(v); return (v === '' || isNaN(n) || n < 0) ? null : n; }
['iAge','iWt','iHt'].forEach(function(id){
  var el = document.getElementById(id);
  el.addEventListener('input', function(){
    var v = num(el.value);
    if(id === 'iAge') PT.age = v;
    if(id === 'iWt')  PT.wt  = v;
    if(id === 'iHt')  PT.ht  = v;
    el.closest('.fld').classList.toggle('on', v != null);
    repaint();
  });
});
document.querySelectorAll('.unit button').forEach(function(b){
  b.addEventListener('click', function(){
    var grp = b.parentNode, key = b.dataset.au ? 'au' : (b.dataset.wu ? 'wu' : 'hu'),
        val = b.dataset.au || b.dataset.wu || b.dataset.hu;
    if(PT[key] === val) return;
    PT[key] = val;
    grp.querySelectorAll('button').forEach(function(x){ x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); });
    repaint();
  });
});

document.addEventListener('click', function(e){
  var t = e.target;

  var nav = t.closest && t.closest('[data-sknav]');
  if(nav && !nav.disabled){
    var hash = location.hash.replace(/^#/,'');
    if(hash.indexOf('sk/') === 0){
      location.hash = 'sk/' + hash.slice(3).split('/')[0] + '/' + nav.dataset.sknav;
      var sc = VIEW.querySelector('.scene');
      setTimeout(function(){ if(sc) sc.scrollIntoView({behavior:'smooth', block:'start'}); }, 20);
    }
    return;
  }

  var chip = t.closest && t.closest('[data-chip]');
  if(chip){
    var i = +chip.dataset.chip, at = PT.tags.indexOf(i);
    if(at > -1) PT.tags.splice(at, 1); else PT.tags.push(i);
    if(location.hash && location.hash !== '#'){ location.hash = ''; return; }
    var y = window.scrollY;
    render();
    window.scrollTo(0, chip.closest('#qchips') ? y : 0);
    return;
  }

  var foc = t.closest && t.closest('[data-focus]');
  if(foc){
    $('#pt').classList.remove('mini');
    var f = document.getElementById(foc.dataset.focus);
    if(f){ window.scrollTo(0,0); f.focus(); f.select(); }
    repaint();
    return;
  }

  var bz = t.closest && t.closest('[data-bz]');
  if(bz){
    var id = bz.getAttribute('data-bz');
    CS.burn[id] = !CS.burn[id];
    var yb = window.scrollY; render(); window.scrollTo(0, yb);
    return;
  }
  if(t.closest && t.closest('[data-bzclear]')){ CS.burn = {}; repaint(); return; }
  if(t.closest && t.closest('[data-bzsend]')){
    PT.tbsa = ninesTotal();
    location.hash = 'd/5.2';
    return;
  }
  var aiq = t.closest && t.closest('[data-aiq]');
  if(aiq){ aiAsk(aiq.getAttribute('data-aiq')); return; }
  if(t.closest && t.closest('[data-aiclear]')){ AI.msgs = []; AI.err = ''; render(); return; }
  var akb = t.closest && t.closest('[data-aikey]');
  if(akb){
    if(akb.getAttribute('data-aikey') === 'save'){
      var f = document.getElementById('aikey');
      aiSaveKey(f ? f.value.trim() : '');
    } else aiSaveKey('');
    AI.err = '';
    render();
    return;
  }
  if(t.id === 'aisend'){
    var q = document.getElementById('aiq');
    if(q && q.value.trim()){ var v = q.value; q.value = ''; aiAsk(v); }
    return;
  }
  if(t.id === 'srchx'){ Q = ''; render(); var s = $('#srch'); if(s) s.focus(); return; }
  if(t.id === 'pttog'){ $('#pt').classList.toggle('mini'); repaint(); return; }
  if(t.id === 'themebtn'){ toggleTheme(); return; }
  if(t.closest && t.closest('[data-openall]')){
    OPENALL = !OPENALL;
    var yo = window.scrollY; render(); window.scrollTo(0, yo);
    return;
  }
  var jm = t.closest && t.closest('[data-jump]');
  if(jm){
    e.preventDefault();
    var sec = document.getElementById('sec' + jm.getAttribute('data-jump'));
    if(sec){ sec.open = true; sec.scrollIntoView({behavior:'smooth', block:'start'}); }
    return;
  }
  if(t.id === 'ptclear'){
    PT.age = PT.wt = PT.ht = PT.tbsa = null;
    PT.dx = ''; PT.tags = [];
    $('#iDx').value = '';
    ['iAge','iWt','iHt'].forEach(function(id){
      var el = document.getElementById(id); el.value = ''; el.closest('.fld').classList.remove('on');
    });
    repaint();
    return;
  }
});

function csSet(path, val){
  var p = path.split('.');
  if(p.length === 2 && CS[p[0]]) CS[p[0]][p[1]] = val;
}
document.addEventListener('change', function(e){
  var k = e.target.getAttribute && e.target.getAttribute('data-cs');
  if(k && e.target.tagName === 'SELECT'){
    csSet(k, e.target.value);
    if(k === 'conc.drug'){
      var d = CONC[e.target.value];
      if(d){ CS.conc.c = String(d.v); CS.conc.cU = d.u; }
    }
    repaint();
  }
});
document.addEventListener('input', function(e){
  var ck = e.target.getAttribute && e.target.getAttribute('data-cs');
  if(ck && e.target.tagName === 'INPUT'){ csSet(ck, e.target.value); repaint(); return; }
  if(e.target.id === 'iDx'){
    PT.dx = e.target.value;
    if(location.hash && location.hash !== '#'){ location.hash = ''; }
    repaint();
  }
  else if(e.target.id === 'srch'){ Q = e.target.value; repaint(); }
  else if(e.target.id === 'rxq'){ RXQ = e.target.value; repaint(); }
  else if(e.target.id === 'dq'){ DQ = e.target.value; repaint(); }
  else if(e.target.classList && e.target.classList.contains('tbsain')){
    var v = parseFloat(e.target.value);
    PT.tbsa = (isNaN(v) || v <= 0) ? null : Math.min(v, 100);
    repaint();
  }
});

document.addEventListener('keydown', function(e){
  var hash = location.hash.replace(/^#/,''), tag = document.activeElement.tagName;
  if(e.key === 'Enter' && e.target.id === 'aiq' && e.target.value.trim()){
    var v = e.target.value; e.target.value = ''; aiAsk(v); return;
  }
  if((e.key === 'Enter' || e.key === ' ') && e.target.closest && e.target.closest('[data-bz]')){
    e.preventDefault();
    var bid = e.target.closest('[data-bz]').getAttribute('data-bz');
    CS.burn[bid] = !CS.burn[bid];
    var yy = window.scrollY; render(); window.scrollTo(0, yy);
    return;
  }
  if(e.key === '/' && tag !== 'INPUT' && tag !== 'SELECT'){
    e.preventDefault();
    if(hash && hash !== '') location.hash = '';
    setTimeout(function(){ var s = $('#srch'); if(s) s.focus(); }, 30);
  }
  if(hash.indexOf('sk/') === 0 && tag !== 'INPUT'){
    var pr = hash.slice(3).split('/'), s = SK[pr[0]], n = pr[1]|0;
    if(!s) return;
    if(e.key === 'ArrowRight' && n < s.steps.length - 1){ e.preventDefault(); location.hash = 'sk/' + pr[0] + '/' + (n+1); }
    if(e.key === 'ArrowLeft'  && n > 0){ e.preventDefault(); location.hash = 'sk/' + pr[0] + '/' + (n-1); }
  }
  if(e.key === 'Escape'){
    var a = document.activeElement;
    if(a && a.id === 'srch' && Q){ Q = ''; render(); $('#srch').focus(); }
  }
});

render();

/* ================= PWA runtime ================= */
(function(){
  var net = document.getElementById('netbadge');
  function paintNet(){ net.classList.toggle('on', !navigator.onLine); }
  window.addEventListener('online', paintNet);
  window.addEventListener('offline', paintNet);
  paintNet();
  var deferred = null, btn = document.getElementById('pwabtn');
  window.addEventListener('beforeinstallprompt', function(e){ e.preventDefault(); deferred = e; btn.classList.add('on'); });
  btn.addEventListener('click', function(){ btn.classList.remove('on'); if(deferred){ deferred.prompt(); deferred = null; } });
  window.addEventListener('appinstalled', function(){ btn.classList.remove('on'); deferred = null; });
  var toast = document.getElementById('uptoast');
  toast.addEventListener('click', function(){ location.reload(); });
  if('serviceWorker' in navigator){
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('sw.js').then(function(reg){
        if(reg.waiting) toast.classList.add('on');
        reg.addEventListener('updatefound', function(){
          var w = reg.installing; if(!w) return;
          w.addEventListener('statechange', function(){
            if(w.state === 'installed' && navigator.serviceWorker.controller) toast.classList.add('on');
          });
        });
      }).catch(function(){});
    });
  }
})();
